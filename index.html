  const c=byCat(t.c), tpl=document.getElementById('t'+id), g=c.groups.find(x=>x.ids.includes(id)), ids=g.ids, k=ids.indexOf(id);
  const evs=hasTL()?TL.events.filter(vis).filter(e=>link(e).includes(id)).sort((x,y)=>(x.s||'').localeCompare(y.s||'')):[];
  const banner=evs.length?`<div class="callout tlb"><b>📌 בציר השנתי</b>${evs.map(e=>{const r=rel(e);return `<div class="evb${isPast(e)?' past':''}"><span class="dt">${range(e)}</span> ${esc(e.n)}${e.u?` <span class="chip g">${esc(e.u)}</span>`:''}${r?` <span class="chip on">${r}</span>`:''}${e.p?`<small class="bn">${esc(e.p)}</small>`:''}${e.o?`<small class="bn">הערות: ${esc(e.o)}</small>`:''}</div>`}).join('')}</div>`:'';
  app.innerHTML=`<div class="crumbs">${a('','ראשי')} › ${a('c/'+c.id,c.t)}${g.t?' › '+g.t:''}</div>
   <h1>${esc(t.t)} ${chip(t)}</h1>${banner}<article id="art"></article>
   <div class="nav">${k>0?a('t/'+ids[k-1],'‹ '+esc(T[ids[k-1]].t),'btn'):'<span></span>'}
   <button class="btn" onclick="print()">🖨️ הדפסה</button>
   ${k<ids.length-1?a('t/'+ids[k+1],esc(T[ids[k+1]].t)+' ›','btn'):'<span></span>'}</div>`;
  const art=document.getElementById('art'); art.appendChild(tpl.content.cloneNode(true));
  if(!art.textContent.trim()&&!art.querySelector('img')) art.innerHTML='<p class="empty">אין תוכן נוסף לנושא זה בחוברת.</p>';
  const w=(location.hash.split('?h=')[1]||''); if(w) hl(art,decodeURIComponent(w));
}
function hl(root,v){
  const qa=qalts(v); if(!qa.length) return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  let first=null;
  nodes.forEach(n=>{ const h=markHTML(n.nodeValue,qa); if(h.indexOf('<mark>')<0) return;
    const sp=document.createElement('span'); sp.innerHTML=h; n.parentNode.replaceChild(sp,n); if(!first) first=sp.querySelector('mark'); });
  if(first) setTimeout(()=>first.scrollIntoView({block:'center'}),50);
}
function search(v){
  const qa=qalts(v); if(!qa.length) return route();
  const raw=words(v).map(w=>w.toLowerCase());
  const bonus=t=>raw.reduce((s,w)=>s+(t.t.toLowerCase().includes(w)?5:(t.x.includes(w)?2:0)),0); // התאמה מילולית מדורגת גבוה יותר
  let res=T.map(t=>{let s=0;for(const al of qa){ if(hit(t.tt,al)) s+=10; else if(hit(t.bt,al)) s+=1; else return null; } return {t,s:s+bonus(t)};}).filter(Boolean);
  let note='';
  if(!res.length&&qa.length>1){
    res=T.map(t=>{let s=0,c=0;for(const al of qa){ if(hit(t.tt,al)){s+=10;c++;} else if(hit(t.bt,al)){s+=1;c++;} } return {t,s:s+bonus(t),c};}).filter(o=>o.c>0);
    note=res.length?'<div class="sn" style="margin-bottom:8px">לא נמצא נושא שמכיל את כל המילים. מוצגים נושאים שמכילים חלק מהן.</div>':'';
  }
  res.sort((x,y)=>y.s-x.s);
  let h=`<h1>תוצאות חיפוש</h1>`;
  if(!res.length) h+=`<div class="empty">לא נמצאו תוצאות עבור "${esc(v)}". נסי מילה אחרת.</div>`;
  else h+=note+`<div class="sn" style="margin-bottom:10px">${res.length} נושאים</div><div class="list">`+res.slice(0,40).map(({t})=>{
    const sn=hit(t.tt,qa[0])?'':snippet(t,qa); 
    return a('t/'+t.id+'?h='+encodeURIComponent(v),`<span><b>${esc(t.t)}</b>${sn?`<div class="sn">${sn}</div>`:''}</span><span>${chip(t)} <span class="chip">${byCat(t.c).t}</span></span>`)}).join('')+`</div>`;
  app.innerHTML=h;
}
function goHome(){ q.value=''; if(location.hash.length>1) location.hash=''; else route(); }
let qBySearchRoute=false;
function route(){
  const h=location.hash.slice(1).split('?')[0], [k,v]=h.split('/');
  if(q.value.trim()&&!k) return search(q.value);
  if(k==='s'){ qBySearchRoute=true; q.value=decodeURIComponent(v||''); return search(q.value); }
  if(k==='c') cat(v); else if(k==='t') topic(+v); else if(k==='m') month(+v); else if(k==='tl') timelinePage();  else home();
  if(k!=='t'||!location.hash.includes('?h=')) window.scrollTo(0,0);
}
q.addEventListener('input',()=>{ qBySearchRoute=false; if(location.hash) history.replaceState(null,'',location.pathname); search(q.value); });
window.addEventListener('hashchange',()=>{ if(qBySearchRoute&&location.hash.length<=1){q.value='';qBySearchRoute=false;} if(q.value&&location.hash.length>1&&!location.hash.startsWith('#t/')&&!location.hash.startsWith('#s/')) q.value=''; route(); });
document.addEventListener('click',e=>{
  const er=e.target.closest('.evrow[data-h]'); if(er&&!e.target.closest('a')){ location.hash=er.dataset.h; return; }
  const im=e.target.closest('img.shot'); if(im){const lb=document.getElementById('lb'); lb.firstElementChild.src=im.src; lb.style.display='flex'; return;}
  if(e.target.closest('#lb')) document.getElementById('lb').style.display='none';
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){const er=e.target.closest&&e.target.closest('.evrow[data-h]'); if(er) location.hash=er.dataset.h;} if(e.key==='Escape') document.getElementById('lb').style.display='none'; });
const setHH=()=>document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');
setHH(); addEventListener('resize',setHH);
route();

</script>
