t" loading="lazy" src="images/img087.webp" alt="צילום מסך" width="555" height="252"></figure></p><p><figure><img class="shot" loading="lazy" src="images/img088.webp" alt="צילום מסך" width="681" height="446"></figure></p><p><figure><img class="shot" loading="lazy" src="images/img089.webp" alt="צילום מסך" width="353" height="296"></figure></p><p><figure><img class="shot" loading="lazy" src="images/img090.webp" alt="צילום מסך" width="382" height="279"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx"><strong><u>העברת תיקים </u></strong><strong><u>לארכיביון</u></strong></div></div><p>ראה הנחית עבודה מס' 21- העברת תיקים לארכיביון</p><p>אריזת תיקי בוגרים ותיקי פורשים ושליחתם לארכיביון. </p><p>לשליפת תיקי סטודנט מהארכיביון ראה/י <a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחית עבודה מס' 5</a>.</p><div class="li l0"><span class="mk">•</span><div class="tx">בתיק האלקטרוני של הסטודנט יש סוג מסמך "העתק סרוק לתיק אישי". </div></div><p>מטרת סוג המסמך למקרים בהם אנו מזמינים תיק סרוק מהארכיביון שנוכל לתייק אותו בתיק האלקטרוני.</p><p>אנא דאגו לשמור את התיק בסוג מסמך זה.</p></template><template id="t33"><p>כל רכזת חוג תבצע הכנות לטקס בוגרים (מציאת מנחה לטקס, איתור בוגר שיכול לנאום בטקס, הכנת תעודות).</p><p>לקראת הטקס יש לשלוח למדור בוגרים  את דוח הזכאים לתואר (דו"ח 507) המלא. ראה/י פירוט בערך 'סגירת תואר'. </p></template><template id="t34"><div class="li l0"><span class="mk">•</span><div class="tx">שיבוץ שנה א'-  שיבוץ מערכת למתקבלים חדשים. </div></div><p><u>תהליך עבודה:</u></p><div class="li l0 n"><span class="mk">1.</span><div class="tx">הפקת דו"ח 559- דוחות למנהל לימודים  רכזות חוגים  כללי  דו"ח 559</div></div><p>בדו"ח יופיעו סטודנטים מתקבלים לפי חוגים, כאשר מופיעה הערה "נשלח המייל...." המשמעות היא שהסטודנט התקבל וקיבל מכתב קבלה וניתן לשבץ לסטודנט מערכת.</p><p><figure><img class="shot" loading="lazy" src="images/img091.webp" alt="צילום מסך" width="749" height="364"></figure></p><p>מצב הרשמה- הסטטוסים בהם על הרכזת לטפל:</p><div class="li l0 n"><span class="mk">א.</span><div class="tx">התקבל מן המניין עם דרישה נוספת</div></div><div class="li l0 n"><span class="mk">ב.</span><div class="tx">התקבל/ה כתלמיד במעמד מיוחד</div></div><div class="li l0 n"><span class="mk">ג.</span><div class="tx">התקבל/ה מן המניין</div></div><div class="li l0 n"><span class="mk">ד.</span><div class="tx">התקבל/ה על תנאי</div></div><div class="li l0"><span class="mk">•</span><div class="tx">ייתכן ויופיעו סטודנטים לא רק משנה פדגוגית א'. אלו הם סטודנטים חוזרים וצריך לשבץ גם להם מערכת במידה וחסרים להם קורסי חובה להשלמת התואר.</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">משבצים לקורסי חובה לפי חבילות השיעורים (יש לבצע בקרה טרם השיבוץ ע"י חבילת שיעורים ע"י הפקת דוח טרם השיבוץ בפועל) או באופן ידני לאחר הפקת מאזן (במאזן יופיעו חובות שנה א' בחוסר ואז ניתן לשבץ את השיעורים).  לחבילות השיעורים של שנה א'/ בשיבוץ ידני נוסיף את אתר החוג במודל והדרכת ספריה (100-0099500-00), עוברי תכניות, סטודנטים חוזרים, תואר שני, סטודנטים ממכינות קדם אקדמיות וחממ"ה לא נשבץ להדרכת ספריה.       לאחר השיבוץ יש לבצע בדיקות מאזנים של החובות ששובצו. יש להקפיד שבמידה ויש מספר קבוצות לשיעור מסוים, יש למלא את הקבוצות בצורה מאוזנת בכדי לא ליצור קבוצות גדולות מידי ושיעורים דלי משתתפים.</div></div><p>כשמשבצים מערכת ניתן לראות אם הסטודנט למד במכללה בעבר (חוג אחר, במכינה למח"ר או במכינה של מרכז חממה) ולבצע את ההכרות.</p><div class="li l0"><span class="mk">•</span><div class="tx">שיבוץ סטודנטים בשנים מתקדמות-</div></div><p>סינון לפי הסטודנטים הרלוונטיים לחוג בשנים מתקדמות (ב' והלאה) הפקת מאזן ושיבוץ קורסי חובה בלבד.</p></template><template id="t35"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib27/Forms/AllItems.aspx?id=%2Fsites%2Ftip%2FDocLib27%2FPowerBI%20%20%D7%9E%D7%93%D7%A8%D7%99%D7%9A%20%D7%9C%D7%9E%D7%A9%D7%AA%D7%9E%D7%A9%2Epdf&amp;parent=%2Fsites%2Ftip%2FDocLib27" target="_blank" rel="noopener">מדריך למשתמש מערכת Power BI</a></p><p><a href="https://app.powerbi.com/browse/shared" target="_blank" rel="noopener">מערכת BI</a></p><p>במערכת הBI ניתן לקבל מידע על מתעניינים, נרשמים וסטודנטים.</p></template><template id="t36"><p>לאחר שלב שיבוץ הסטודנטים למערכת שעות וטרם פתיחת ימי שיבוצים לסטודנטים, תערוך רכזת החוג סימולציות לשיבוץ קורסי בחירה באמצעות היועץ הווירטואלי. יש לדגום מספר סטודנטים; כל סטודנט מתכנית לימודים שונה ומשנות לימוד שונות. יש לוודא שהסטודנטים מצליחים להשתבץ לקורסים כנדרש, יש לוודא תקינות מודלים, שיוכים לקורסים ולתקן בהתאם.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">נדגום סטודנט מרשימת התלמידים במכלול, נעמוד על שנת הלימודים הרלוונטית ונפתח את תכנית הלימודים.</div></div><p><figure><img class="shot" loading="lazy" src="images/img092.webp" alt="צילום מסך" width="703" height="491"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">לאחר פתיחת תכנית הלימודים, נלחץ על 'יועץ וירטואלי' בסרגל העליון.<figure><img class="shot" loading="lazy" src="images/img093.webp" alt="צילום מסך" width="900" height="308"></figure></div></div><div class="li l0"><span class="mk">•</span><div class="tx">ביועץ הווירטואלי נערוך סימולציה של שיבוץ לקורסי בחירה. חשוב לוודא שמסירים את הקורסים שמשבצים לסטודנט במסגרת הסימולציה.</div></div></template><template id="t37"><p>תיאום מערכת חדרים מול לוגיסטיקה </p></template><template id="t38"><p>טרם תחילת שיבוצי סטודנטים למערכות, יש לתכנן את השיבוצים לפי חבילות שיעורים לשיבוץ. שיבוץ לפי חבילות שיעורים מאפשר שיבוץ סטודנטים באופן מאוזן עד כמה שניתן לקבוצות שונות באותו קורס.</p><p>שיבוץ שיעורים מחבילה אינו בודק את רמת האנגלית של הסטודנט ולכן יתאפשר שיבוץ של הסטודנט גם לקורסי סמינר/גמר. בחוגים בהם הרכזת משבצת את הסטודנטים לסמינר, יש לאחר השיבוץ להוציא דו"ח המציג סטודנטים ללא פטור באנגלית ולהסיר להם את קורסי הסמינר.</p><p>לאחר בניית חבילות שיעורים ניתן לשבץ על פי באצ'ים.</p></template><template id="t39"><p>טרם פתיחת שנת הלימודים תישלח איגרת למתקבלים לשנה א', המאגדת מידע חשוב לסטודנט החדש. רכזת החוג תעדכן את האיגרת לסטודנט טרם שליחתה ותבצע התאמות לחוג ולשינויים בחוג, אם חלו. יש לבדוק את עדכניות המידע ולבדוק את תקינות הקישורים שבאיגרת. האיגרת תישלח ע"י רכזת החוג.</p></template><template id="t40"><p>סטודנט שהגיש בקשה למעבר בין חוגים יופיע ברשימת התלמידים בסטאטוס 'הרשמה'. רכזת החוג תבצע מעקב על הסטודנטים בסטאטוס הנ"ל. יש להפיק גיליון ציונים של החוג הקודם ולבדוק מול ראש החוג שלנו באילו קורסים ניתן להכיר. לאחר מכן יש לעדכן הכרות ופטורים ולמשוך את הקורסים שלמד ואנו מכירים בהם דרך לחצן 'בחר שיעורים מתכנית  אחר'.</p><p>לאחר ביצוע הכרות ופטורים יש לבצע בדיקה שאכן ההכרות מופיעות בגיליון הציונים ובמאזן.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">ניכנס למנוי הרלוונטי בכרטיס התלמיד. נלחץ על 'לימודים קודמים'.</div></div><p><figure><img class="shot" loading="lazy" src="images/img094.webp" alt="צילום מסך" width="661" height="451"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">לאחר מכן יופיע לנו בסרגל האפשרויות העליון 'בחר שיעורים מתכנית אחר'.</div></div><p><figure><img class="shot" loading="lazy" src="images/img095.webp" alt="צילום מסך" width="484" height="49"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">לאחר מכן יפתח לנו חלון שיעורים לבחירה. מתוכו נבחר את הקורס הרלוונטי אותו נרצה למשוך לתכנית הלימודים החדשה של הסטודנט (יופיע כפטור).</div></div><p><figure><img class="shot" loading="lazy" src="images/img096.webp" alt="צילום מסך" width="858" height="508"></figure></p></template><template id="t41"><p><span style="color:#385623">משימה באחריות רכזת בכירה</span></p><p>כל רכזת תתכנן יחד עם ראש החוג את התקציב לשנה העוקבת. התקציב יכלול: מרצים אורחים, סיורים, חומרי לימוד והוצאות תפעול חוגי. תכנון התקציב צריך להתבסס על ההוצאות שהיו בשנה האחרונה. כל רכזת תפנה למרצים מבעוד מועד בבקשה להעביר את הבקשות שלהם לסיורים, מרצים אורחים וחומרי לימוד לשנה הקרובה. </p><p>על הרכזת לערוך את בקשות המרצים בקובץ אקסל מסודר שעל פיו תוגש הבקשה לתקציב לשנה הקרובה להנהלת החשבונות.</p><p>באחריות הרכזת לבצע מעקב אחר ניצול התקציב החוגי על פי הסעיפים השונים. ניתן לפנות בכל עת להנהלת חשבונות לצורך קבלת פירוט ניצול התקציב.</p><p>ראה ערך הגשת בודקי תרגילים וסיום עדכון סיורים במכלול.</p></template><template id="t42"><p>יום שיבוצים הינו יום שבו פורטל הסטודנט נפתח לצורך שיבוצי קורסי בחירה/סמינרים ע"י הסטודנט. </p><p>כחלק מההיערכות לפתיחת שנה עוקבת, תשלח ס. ראש מינהל לימודים טיוטה של מועדי ימי השיבוצים (בד"כ מתקיימים בספטמבר). כל רכזת תעבור על המועדים המוצעים ותשלח התייחסויותיה על המועדים. לאחר אישור הטיוטה ע"י כלל מזכירויות החוגים וס.ראש מינהל לימודים, יופץ לסטודנטים לוח ימי השיבוצים.</p><p>עם פתיחת יום השיבוץ רכזות החוג יטפלו באופן רציף ושוטף בפניות הסטודנטים שישלחו מפורטל הסטודנט. כמו כן, מענה פרונטלי לסטודנטים שהגיעו למזכירות החוג. הרכזת תתמוך את תהליך השיבוצים, תייעץ ותיתן מענה לשאלות.</p><p>בימי שיבוצים לא יינתן מענה טלפוני עקב הצורך למענה מהיר ושוטף לפניות הסטודנטים דרך פורטל הסטודנט.</p><p><u>דוגמא ללוח שיבוצים:</u></p><p><figure><img class="shot" loading="lazy" src="images/img097.webp" alt="צילום מסך" width="845" height="838"></figure></p></template><template id="t43"><p>יום פתוח</p></template><template id="t44"><p>על כל מרצה להעלות סילבוס מקוון של הקורסים אותם הוא מלמד באמצעות פורטל המרצה. רכזות החוג יבצעו מעקב שכלל המרצים העלו סילבוס מקוון באופן תקין. יש להיעזר בדו"ח 534 לצורך ביצוע מעקב אחר מרצים שטרם העלו סילבוס מקוון.</p><p>חשוב לוודא שכלל הסילבוסים עודכנו באופן מקוון טרם פתיחת השנה.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">נפיק דו"ח 534 ונבצע על פיו מעקב העלאת סילבוסים מקוונים.</div></div><p><figure><img class="shot" loading="lazy" src="images/img098.webp" alt="צילום מסך" width="543" height="451"></figure></p></template><template id="t45"><p>ועדת מעקב חוגית</p></template><template id="t46"><p>ראה פירוט בחודש אוגוסט.</p></template><template id="t47"><p>רכזת החוג תשקול את אופן שיבוץ הסטודנטים למערכת שעות.</p><p>שיבוץ באמצעות באצ'ים משמעו- שיבוץ סטודנטים לחבילת שיעורים שהוגדרה מראש לפי תכנית הלימודים. זאת אומרת, כלל הסטודנטים הלומדים את אותו המקבץ/מוקד/מסלול ישובצו לאותה מערכת שעות.</p><p>שיבוץ באמצעות באץ' מאפשר שיבוץ לחתכי אוכלוסייה והינו יעיל במיוחד במצבים בהם ניתן לבנות מערכת קבועה לאותו חתך אוכלוסייה.</p><p>לאחר שיבוץ באמצעות באץ' המערכת מפיקה דוח שמי עם הערות בנוגע לשיבוץ. יש לבדוק שכל הסטודנטים שובצו כנדרש לשיעורים באמצעות ההערות המופיעות בדוח זה.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">רכזת החוג תתכנן את מערכת השעות, תוך שאיפה לתכנון קבוצות לימוד מאוזנות מבחינת כמויות הסטודנטים (למשל קורס פילוסופיה קיים במספר קבוצות, מועדים שונים- רצוי לשאוף לכמות סטודנטים דומה בין הקבוצות).</div></div><div class="li l0"><span class="mk">•</span><div class="tx">רכזת החוג תבנה את חבילת השיעורים במכלול:</div></div><p><figure><img class="shot" loading="lazy" src="images/img099.webp" alt="צילום מסך" width="696" height="312"></figure></p><p>בחלון 'חבילת שיעורים' נלחץ על  <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAnCAIAAADhHd0bAAADYUlEQVR42u2WX0hTURzHz7n3bk6vTXOGJuuOGW2C/dEehCgVQckmQgxENEQfzVAkepMeTATzwbfK10EPSS+FKJFBsKUgFv2Zms7NuVUW7E+7a7vztnPP6WEkq+bUK3sI/HEffufcc87n/L6/3zkc+D0sgkwagySSWYAk4QwD8C4RtJovx2KxhE/TNACAEIIxbmtr6+3t9fNoF0AwtJV+RH9/f0VFhVqtliRpu5OiKLPZjBDq6+tzfY6lmQ7tjkB6QK4iXFxcrFKpkjsRQjRN+/3+wcHB5eXlmZmZj+t86gh2FZGQFBpCCDc3N1UqVU9Pz+Li4tbWjjIw+02a1WodHR3FGIui2NzcbDabOY6LRCIAKFKOp/YSQXIQkUgkekToHuzmLnA8zzMMgxCKx+M7Td8dIElSMgAhRDPUCd2xHDZ7bW3NZrP5fD4IoXyJMMYJZQRBoChqZWUFoXhYDETEcDgcXlpaghBijI1n62QCEEKEkJGREZ7lGSVDMC48lRcDPHtcsc4GbS4bgGBubm5yssn5SZBZRQm7eK3qtFEPCFGq4BYM1TZUnr9kjOOfURSeuvnG6/UCWCgHkNBXFMXnT1/Oql/RkFZrFafritzvQ9/sEYSxRCQQUywsLJyruiK/TE0m0+rqKv+Vj0ajgS/+rOoC/mOQ+cDm5+YKgpCnzZOfZJqmKYpqb2+fn593u90bGxshXyhfWZjFfFFr2NLS0kAgoNVqc3Jy5AMQQtnZ2TqdjmVZURSpADyqOqaksyCEGo2mpKSkqKhIr9fLBLhcrtnZ2eSDRjzgQdcjQkhBQYHP59PpdLW1tf4fSpmXXeGRn8lXjSAITqfTbrcHg0GWZY1GY3l5eVlZWcoa3RPggEaBDNshYD8 6" height="339"></figure></p><p>נגדיר את החבילה אותה נרצה לשבץ. תחילה רצוי לבדוק את תקינות  השיבוץ ע"י סימון "דוח בלבד". לאחר שהכל תקין נסיר את הסימון על מנת לשבץ:</p><p><div class="callout"><p>נבחר חבילה ונלחץ 'הוסף את שיעורי החבילה'</p></div><figure><img class="shot" loading="lazy" src="images/img103.webp" alt="צילום מסך" width="900" height="550"></figure></p><p>יש לסמן בדיוק כפי שמסומן בצילום המסך.</p><p>בכדי לשבץ סטודנטים בשנים מתקדמות לאתר המודל החוגי, נוריד את הסימון ממתג "בדוק פטור מלימודים קודמים" אחרת המערכת תזהה שהסטודנט למד את הקורס בעבר ולא תשבץ אותו.</p><p>לסיום נלחץ  <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADgAAAAWCAIAAAAaQsgPAAACc0lEQVR42u2WP2gTcRTHX0pD6C1JjiwpJkINhSxqC3VQpNJW6JA1hCMagxGFSMhig6mWKjVL6lZSMzikwWJDJmmhSbNIOwqilS6RKtihS2rvoFxz3Hv3c7i0SbckLlfod7n3O9699+HeH34mURThPKgHzonODWiv/sjlcvv7+4qiGI3PYrE4nc5wOGwSRfFdNsv19QUCAYfDYTTQWq1WKBTk4+NeAPh7cBCZmrLZbLIsGw2U53lBEObn53sAQFVVnufr9boBW7Ner/M8r6pqo0cZY4wxY46RDtaceq09ZSasTU1kdvW3u5mJE7sct8bLrVY53uJ4xrU9nVlPjDFqT4/Xa6da8U4Px8tERKgBaEhEVF7LhSbHWq2xt7UV7/STzE89AGrgHXBT+9L/aKP0iChJUqdFGQnPDD/b2ZZGLh8pRHAkSdu5dF54OitJEnz+lB/2hPWoI6PCl8iNmHP3zR34seMZFTpJxnFcExQAiKjj9iGNMSAiIo19TY1dmYOhF5XCbSKCzY2PgWj1EhHB5sxg5W71vTYYmR6veH6Pv37QRa7mMCFiF6AAQIhIGgwlS8v33Xp1YOvVo2qyNIuIAFsb1eTDWXTfLCWDk4mB0nKHmc6UvktQJMYAEfHUAIA/H0K+NCTWXvbrZ9IYISJCvzCXWPc9z93K33P/B2g364mdfgvwLe27mgYAgOuJ1e9BN5wEZA0fAHAFlzK/rvlCsLoUdHcGahJFMZVKxWIxjuP29vaMtkRdLpcsywsLCyZRFLPZrMVi8fv9VqvVaKCSJBWLRUVRTPrFeXFx8fDwUFVVo4GazWa73R6NRk0XN/wLUIPrHwpDLsURr8L1AAAAAElFTkSuQmCC" alt="" style="height:22px"></p></template><template id="t48"><p>חשוב מאד לקבל את ציוני מועד א' של הקורסים כימיה אורגנית ב' וחדו"א 2 עד תחילת השבוע השלישי של סמסטר קיץ, כלומר בסביבות אמצע אוגוסט. הסמסטר מתקיים במקביל למועדי ב' של סמסטר ב'.</p></template><template id="t49"><p>ראה פירוט בפברואר.</p></template><template id="t50"><p><a href="mailto:https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">ראה/י  הנחית עבודה מס' 35- עדכון סילבוסים לשנה עוקבת</a></p><p>האחריות על העלאת סילבוסים היא על המרצים. על הרכזת לבצע בקרה ע"פ דו"ח 534.</p><p>יש לפנות למרצים שטרם העלו סילבוס ולהנחות אותם לסיים עם העלאת הסילבוסים.</p></template><template id="t51"><p>תקופת השינויים מתרחשת בשבועיים הראשונים של כל סמסטר. בתקופה זו ניתן לבצע שינויי מערכת. רכזת החוג זמינה למתן מענה לפניות הסטודנטים באמצעות פורטל הסטודנט וכן באופן פרונטלי. לא יינתן מענה טלפוני בתקופת השינויים. שינויים בקורסי חובה- על פי נהלי החוג. שינויים בקורסי בחירה, הסטודנט יכול לבצע באופן עצמאי במערכת הרישום לקורסים בפורטל הסטודנט. בתקופת השינויים ניתן לשבץ סטודנט <a href="https://telhaimng.sharepoint.com/sites/tip/DocLib22/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=e068cef4%2D09bf%2D439f%2Da2e7%2D9344b316741c" target="_blank" rel="noopener">לנקודות זכות עודפות בהתאם לנוהל 321</a>.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">רכזת החוג תענה לפניות הסטודנטים אשר הצטברו מאותו היום.  </div></div><div class="li l0"><span class="mk">•</span><div class="tx">מתן המענה יתבצע דרך המכלול &lt; בקשות &lt; פניות.</div></div><p>נפתח את הסרגל אשר נמצא בצד ימין במכלול:</p><p><img class="ic" src="images/img105.webp" alt="" style="height:442px"></p><p><div class="callout"><p><span style="color:#F2F2F2">לחץ כאן</span></p></div></p><p>לאחר מכן נלחץ למטה על "בקשות" ואז נלחץ פעמיים על "פניה ל...." (יופיע שם החוג הרלוונטי). </p><p><figure><img class="shot" loading="lazy" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAATUAAACyCAIAAACsv8+HAAAXAklEQVR42u2dfXQTZb7Hf1NAELBAwUVqeU+ALQEvN7x4WrXurts9CVYrau8VdXt9OelRdk96V0F2L967ul2KorvJUa+b+MoecbXy0qWQeHqvuD1ugiLxgsSKJEBRqIC0lC5tRaDP/SPJZN5nkpaS1u/n8Mc088w8L5PfPDPDfPLjgtuDBADISAYT0fq6jRgIADI0Pono+T88g7EAIEPjs6uLYSwAyCguv5yLxyeiE4DMnT8ZQ4QCcA p><figure><img class="shot" loading="lazy" src="images/img108.webp" alt="צילום מסך" width="900" height="234"></figure></p><p>בשני המקרים ייפתח לנו חלון המראה אם בחרנו לקבל או לדחות את פניית הסטודנט ונאלץ להוסיף מלל עם תשובתנו לסטודנט (חשוב להוסיף לפני ה"שלום רב" את שם הסטודנט). לאחר מכן נלחץ על אייקון "שלח":</p><p><figure><img class="shot" loading="lazy" src="images/img109.webp" alt="צילום מסך" width="802" height="666"></figure></p></template><template id="t52"><p>ראה פירוט בחודש פברואר.</p></template><template id="t53"><p>ראה פירוט בחודש פברואר.</p></template><template id="t54"><p>החל מיולי ועד לסוף תקופת השינויים יש להפיק דוח עוברים בין תכניות ולטפל באופן שוטף בבקשות שהתקבלו.</p><p>ראה ערך טיפול במעבר בין תכניות ומעבר בין חוגים בחודש פברואר.</p></template><template id="t55"><p>ראה/י הנחיית עבודה מס' 18- יום אוריינטציה למרצים חדשים</p><p>יום אוריינטציה מתקיים בתחילת שנת הלימודים ונועד כדי לאפשר למרצים חדשים להכיר את בעלי התפקידים במכללה, הכרות פיזית של מבנה הקמפוס, הכרת הנהלים וההתנהלות מול גורמים שונים במכללה וחתימה על חוזה עבודה. </p><p>ייקבע מועד אחד לכל פקולטה ע"י ס. ראש מנהל לימודים.</p></template><template id="t56"><p>לקראת אמצע הסמסטר יש לתאם שיחת חתך עבור שנים א-ב-ג (יחד או לחוד, לשיקול דעת רכזת וראש החוג). בשיחה יועלו ע"י ראש החוג תכנים רלוונטיים שברצונו להעביר (עדכונים, דגשים חשובים וכו') ומאידך, לשמוע את קולות הסטודנטים מהשטח.</p></template><template id="t57"><p>בתקופה זו של הסמסטר נפיק מכתב תזכורת לסטודנטים שהתקבלו ללימודים על תנאי. </p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">נפיק דוח 536- סטודנטים בשנה א' שהתקבלו על תנאי</div></div><p><figure><img class="shot" loading="lazy" src="images/img110.webp" alt="צילום מסך" width="471" height="356"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">את הנוסח יש לשלוח לסטודנטים <u>בשנה א'</u> עם התנאים הבאים:</div></div><div class="li l0 n"><span class="mk">1.</span><div class="tx">מן המניין על תנאי</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">מעמד מיוחד</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx">סטודנט עם דרישה נוספת</div></div><div class="li l0"><span class="mk">•</span><div class="tx">נפיק תכתובת ונשלח לאוכלוסיית סטודנטים (נוסח 120 בפקולטה למדעי החברה והרוח, נוסח 151 בפקולטה למדעים). </div></div><p>תהליך עבודה:</p><p><figure><img class="shot" loading="lazy" src="images/img111.webp" alt="צילום מסך" width="522" height="513"></figure>תלמידים  דוחות  תכתובות ואישורים </p><p>בוחרים נוסח <strong><u>120/ 151</u></strong> בכדי לשלוח תזכורת על תנאי קבלה לשנה א'</p><p><figure><img class="shot" loading="lazy" src="images/img112.webp" alt="צילום מסך" width="405" height="289"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">נבצע שליחה במייל ע"י הגדרה בחלון התכתובת. נסיר את ה מהדפסה, נוריד את ה מהתיבה של PDF על מנת שנוכל לערוך את הקובץ טרם שליחתו (במידת הצורך). נסמן  בתיבה של 'לשלוח דוא"ל'. לאחר שנלחץ הדפס לאחר הפקת הנוסח, האישור ישלח אוטומטית לדואר אלקטרוני של הסטודנט.</div></div><p><figure><img class="shot" loading="lazy" src="images/img113.webp" alt="צילום מסך" width="669" height="579"></figure></p><p><img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABkAAAAeCAIAAABWjiKMAAACnklEQVR42s1UO09UQRQ+d7hG5SEsxIC6mBhjYYMxJKKFP8DCglhgZaExJjZWNDZGbTRaGmsqbTAaX4WJiYHCaCIFUBABBdzIY9nA3r33zuM8xkKEdV01mI1hum9mvi/f+U7OCQpFhhqdUERqpuXFb0lf4uV/+Ho4lAKAQ9GOU82JoVhzYijVrB07lEfXDm0ir/aO3cjeODHOp1a0FWPFonfkR8enKrh/yWtxIb/my3CsKdGcaEosG8sAUMH9k1a2ca6xvXsdTkznz59qtegteoP+3MXLInc33UdmIRZjGckjeUfeka/iq7zm1eWZmY/D63BHQzvxUSZGEkdUMoQMjgHZIwMAVOa1tLi0Dr5OD3d1ZTr3NyhBxfbxy3kVvknreyySQ44SQvLI3rEn9gBQzgWAUCm1Drz4bHY7ACi2im1vd27wPQX4LkTyREeIXgzwyb7rREAMAFDOBYAwCIKNXISBrAp9HdsgmlOQnj32qfz3vectyJ4YSDwAlHN/0SJmctsCDwCvRjMAGRFPJMSiNSJK/U4eeXqT2AtLNS21gUXEo1FKZqYWNO463VNSqu5H/QBCgBZEj47lbz8BgKZybqUvQvaoVeDGck3tbaJcCai09mYLbDSmaW6+MDB04MKF/ubWjsp5VIEqr1HQzC6Sl+aegzGkMQQAjECpKUZoEpemD97qfdnOTNveKrNd7stal5sPJ7829R6PIJoFStFqNAnqNCkUVpZXBidbXn9wV2+cqUiqSl7M תבדוק סטודנטים של שנתיים לפני שנמצאים בסטטוס 511- השעיית לימודים, במידה ולא מעוניינים לחזור לבצע פרישה.</p><p>שכר לימוד- מניין השנים לא ייחשב לו לצורך חיוב תקורה. ייעשה לסטודנט חישוב שכר לימוד כאילו פרש.</p><div class="li l0 n"><span class="mk">3.</span><div class="tx">במידה והסטודנט לא מעוניין להיפגש עם אחד מהגורמים הללו עליו למלא טופס הודעה מקוון על פרישה. הודעה על פרישה הינה הודעה בכתב עם חתימה על הטופס בלבד. הודעה בעל פה לא נחשבת להודעה על פרישה.</div></div><div class="li l0 n"><span class="mk">4.</span><div class="tx">יש לתייק את הטופס בתיק האלקטרוני ובתיק האישי. </div></div><p>טופס ידני- במידה והסטודנט לא חתם על הטופס אלא מילא את שמו ושלח את הטופס במייל, יש לתייק את כל המייל שנשלח מהסטודנט בכדי שתהיה לנו אסמכתא שהטופס אכן נשלח ע"י הסטודנט.</p><div class="li l0 n"><span class="mk">5.</span><div class="tx">עובדים לפי הרחבה להנחיית עבודה מס' 2.</div></div><div class="li l0 n"><span class="mk">6.</span><div class="tx">לאחר תיוק טופס הפרישה והפקת נוסח הפרישה מהמכלול (תכתובות- נוסח 7) בתיק האישי יש לציין על התיק 'פרש מלימודים' (או סיבה אחרת רלוונטית) ולשים את התיק במגירת הפורשים.</div></div><div class="li l0 n"><span class="mk">7.</span><div class="tx">שולחים לסטודנט בדואר- גל"צ חתום ואישור קבלת הודעה על הפסקת לימודים (נוסח 7 בתכתובות).</div></div><p>הערות:&emsp;&emsp;</p><div class="li l0"><span class="mk">•</span><div class="tx">סטודנט שטרם התחיל את לימודיו פורש מול מדור רישום.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">ניתן להכיר לסטודנט בקורסים שנלמדו עד 7 שנים משנת הלימודים הראשונה שלו.</div></div><p>נוסחי פרישה מלימודים (תכתובות):</p><div class="li l0"><span class="mk">•</span><div class="tx">7- פרישה ביוזמת הסטודנט</div></div><div class="li l0"><span class="mk">•</span><div class="tx">76- פרישה מנהלתית- פרישה ביוזמת החוג/המנהל. בד"כ לאחר תחילת שנה במידה והסטודנט לא שילם מקדמה ו/או לא חתם על ערכת הסדרי תשלום.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">150- הפסקת לימודים ביוזמת ועדת מעקב חוגית.</div></div> ם והמסרונים שנשלחו לסטודנט מהמכללה</div></div><p><figure><img class="shot" loading="lazy" src="images/img124.webp" alt="צילום מסך" width="661" height="359"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">תדפיסים- תחת קטגוריה זו נמצא את מכתבי הקבלה שהסטודנט קיבל כשנרשם ללימודים, גיליונות ציונים שהופקו, תכתובות שנשלחו לו וכו'.</div></div><p><figure><img class="shot" loading="lazy" src="images/img125.webp" alt="צילום מסך" width="630" height="335"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">בקשות- תחת קטגוריה זו נמצא את הפניות של הסטודנט שהגיעו דרך הפורטל. פניה למזכירות החוג, פניה לוועדה לתשלומים חריגים, פניה למדור אנגלית וכו'.</div></div><p><figure><img class="shot" loading="lazy" src="images/img126.webp" alt="צילום מסך" width="595" height="320"></figure></p></template><template id="t60"><p>תהליך סגירת תואר</p></template><template id="t61"><p>הנחיית עבודה מס' 6- רישום סטודנטים משלימים</p><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 34- טיפול בסטודנטים שלמדו 5 שנים ולא סיימו חובותיהם לתואר</a></p><p>לאורך השנה רכזת עשויה לקבל פניות מסטודנטים שלמדו בעבר בחוג ומעוניינים לשוב ללימודים לצורך השלמת התואר. במידה ולסטודנט יש מנוי בשנה קודמת וברצונו לחזור ללמוד בסמסטר אביב, ניתן לטפל בו במזכירות החוג ולהעלותו שנה.</p><p>במידה ולסטודנט יש מנוי בשנה קודמת אך נמצא בסטטוס פרישה כלשהו, לא תהיה לו גישה לפורטל ולכן יפנה למייל החוגי בבקשה לעלות שנה. יש להחתימו על טופס בקשה ידני לעלות שנה, לתייק את הטופס לתיק האישי והאלקטרוני ולבצע בפועל את העלאת השנה. במידה ולסטודנט אין מנוי בשנה קודמת עלי ולפנות למרכז ייעוץ והכוונה לרישום מחדש.</p><p>במידה ועברו פחות מ-6 שנים משנת הלימודים הראשונה של הסטודנט, עליו להירשם דרך מדור ייעוץ והכוונה.</p><p>במידה ועברו 6 שנים מהשנה בה התחיל ללמוד או במידה והשלמת חובותיו לתואר יחרגו מ-6 שנים מתחילת לימודיו, יש צורך באישור המשנה לנשיא לעניינים אקדמיים (מנל"א) / דיקן הפקולטה. במקרה כזה נפעל באופן הבא:</p><div class="li l0 n"><span class="mk">1.</span><div class="tx">הסטודנט ישלח בקשה מפורטת למזכירות החוג דרך המייל בה יפרט את השתלשלות האירועים והסיבות בגינן לא השלים את חובותיו לתואר. </div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">הבקשה תועבר לראש החוג בצירוף גיליון הציונים של הסטודנט לקבלת המלצתו לחזרה / אי חזרה ללימודים. רכזת החוג תציין את פרק הזמן הנדרש לסטודנט לצורך השלמת התואר, תוך התחשבות בחובות האקדמיים שעליו להשלים, כולל רמת אנגלית.</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx">במידה וראש החוג נותן את המלצתו לחזרה ללימודים מעבירים את בקשת הסטודנט עם המלצת ראש החוג לזהבה שמואל להמשך טיפול מול מנל"א/ דיקן הפקולטה.</div></div><div class="li l0 n"><span class="mk">4.</span><div class="tx">במידה וקיבלנו אישור לחזרה ללימודים, נעדכן את הסטודנט במייל על חובותיו האקדמיים שנותרו לו להשלמת התואר, מתייקים בתיק אלקטרוני ומכניסים הערה בכרטיס. יש להנחות את הסטודנט לבצע הרשמה למכללה.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">במידה והסטודנט ביצע מעבר בין חוגים, הספירה של 6 שנים מתחילה מחדש לאחר המעבר.</div></div></template><template id="t62"><p>חשוב שכל האירועים (כנסים, ימי עיון וכו') החוגיים יופיעו בטיפ מראש כאירוע המתקיים במכללה וזאת על מנת לאפשר למי שרוצה להגיע אליהם. לכן, לקראת אירוע חוגי רלוונטי, יש לפתוח בקשה לאירוע (ללא צורך במשאבים) <a href="https://telhaimng.sharepoint.com/sites/tip/SitePages/%D7%98%D7%A4%D7%A1%D7%99%D7%9D(1).aspx" target="_blank" rel="noopener">בטופס מקוון בטיפ</a>. </p><p>לאחר שליחת הבקשה, ראש תחום כנסים ואירועים, יכניס את האירוע ליומן הטיפ. מה חשוב שיופיע בבקשה לאירוע:</p><div class="li l0 n"><span class="mk">1.</span><div class="tx">עדכון שם הכנס ומטרתו</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">עדכון מקום האירוע</div></div></template><template id="t63"><p>בוגרים וסטודנטים אשר לא פעילים ופרשו, ומבקשים  מסמכים שונים כמו גל"צ, סילבוסים וכו',  נפנה להגיש בקשה באתר בוגרים. שליחת המסמכים כרוכה בתשלום.</p><p>אתר המכללה  לשונית "בוגרים"   מסמכים ואישורים  <a href="https://bogrim.telhai.ac.il/documents/" target="_blank" rel="noopener">https://bogrim.telhai.ac.il/documents/</a>&emsp;</p><p>כמו כן, יש אפשרות להפיק סילבוסים ללא עלות באתר משנה"ל תשע"ד:</p><p><a href="https://eur03.safelinks.protection.outlook.com/?url=https%3A%2F%2Fbogrim.telhai.ac.il%2Fdocuments%2F&amp;data=04%7C01%7Cmoranv%40telhai.ac.il%7C2d8a38ef03e54819380e08d90485deb0%7C27f80a298b294d219bd0172c87ed230d%7C0%7C0%7C637545795270445412%7CUnknown%7CTWFpbGZsb3d8eyJWIjoiMC4wLjAwMDAiLCJQIjoiV2luMzIiLCJBTiI6Ik1haWwiLCJXVCI6Mn0%3D%7C1000&amp;sdata=0FjleEFbuVBwjL5QAhDhROCveSEo4Op4%2FUQhLucalyY%3D&amp;reserved=0" target="_blank" rel="noopener">https://bogrim.telhai.ac.il/documents/</a></p><p>במידה והסילבוס לא נמצא על הסטודנט להגיש בקשה דרך האתר.</p><p>סטודנטים בסטטוס בוגר אך טרם קיבלו  תעודה, רכזת החוג תטפל בפניותיו עד הטקס.</p></template><template id="t64"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 42- רישום סטודנטים היוצאים ללימודים לסמסטר אחד לחו"ל</a></p><p>המכללה מעודדת חילופי סטודנטים בין אוניברסיטאות בעולם. בשיתוף פעולה עם היחידה לקשרים אקדמיים בינלאומיים במכללה, מוצע לסטודנטים בהתאם לקריטריונים לצאת ללימודים של סמסטר אחד בחו"ל.</p><p><u>תהליך עבודה:</u></p><div class="li l0 n"><span class="mk">1.</span><div class="tx">משלוח מכתב קבלה לסטודנט החתום ע"י ראש החוג. העברת העתק לרכזת החוג וראש החוג (מנהל אקדמי מכין את מכתבי האישור).</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">משלוח אישורים ומסמכים בשפה האנגלית לסטודנט שהתקבל (עם העתק ליחידה לקשרים אקדמיים בינלאומיים):</div></div><div class="li l0"><span class="mk">•</span><div class="tx">אישור לימודים באנגלית </div></div><div class="li l0"><span class="mk">•</span><div class="tx">גיליון ציונים באנגלית- חתום דיגיטלית באנגלית</div></div><div class="li l0"><span class="mk">•</span><div class="tx">אישור רמת לימודים באנגלית</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx">עם יציאת הסטודנט לחו"ל:</div></div><div class="li l0 n"><span class="mk">א.</span><div class="tx">עדכון קבוצת שיוך בכרטיס הסטודנט 6 - סטודנט שיצא ללמוד סמסטר בחו"ל.</div></div><p><figure><img class="shot" loading="lazy" src="images/img127.webp" alt="צילום מסך" width="632" height="213"></figure></p><div class="li l0 n"><span class="mk">ב.</span><div class="tx">עדכון סטטוס הסטודנט 503 – לא מן המניין סמסטר בחו"ל</div></div><p><figure><img class="shot" loading="lazy" src="images/img128.webp" alt="צילום מסך" width="633" height="220"></figure></p><div class="li l0 n"><span class="mk">ג.</span><div class="tx">עדכון הערה קופצת לשכר לימוד – סטודנט יצא לסמסטר ללמוד בחו"ל </div></div><p><figure><img class="shot" loading="lazy" src="images/img129.webp" alt="צילום מסך" width="642" height="279"></figure></p><div class="li l0 n"><span class="mk">ד.</span><div class="tx"> השיעורים מהסמסטר בו הסטודנט יוצא לחו"ל לא ימחקו ויוגדר בהם סטטוס 109 "סטודנט בסמסטר לימודים בחו"ל".</div></div><div class="li l0 n"><span class="mk">4.</span><div class="tx">עם חזרת הסטודנט לתל- חי: </div></div><div class="li l0 n"><span class="mk">א.</span><div class="tx">באחריות הסטודנט להעביר גיליון ציונים מהמוסד בו למד, רכזת החוג תעביר העתק ליחידה לקשרים אקדמיים בינ"ל.</div></div><div class="li l0 n"><span class="mk">ב.</span><div class="tx">באחריות רכזת החוג:</div></div><div class="li l0"><span class="mk">•</span><div class="tx">החזרת הסטודנט החוזר לסטטוס הקודם שהיה בו לפני הטיסה (למשל- 69- מן המניין וכו')</div></div><div class="li l0"><span class="mk">•</span><div class="tx">ביצוע השמטה של הקורסים בסטטוס 109 מהסמסטר בו הסטודנט יצא לחו"ל.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">תקים שיעורים חדשים בשמות ובהיקף השש"ס והנ"ז שהסטודנט למד בחו"ל.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">השיעורים יוקמו בשם באנגלית ובסוג שיעור 26 -לימודים ממוסד אקדמי בחו"ל. </div></div><div class="li l0"><span class="mk">•</span><div class="tx">גיליון הציונים של הסטודנט מחו"ל יועבר למדור בחינות לצורך הקלדת הציון. רכזת החוג תסמן על הגיליון את הקורסים שנדרשים הקלדת ציון</div></div><div class="li l0"><span class="mk">•</span><div class="tx">בשנה העוקבת תשבץ את הסטודנט לקורסים שלא למד בזמן שהותו בחו"ל ותוסיף סטטוס 93, לפטור מתשלום.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">בסיום, תעדכן את מנהלת מדור שכר לימוד על מנת שיבוצע חישוב שכר לימוד והתאמות לחיוב/לזיכוי.</div></div></template><template id="t65"><p><u>נזין באופן הבא:</u></p><p>בתחילת כל שנת לימודים , רכזת דיקן הסטודנטים תעביר פנייה לרכזת החוג על מנת לבדוק זכאות של סטודנט לקבלת קרדיט.  רכזת החוג תבדוק האם הסטודנט קיבל בעבר קרדיט על אחת מהפעילויות.                                                                           </p><p>לאחר קבלת רשימה של סטודנטים המשתתפים בפעילות מרכזת דיקן הסטודנטים, רכזת החוג תשבץ את הסטודנט לשיעור "השתתפות בנבחרות ספורט" 9999915-00 או "השתתפות בפעילות חברתית" 9999914-00 או "הכרה במילואים" 9999913, השיעור יכנס לתוך תכנית הלימודים והסטודנט יחויב בגינו בשכ"ל.</p><p>בסיום כל פעילות רכזת בדיקנט הסטודנטים תעביר לרכזת החוג ציון עובר / לא עובר בקורס. סטודנטים שנשרו מהפעילויות הרכזת תבצע <strong>השמטה</strong> לסטודנט (בכל מקרה הסטודנט ישלם על הנ"ז). והסטודנט יבחר קורס בחירה במקומו.</p><p>במקרה של מילואים, רכזת הדיקנאט תעביר לרכזת סטודנטים הזכאים להטבה, בהתאם למועד ביצוע המילואים. הרכזת תבדוק שהסטודנט לא קיבל בעבר אחת מההכרות הנ"ל ותשבץ אותו לקורס "הכרה במילואים". לאחר ההרשמה יש להעביר למדור שכר לימוד רשימה של הסטודנטים על מנת שיבצעו חיוב (מילואים ניתן לשבץ גם במהלך השנה בהתאם למועד שבוצע ולכן יכול להיות שישובצו לאחר ששכר לימוד כבר ביצעו חיובים לאותה השנה).</p></template><template id="t66"><p><figure><img class="shot" loading="lazy" src="images/img130.webp" alt="צילום מסך" width="645" height="167"></figure></p><p>הערה: במידה ואתן פותחות שיעור שהוא תגבור אין לעדכן עליו ש"ש היות וזה יוצר אי הלימה בין הש"ש שנמצא לסטודנט בתכנית לבין הש"ש בגל"צ.</p></template><template id="t67"><p>בתוך הטיפ, תחת מחלקות- מנהל לימודים- <a href="https://telhaimng.sharepoint.com/sites/tip/SitePages/%D7%9E%D7%93%D7%95%D7%A8%D7%99%D7%9D-%D7%95%D7%A0%D7%95%D7%A9%D7%90%D7%99%D7%9D-%D7%A9%D7%95%D7%A0%D7%99%D7%9D(2).aspx" target="_blank" rel="noopener">מזכירויות חוגים</a> ניתן למצוא את העזרים הכלליים לשימוש הרכזות.</p><p>מגוון מסמכים הרלוונטיים לרכזות החוגים באופן שוטף.</p></template><template id="t68"><p>דודל הוא כלי בו ניתן לקבל מידע ממספר נמענים באשר לפניות למועדי פגישות.</p><p>כניסה לקישור: <a href="https://doodle.com/" target="_blank" rel="noopener">https://doodle.com/</a></p><p>לחיצה על Create Doodle Poll</p><p><figure><img class="shot" loading="lazy" src="images/img131.webp" alt="צילום מסך" width="564" height="103"></figure></p><p>נושא: לדוגמא פגישה בנושא... - חובה</p><p>מקום: לדוגמא חדר ישיבות – לא חובה</p><p>הערות: לא חובה</p><p><figure><img class="shot" loading="lazy" src="images/img132.webp" alt="צילום מסך" width="569" height="348"></figure></p><p>בחירת תאריכים אופציונליים ולכל תאריך שעה (ע"י לחיצה על הקובייה המבוקשת), ניתן לבחור כמה תאריכים עם שעות שונות:</p><p><figure><img class="shot" loading="lazy" src="images/img133.webp" alt="צילום מסך" width="572" height="739"></figure></p><p>סימון עדיפויות, אם יש,  והמשך:</p><p><figure><img class="shot" loading="lazy" src="images/img134.webp" alt="צילום מסך" width="425" height="711"></figure></p><p>מילוי הפרטים שלך</p><p><figure><img class="shot" loading="lazy" src="images/img135.webp" alt="צילום מסך" width="565" height="308"></figure></p><p>העתקת הקישור שנוצר ומשלוח למשתתפי הפגישה</p><p><figure><img class="shot" loading="lazy" src="images/img136.webp" alt="צילום מסך" width="555" height="460"></figure></p><p>כל byXz5x30+8A1BXX3+67PS33wZKpdKLF6ssFktW1sy7aMGwF04DjtmNtAYBBKC90dly1UFQEGDciPpIIwghQUGChMiLORb/9Pttafen0hS5deu2urr6hIT47OzZBoPh/2ezDUIQEi1pONeBUddfzGEflP0ECPJi5MUUj1DpBN/7NP+XWz8WCYOKw+ZjuVc5Fv33YIYgIJgZMyssMkXhhw34vyXxmx82v/lh88Pmt7vU/g1a3irAWvHAWAAAAABJRU5ErkJggg==" alt="" style="height:28px">נכניס שם משתמש וסיסמא (לכל פקולטה יש שם משתמש וסיסמא לגוגל דרייב).</p><p>כדי ליצור קובץ חדש נלחץ על אייקון חדש   עוד                                                 (ניתן ליצור סוגים נוספים של טפסים)</p><p><div class="callout"><p>לחץ כאן</p></div><img class="ic" src="images/img142.webp" alt="" style="height:145px"></p><p><div class="callout"><p>ניתן כותרת לטופס</p></div><figure><img class="shot" loading="lazy" src="images/img143.webp" alt="צילום מסך" width="876" height="559"></figure></p><p>לדוגמא, אם אנו מעוניינים לברר אלו סטודנטים מעוניינים להירשם לקורס שנקרא קורס מתקדמים ב' משולב,  ניתן לטופס כותרת, בתיאור הטופס נוכל לתאר ולהסביר בכמה מילים על הנושא של טופס. ב"שאלה ללא כותרת" נבחר לדעת מה שם הסטודנט, בגלל שזאת שאלה עם תשובה אחת בלבד נבחר בצד שמאל ב"תשובה קצרה" , במידה ויש לנו שאלה שיש לה כמה אפשרויות נבחר ב"בחירה מרובה".  הטופס נשמר אוטומטית בדרייב.</p><p>להלן דוגמא לטופס:</p><p><figure><img class="shot" loading="lazy" src="images/img144.webp" alt="צילום מסך" width="761" height="503"></figure></p><p><div class="callout"><p>לחץ כאן</p></div>כדי לשלוח לסטודנטים לינק עבור טופס זה נלחץ בחלון למעלה על 'שליחה':</p><p><figure><img class="shot" loading="lazy" src="images/img145.webp" alt="צילום מסך" width="888" height="267"></figure></p><p>נלחץ על אייקון של הקישור ונסמן ב  כתובת אתר מקוצרת, נעתיק את כתובת הלינק ואותה נשלח לסטודנטים, כתובת זו תקשר אותם ישר לתוך הטופס:</p><p><div class="callout"><p>לחץ כאן</p></div><div class="callout"><p>העתק קישור</p></div><div class="callout"><p>נסמן ב</p></div><figure><img class="shot" loading="lazy" src="images/img146.webp" alt="צילום מסך" width="587" height="333"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">כדי לראות את תגובות הסטודנטים אשר בחרו להשתבץ לקורס זה נלחץ על תגובות ונוכל לבחור אם נתונים יוצגו לנו בקובץ אקסל (הסמן הירוק) או שנבחר באחת מהאופציות אשר נמצאות בשלוש הנקודות אשר בצד שמאל</div></div><div class="li l0"><span class="mk">•</span><div class="tx">כדי שהטופס יפסיק לקבל תגובות נבטל את הסמן של 'מקבל תגובות', הטופס יהפוך להיות בצבע אדום, כאשר סטודנט ינסה להשיב לטופס תופיע לו הודעה שלא ניתן יותר לשלוח תשובות.</div></div><p><figure><img class="shot" loading="lazy" src="images/img147.webp" alt="צילום מסך" width="556" height="189"></figure></p></template><template id="t70"><p>חנות הקמפוס מתנהלת ע"י "חץ- החברה הכלכלית של אגודת הסטודנטית תל-חי". בגין כל רכישה בחנות הקמפוס תצאנה 2 תעודות משלוח- האחת תחתם ע"י הרוכש המורשה של היחידה ותישאר בחנות לצורך מעקב; השנייה תימסר ליחידה הרוכשת. בתעודת המשלוח יצוין שם המחלקה ושם הרוכש בפועל.</p><p>באחריות היחידות להעביר להנהלת חשבונות בראשון לכל חודש את טופס המרכז את הרכישות מהחודש הקודם (ראה בעמוד הבא). על הטופס להיות חתום, מתומחר ומאושר ע"י מנהל היחידה. יש לצרף לטופס את העתקי תעודות המשלוח.</p><p><strong><u>דוגמא לתעודת משלוח</u></strong></p><p><figure><img class="shot" loading="lazy" src="images/img148.webp" alt="צילום מסך" width="541" height="763"></figure><figure><img class="shot" loading="lazy" src="images/img149.webp" alt="צילום מסך" width="627" height="470"></figure></p></template><template id="t71"><div class="tw"><table><tr><td><strong>סוג איש סגל</strong></td><td></td><td><strong>בסיס משרה</strong></td><td><strong>משמעות</strong><strong>- מקסימום כמה שש"ס  יכולים ללמד</strong></td><td><strong>הערות</strong></td></tr><tr><td>סגל בכיר</td><td>מדרגת מרצה עד דרגת מרצה בכיר</td><td>24 שש"ס</td><td>24 שש"ס שנתיות</td><td>חייבים ללמד לפחות 50% משרה.<br>הקלות- משאבי אנוש מזינים. מקסימום 8 שעות הקלות.</td></tr><tr><td>זוטר</td><td>מדרגת מורה שנה א', מורה שנה ב'</td><td>32 שש"ס</td><td>32 שש"ס שנתיות</td><td>חייבים ללמד לפחות 50% משרה.<br>אין הקלות.</td></tr><tr><td>סגל עמית</td><td>עמית 1, עמית א', עמית ב'.</td><td>28 להרצאה<br>26 לתרגיל</td><td><strong><u>אם מרצה</u></strong>- יכול ללמד 28 שעות שנתיות.<br><strong><u>אם מתרגל</u></strong> יכול ללמד <strong>26 שעות בסמסטר</strong>, <strong>52 שעות בשנה.</strong></td><td>מחויבים ל 20% משרה</td></tr><tr><td>מורה מן החוץ</td><td>רמה 1, א', ב', ג'.</td><td>מקסימום משרה מלאה בכל פקולטה <strong>+</strong> חצי משרה בפקולטה אחרת</td><td>משרה מלאה רמה ב', ג'= 24 שש"ס<br>משרה מלאה 1, א'= 32 שש"ס</td><td></td></tr><tr><td>סגל זוטר אחר</td><td></td><td>עוזרי הוראה ואסיסטנטים.<br>סטודנטים לתארים מתקדמים.<br>מתרגלים שמשרתם מחושבת לפי פקטור רלוונטי לכל דרגה.</td><td></td><td></td></tr></table></div><p>* הקלה בגין הנחיית סטודנט מחקרי בפקולטה למדעים- מרצה בכיר במשרה מקבל הקלות בגין הנחיית סטודנטים.</p><p>על סט' 1- המרצה יקבל 1 שש"ס וסט' שני 0.50 שש"ס ולא יותר מ-2 שש"ס.</p><p>בד"כ המנחה רשאי להנחות רק 2 סטודנטים בו זמנית.</p></template><template id="t72"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 33- נושאי הנהלת חשבונות ותקציב חוגי</a></p><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib8/Forms/AllItems.aspx" target="_blank" rel="noopener">400- נוהל הזמנת מרצה אורח</a> </p><p>נוהל הזמנת מרצה אורח (טיפ  תקנונים ונהלים  נוהל הזמנת מרצה אורח)</p><p>יש לברר האם יש לו עוסק מורשה או עוסק פטור: </p><div class="li l0"><span class="mk">•</span><div class="tx">במידה וכן עליו להגיש חשבונית מס / קבלה למכללה.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">במידה ולא עליו למלא טופס תשלום חד פעמי / חשבון עצמי את החשבונית או הטופס יש להעביר להנהלת חשבונות ולצרף אישור תיאום מס ממס הכנסה עבור המכללה האקדמית תל-חי , תיק ניכויים 904085735.</div></div><p><u>תעריף תשלום נסיעות:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">במידה והמרצה מגיע באופן עצמאי יקבל החזר נסיעות.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">אם הוא משתלב במערך ההסעות של המכללה, אז אין החזר נסיעות.</div></div><p><u>תעריף תשלום הרצאה:</u></p><p>השכר לשעה הוא לפי התואר או הדרגה ומופיע בטבלאות השכר הרגילות של הות"ת (נמצא בטיפ).</p></template><template id="t73"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 40- טיפול בפטירה של סטודנט</a></p><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib10/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=4e023a77%2D61d4%2D454c%2D8475%2Ddf77eb0280e6" target="_blank" rel="noopener">103- נוהל השתתפות המכללה באבל</a></p><p>טיפול בכרטיס הסטודנט באחריות רכזת החוג: </p><p>1.  שינוי סטטוס הסטודנט : עדכון סטטוס "נפטר" וסיבת נשירה "נפטר" +תאריך פטירה. (אין לשנות תאריך סיום  לימודים במקרה של בוגר)    </p><p>2. הוספת ז"ל ליד שם הסטודנט.</p><p>3. שינוי סטטוס הרישום לקורסים בסמסטר העוקב לפטירה ל – נשר (אם רלוונטי למועד הפטירה).</p><p>4. העברת פרטי הסטודנט למוקד שירות להסרתו מרשימת התפוצה של הביטחון, לאגודת הסטודנטים להסרתו מרשימת התפוצה של האגודה.</p></template><template id="t74"><p>מילוי טופס מקוון ע"י הסטודנט.</p><p>קישור למערכת הטפסים <a href="https://forms.telhai.ac.il/department/27" target="_blank" rel="noopener">https://forms.telhai.ac.il/department/27</a>&emsp;</p><p>מומלץ לשמור במועדפים לגישה מהירה ונוחה.</p><p>*הכניסה באמצעות שם משתמש וסיסמא לפורטל</p><p>בשלב זה הטפסים הרלוונטיים הם טופס פרישה וטופס פריסת לימודים.</p><p>ניתן לצפות בכל הטפסים ע"י לחיצה על "מחלקות", בתפריט, בראש העמוד&gt; "רכזות חוגים"</p><p><figure><img class="shot" loading="lazy" src="images/img150.webp" alt="צילום מסך" width="675" height="212"></figure></p><p><img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUg pACDUghBoQQg0IAb99Rq7gi8+0XeeMBoQwKSKEGhBCDQihBoSAK0Xko6ge4nHu8lclgNQMAOAUsb8h8C1Cj1D4B57/BwBWv0XoEQAkXwHfIP7Hy5csIt8g/sfuIpKv0PWvai8+p3qIx//ET3+B4xdM/XD5hnevYXyHRLWjSu2fc/EJY+GcPBRg/ZzmIW/i1Pr1f4iuIJq/fPzj/3Dxzn/9HfLfm4/frODNv7uftA6xnu/6aS/lNA95Bf/qLf0cby5Kb/v5cbOtiOsKGknXMCl62DzCagDqf/u/KP4eOEV14OGLf4Bxek0hjhmsOpD7peeFX5AGFme6nw79Gcp/kD3trmf6n5wbkPExeKxfx1UWddFrS/UUcEDsZ5cE6J3vdzz6rfXk3IAMFRlSr2+1QMcjcKWI3GmSrzpm0mObsKPSLzoZgPsRNSCflOx3MAI4/hZKFerprZf+D6h/GOe6EJMiYl2DH79qz066V1QTVbybAdDK0W80IlsroUoAjhu6d7FgejwD/rkuwh2m4A5TQsC7yOSOXjXBPUWEUANCqAEh1IAQakAINSCEGhBCDQihBoRQA0KoASHUgBBqQAg1IIQaEEINCKEGhFADQqgBIdSAEGpACDUghBoQQg0IoQaEPDT+D/Iol+vj7j2gAAAAAElFTkSuQmCC" alt="" style="height:176px"></p><p><figure><img class="shot" loading="lazy" src="images/img152.webp" alt="צילום מסך" width="900" height="435"></figure></p><p><u>תהליך עבודה</u>: (רלוונטי לפריסה ופרישה)</p><div class="li l0"><span class="mk">•</span><div class="tx">לאחר שסטודנט מעדכן על כוונתו לפרוש/ לפרוס לימודים יש לשלוח  הודעה לסטודנט עם  תבנית ההודעה הרלוונטית. הקישור לטופס המקוון שעל הסטודנט למלא נמצא בתבנית ההודעה.</div></div><p>תבנית מספר 989317 למילוי טופס בקשה להפסקת לימודים</p><p>תבנית מספר 1044211 למילוי טופס בקשה לפריסת לימודים</p><div class="li l0"><span class="mk">•</span><div class="tx">לאחר מילוי הטופס ע"י הסטודנט יישלח מייל למזכירות החוג הרלוונטית. יש לשמור את  הקובץ המצורף בתיק האלקטרוני של הסטודנט.</div></div><p>טופס פרישה- <a href="https://eur03.safelinks.protection.outlook.com/?url=https%3A%2F%2Fforms.telhai.ac.il%2Fform%2Fporesh&amp;data=04%7C01%7Cmoranv%40telhai.ac.il%7C7e150db8450e47bd39e808d9a8d82a3b%7C27f80a298b294d219bd0172c87ed230d%7C0%7C0%7C637726468643499609%7CUnknown%7CTWFpbGZsb3d8eyJWIjoiMC4wLjAwMDAiLCJQIjoiV2luMzIiLCJBTiI6Ik1haWwiLCJXVCI6Mn0%3D%7C3000&amp;sdata=W0N0%2Bpnz8shRqdB%2Bedb6gtZIZXlJLVE3U3GajLeBoog%3D&amp;reserved=0" target="_blank" rel="noopener">https://forms.telhai.ac.il/form/poresh</a></p><p>טופס פריסה- <a href="https://eur03.safelinks.protection.outlook.com/?url=https%3A%2F%2Fforms.telhai.ac.il%2Fform%2Fprisa&amp;data=04%7C01%7Cmoranv%40telhai.ac.il%7C7e150db8450e47bd39e808d9a8d82a3b%7C27f80a298b294d219bd0172c87ed230d%7C0%7C0%7C637726468643489650%7CUnknown%7CTWFpbGZsb3d8eyJWIjoiMC4wLjAwMDAiLCJQIjoiV2luMzIiLCJBTiI6Ik1haWwiLCJXVCI6Mn0%3D%7C3000&amp;sdata=v%2F1QxApG0QhaCKzkuPoZC0n6DY0kOayRjgq9K2J7xqM%3D&amp;reserved=0" target="_blank" rel="noopener">https://forms.telhai.ac.il/form/prisa</a> </p><p><strong>דוגמא למייל שמתקבל לאחר מילוי הטופס:</strong></p><p><figure><img class="shot" loading="lazy" src="images/img153.webp" alt="צילום מסך" width="587" height="530"></figure></p></template><template id="t75"><p><strong>החל משנתון תשפ"ב</strong> חלה חובת למידת קורסי תוכן באנגלית במהלך התואר, <strong>בנוסף לקורס רמת האנגלית לפטור</strong>:</p><div class="li l0 n"><span class="mk">א.</span><div class="tx">סטודנטים שהתקבלו ברמת אנגלית מתקדמים ב' – נדרשים ללמוד קורס תוכן אחד באנגלית.</div></div><div class="li l0 n"><span class="mk">ב.</span><div class="tx">סטודנטים שהתקבלו ברמת אנגלית פטור – נדרשים ללמוד שני קורסי תוכן באנגלית.</div></div><div class="li l0 n"><span class="mk">ג.</span><div class="tx">סטודנטים שהתקבלו ברמת אנגלית טרום בסיסי א', טרום בסיסי ב', בסיסי ומתקדמים א', פטורים מקורס תוכן נוסף באנגלית.</div></div><div class="li l0 n"><span class="mk">ד.</span><div class="tx">סטודנטים שהחלו לימודים לפני שנה"ל תשפ"ב וביצעו מעבר בין חוגים בשנה"ל תשפ"ב מחויבים לקורסי תוכן באנגלית לפי הנוהל. </div></div><p>תהליך הבקרה:</p><p><strong>עדכון במודל הכללי</strong>- החל ממחזור תשפ"ב בכל הפקולטות</p><p>(במידה ונוספים מודלים חדשים לוודא שמוסיפים גם בהם)</p><p>כרטיס מודל רלוונטי  דרישות נוספות  חדש ונמלא לפי צילום המסך מטה</p><p><figure><img class="shot" loading="lazy" src="images/img154.webp" alt="צילום מסך" width="852" height="468"></figure></p><p><figure><img class="shot" loading="lazy" src="images/img155.webp" alt="צילום מסך" width="900" height="493"></figure></p><p><strong>הנחיות והמלצות לניהול קורס בשפה האנגלית</strong><strong>:</strong></p><div class="li l0"><span class="mk">•</span><div class="tx">שם השיעור יעודכן במכלול בשפה האנגלית</div></div><div class="li l0"><span class="mk">•</span><div class="tx">סוג שיעור יעודכן במכלול- קורס/ סדנא/ קורס מקוון בשפה האנגלית </div></div><div class="li l0"><span class="mk">•</span><div class="tx">ככלל כל החומרים בקורס יועברו בשפה האנגלית לרבות סילבוס, תקציר הקורס ביועץ, תקציר הקורס</div></div><p>בשנתון, שם הקורס, מצגות וכו.'</p><div class="li l0"><span class="mk">•</span><div class="tx">דיונים בכתה רצוי שיתקיימו בשפה האנגלית, במקרה הצורך ניתן להסביר בעברית חומר שאינו מובן.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">ניתן להביא מרצה אורח בשפה האנגלית.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">נוכחות של סטודנט בינלאומי בקורס מחייבת התנהלות בשפה האנגלית בכל ההיבטים, במידה ויהיה</div></div><p>סטודנט כזה תשלח על כך הודעה מראש.</p><div class="li l0"><span class="mk">•</span><div class="tx">התכתבות עם הסטודנטים בפורום הקורס ב moodle ובמייל יכולה להיות בשפה העברית.</div></div><p>בחנים ומבחנים ינוהלו בשפה האנגלית</p><p><strong>עדכון בקורסי השפה וקורסי הרמות באנגלית:</strong></p><p>להיכנס לקורסי הרמה באנגלית ולקורסים בשפה האנגלית ולסמן בשונות&gt; שפת הוראה "אנגלית"</p><p>בנוסף, יש להגדיר את סוג השיעור לפי הסוג המתאים (למשל- קורס בשפה האנגלית).</p><p><figure><img class="shot" loading="lazy" src="images/img156.webp" alt="צילום מסך" width="875" height="461"></figure></p><p><strong>אופן </strong><strong>הפעלת </strong><strong>תהליך</strong><strong> הבקרה</strong><strong>:</strong></p><p><strong><u>שלב א':</u></strong></p><p>ללחוץ על לשונית ניהול&gt; העלאת שנה&gt; תלמידים-בדיקת חובות</p><p><figure><img class="shot" loading="lazy" src="images/img157.webp" alt="צילום מסך" width="609" height="468"></figure></p><p>לא לסמן V בהערה הראשונה. לסמן V רק ב "לעדכן סטטוס אקדמי" ואישור:</p><p><figure><img class="shot" loading="lazy" src="images/img158.webp" alt="צילום מסך" width="458" height="186"></figure></p><p>לבחור את האוכלוסייה הרלוונטית ולייצא לאקסל (לסמן מראש איפה לשמור את האקסל)</p><p><figure><img class="shot" loading="lazy" src="images/img159.webp" alt="צילום מסך" width="686" height="611"></figure></p><p>הדוח מרענן את נתוני הסטודנט והופך להם את הסטטוס הפנימי ל"תקין/ לא תקין" ולכן חשוב לבצע כדי שהבקרה אח"כ תעבוד.</p><p>יראה את כל הסטודנטים מהאוכלוסייה שנבחרה, , אם לא תקין, יופיע מה התנאי שלא עמדו בו.</p><p><figure><img class="shot" loading="lazy" src="images/img160.webp" alt="צילום מסך" width="900" height="251"></figure></p><p><strong><u>שלב ב':</u></strong></p><p>הפקת דוח מספר 565- "חובת לימוד שני קורסים בשפה האנגלית", דו"ח זה יאתר את הסטודנטים שהתקבלו ברמה הנכונה ולעשות רק עליהם את הבקרה.</p><p>הדוח יראה את כל הסטודנטים לפי קוד רמת אנגלית התחלתית ממתקדמים ב' ומעלה.</p><p><u>יש לסנן לפי רמת אנגלית התחלתית</u><u>- מקרא לקוד רמה התחלתית</u><u>:</u></p><p>5- מתקדמים ב'</p><p>6- פטור</p><p>7 פטור לא אקדמי (את הרמה הזו ניתן להוציא מהדוח, נשאר כבקרה למקרה הצורך)</p><p>יש לבדוק את הסטודנטים שרשום להם בסטטוס אקדמי "חובת לימוד 2 קורסים בשפה האנגלית"  ולשלוח תזכורת כי עליהם ללמוד קוסי תוכן עד לסוף התואר.</p><p>סטודנטים שיצאו ללא תיאור בעמודה "סטטוס אקדמי- תיאור" זה אומר שהם תקינים. </p><p>כיוון שהתהליך חדש- בשנה הראשונה נוודא שאכן יצא תקין מול דוח 529- לבדוק מתקבלים לפי רמת אנגלית התחלתית ולוודא שכל הסטודנטים הרלוונטיים יצאו.</p><p><strong>יש לשים דגש לפני פתיחת שנת לימודים לסטודנטים שעולים לשנה ג' ו ד' ועדיין לא עומדים בתנאי כדי שישלימו את התנאי עד לסוף התואר.</strong></p><p><strong>לדגומא</strong><strong>:</strong></p><p>בדוח יצא שיעל כצמן עדיין לא סיימה את התנאי של חובת למידת קורסי תוכן באנגלית</p><p>לעומתה, גיא אור- ההערה יצאה ריקה- כלומר- עמד בדרישה והוא תקין</p><p><figure><img class="shot" loading="lazy" src="images/img161.webp" alt="צילום מסך" width="858" height="293"></figure></p></template><template id="t76"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 19- רישום היעדרות מרצים במכלול</a></p><p>נוהל נוכחות והיעדרות מרצים  408</p><p>כדי לבטל שיעור עקב אי הגעה של מרצה, נכנסים לשיעור המרצה, לוחצים על מפגשים, בוחרים את התאריך שבו המרצה מבטל את השיעור ולוחצים פעמיים על השורה, מוחקים את הכיתה (חדר) ע"י לחיצה ctrl+0 , בסעיף היעדרות לוחצים על האייקון בצד השמאלי &lt; אישור היעדרות &lt; היעדרות כן מאושרת, סיבת היעדרות &lt; לוחצים על שלוש הנקודות בצד השמאלי ובוחרים את הסיבה להיעדרות המרצה ולאחר מכן לחיצה על 'שמור', המערכת תשאל אותנו אם אנו מעוניינים לשלוח הודעות לסטודנטים, במידה וכן ניתן ללחוץ כן ובמידה ולא ניתן ללחוץ לא.</p><p><figure><img class="shot" loading="lazy" src="images/img162.webp" alt="צילום מסך" width="504" height="416"></figure></p><p><figure><img class="shot" loading="lazy" src="images/img163.webp" alt="צילום מסך" width="510" height="209"></figure></p><p>לאחר ביטול השיעור המפגש יהפוך להיות בצבע אפור:</p><p> <figure><img class="shot" loading="lazy" src="images/img164.webp" alt="צילום מסך" width="737" height="36"></figure></p></template><template id="t77"><p>כאשר אנו מעדכנים במכלול עוזרי הוראה בקורס מסוים, חשוב להפעיל עבורם מתג "עוזר הוראה". עוזר הוראה המופיע במכלול ללא מיתוג זה, יפתח עבורו משוב הוראה (מצב לא תקין מאחר ורק עבור מרצים צריך להיפתח משוב הוראה). ניתן לבצע בקרה על מיתוג זה באמצעות דוח 527- המציג את כל הקורסים בהם מופיע יותר ממרצה אחד. במידה ואכן אחד מאנשי הסגל בקורס הינו עוזר הוראה, עלינו להפעיל עבורו מתג "עוזר הוראה" באופן הבא:</p><div class="li l0"><span class="mk">•</span><div class="tx">נבחר מרשימת השיעורים את הקורס הרלוונטי, וניכנס לשורה של איש הסגל הרלוונטי</div></div><p><figure><img class="shot" loading="lazy" src="images/img165.webp" alt="צילום מסך" width="809" height="527"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">בחלון שיפתח נסמן  במתג "עוזר הוראה"</div></div><p><figure><img class="shot" loading="lazy" src="images/img166.webp" alt="צילום מסך" width="557" height="443"></figure></p></template><template id="t78"><p>כאשר מרצה מעוניין להשלים שיעור שבוטל במהלך הסמסטר, עלינו להיכנס לשיעור המרצה ללחוץ על מפגשים ולאחר מכן על האייקון 'חדש' אשר מופיע בסרגל למעלה: <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACYAAAAuCAIAAADLDPyUAAAEH0lEQVR42u1XX0xbVRj/zr2XUrizIGwBSde7NjE8sCXVh2IyoDGyxWDYQ/VhMI2KYSMkEFyyxGgyw/YwhFczdLol0/nnxc25zAe6aKCDhRAflD9CZumfMTT2j7S2pdfefp8PHbS0JdyYhiXCyX0437nf+X7n933f+c45LBSWYXubgEjbD4nbDUmPgSXtCJbbH8vHkbGkCrLt+LHV1dVUn+d5ACAiRGxra+vp6fnTFy28Y/v6+sxms06nSyaT64Mcx9lsNkVRent7ff6YSkjmdvvU6BFFqqurtVpt5qCiKDzP+/3+/v7+ubk5u92+tPRXAWOZR40xtry8rNVqu7u7Z2Zm4vG4GmsCqYslYxvEsbGxwcFBRJRlubW11WazGQyGSCRCxAoWS46jzMVFIpHoE7G3T/fduHkjFAoJgqAoSiKRQBQKBkmUzIRUFIUXuP3SvlKx5P7sfYfDodFojEajGmtqY8kYpvwZi8U4jpufn1eURFgORORwOByenZ1ljCFiXd1zBYMkUohoYGAgJIYEjUCIe58uW4WQ+FTRohh0OB3AYGJi4tatlxYX/YUqeJRqh09YDtYagUijZXG2Yj3yzLMNtQn8J6qEb5/+yev1ImoLw5LnGQDIsjxy88dx3V2e8Tp90cHnq1w/r/wxHVEQk5SE1aKpqalDhxoKdJLwAAAtLS0LCwuh30PRaDTw0F/cWBH6NSj8Ipbv2ROLxcr0ZQCwpUH1LHmO49rb2ycnJ10ul9vtXvGtlGv2FgsPdZWiyWQKBAJ6vb60tHRLgwKpO6J5nlcUpaSkRJIkURRlWeYC7EntPg1fzBirrKysqampqqoyGo2YxMKwdDqd4+PjmaWAPDD8xtdEVFFR4fP5JEmyWq1LDyJ5S+N/gTSbzfF4fF20WCz19fXT09PBYFAUxdra2rq6uvLycq/n7623+L17C7sXkd2rc6Guzu6POs7B2StdBzb23Vdt52DoLJzpuOrMMnHg9etXrPaOjmF3euzo+z8MWdXGkogIKLUQ129u6agBCQFcbqfUZDJYv7nz2rqq/XzzSNOdISsAeoikrsuXuyQAAPB89vJbbw6vi9mnPSFt/CBVJwlpdNTe1NhMSIQjo6NHmhopWxkAcmYRkuHVU00e+6grRx+JkHJYIgEAIrmuvXLec+pSAyECOOxjjc3vZcfgkSZmzFpTMEkSEVLe1MzJWCLwXDr54scAze9+37kfEWHxi8/tjScu5OQ2ERClRomAANMaSARAuBlkFksgw8nhi50GAEBCAO+X71wzXLh9OHfJKbMplpDur/2CzVhSPsfS2rPh7geWgQedFz98YZO9lI5o5qx1SFLrWO+n3cc+SUmG4199d8YI+T2EaedlO/ZR3uedxr69PrHt1YdoR5T1HfFwp13H/k+O6H8BX8jze3O2pTEAAAAASUVORK5CYII=" alt="" style="height:46px"></p><p>לאחר מכן עלינו למלא את פרטי מפגש ההשלמה : תאריך, שעות, פעילות (מפגש השלמה קוד 13), שעות (כמה שעות המפגש), תקציב (סעיף תקציבי של החוג), חדר.</p><p><div class="callout"><p>בוחרים חדר פנוי</p></div><div class="callout"><p>משנים פעילות ל'מפגש השלמה'</p></div><div class="callout"><p>מציינים תאריך ושעה</p></div><figure><img class="shot" loading="lazy" src="images/img167.webp" alt="צילום מסך" width="335" height="432"></figure></p><p>במקרה של יצירת מפגש השלמה כדאי לשלוח לסטודנטים הרלוונטיים הודעה יזומה ולא את הודעת המערכת האוטומטית (ראה בערך הבא). </p></template><template id="t79"><p>כאשר אנו מעוניינים לשלוח הודעה יזומה לסטודנטים ולא הודעה אוטומטית, עלינו להיכנס במכלול לניהול  רשימת הודעות. בתוך רשימת ההודעות עלינו ללחוץ על 'חדש'. </p><p>בתוך כרטיס ההודעה אנו נבחר <strong>בסוג ההודעה</strong> (למי אנו מעוניינים לשלוח את ההודעה):</p><p><strong><u>שלוחה</u></strong><strong>:</strong> מדעים-50, מח"ר- 100,</p><p> <strong><u>שיעור</u></strong><strong>:</strong> במידה ואנו שולחים לסטודנטים משיעור מסוים נלחץ על שלוש הנקודות שבצד שמאל ונבחר שיעור ספציפי ע"י סימון <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB0AAAAOCAIAAABcs4BtAAABY0lEQVR42mP88OEDA24wb/78tNRUTHEWFhZGRsa/f//++/dv1uzZSYmJ6AoYiAC79h9F5kpLil+5/eHW/depkZaSYoJYtRBlLgMDg6yMDITByMioKCfdN2/N2w9fnR68kRIXoshcCGBiYhQWFDh06t67D18VZYX1NCT+/fuHXSWRJnJxcYgIC3CwswkJ8q3feYmJiSncx/DL1y84XUCMoeJiIl++MRw581hCTOjEuYev336VlRK0MVX69fMXLi1EhYOkuMiE+Sdv3n2loya1dvslJibGYE+Df//+sXNwUOTe9+8/FCTZMzIyVnVvefLig5gwr6OV6r9//1hZWSgy9+fPnzzc7M42aowMjIyMjP5uuowM/5mYmFhZWCgKBxZmpg/vXod46jEy/GdhYXayUv385cv/f/+ZmSkzV0tTA5JycxPs//////fvXw52dgJOIWjorNmzGUgHjPjLB7IBEwNtAABVdXHHPCZ8hgAAAABJRU5ErkJggg==" alt="" style="height:14px">  </p><p><strong><u>נושא</u></strong><strong>:</strong> מציינים נושא ההודעה. </p><p> <strong><u>לפרסום עד תאריך</u></strong><strong>:</strong> עד איזה תאריך ההודעה תפורסם בפורטל הסטודנט.</p><p> <strong><u>תאריך לשליחה</u></strong><u>:</u> ניתן לקבוע מועד שבו ההודעה תישלח. </p><p><u>משם:</u> לכתוב ממי נשלחת ההודעה</p><p><strong><u>הודעה מתמשכת עד תאריך</u></strong><u>:</u> במידה ושולחים הודעה לקורס מסוים ואנו מעוניינים שבמידה ויצטרפו סטודנטים נוספים לקורס גם הם יקבלו את ההודעה מסמנים <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB0AAAAOCAIAAABcs4BtAAABY0lEQVR42mP88OEDA24wb/78tNRUTHEWFhZGRsa/f//++/dv1uzZSYmJ6AoYiAC79h9F5kpLil+5/eHW/depkZaSYoJYtRBlLgMDg6yMDITByMioKCfdN2/N2w9fnR68kRIXoshcCGBiYhQWFDh06t67D18VZYX1NCT+/fuHXSWRJnJxcYgIC3CwswkJ8q3feYmJiSncx/DL1y84XUCMoeJiIl++MRw581hCTOjEuYev336VlRK0MVX69fMXLi1EhYOkuMiE+Sdv3n2loya1dvslJibGYE+Df//+sXNwUOTe9+8/FCTZMzIyVnVvefLig5gwr6OV6r9//1hZWSgy9+fPnzzc7M42aowMjIyMjP5uuowM/5mYmFhZWCgKBxZmpg/vXod46jEy/GdhYXayUv385cv/f/+ZmSkzV0tTA5JycxPs//////fvXw52dgJOIWjorNmzGUgHjPjLB7IBEwNtAABVdXHHPCZ8hgAAAABJRU5ErkJggg==" alt="" style="height:14px">בהודעה מתמשכת ונמלא את התאריך- עד מתי אנו מעוניינים שההודעה תפורסם (למשל בתקופת שינויים נגדיר תאריך של סוף התקופה). כל מצטרף חדש לקורס עד תאריך זה יקבל את ההודעה ששלחנו. </p><p> נסמן <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB0AAAAOCAIAAABcs4BtAAABY0lEQVR42mP88OEDA24wb/78tNRUTHEWFhZGRsa/f//++/dv1uzZSYmJ6AoYiAC79h9F5kpLil+5/eHW/depkZaSYoJYtRBlLgMDg6yMDITByMioKCfdN2/N2w9fnR68kRIXoshcCGBiYhQWFDh06t67D18VZYX1NCT+/fuHXSWRJnJxcYgIC3CwswkJ8q3feYmJiSncx/DL1y84XUCMoeJiIl++MRw581hCTOjEuYev336VlRK0MVX69fMXLi1EhYOkuMiE+Sdv3n2loya1dvslJibGYE+Df//+sXNwUOTe9+8/FCTZMzIyVnVvefLig5gwr6OV6r9//1hZWSgy9+fPnzzc7M42aowMjIyMjP5uuowM/5mYmFhZWCgKBxZmpg/vXod46jEy/GdhYXayUv385cv/f/+ZmSkzV0tTA5JycxPs//////fvXw52dgJOIWjorNmzGUgHjPjLB7IBEwNtAABVdXHHPCZ8hgAAAABJRU5ErkJggg==" alt="" style="height:14px">בהודעה לשליחה בדוא"ל, לאחר מכן נלחץ על האייקון שנמצא מתחת להודעת HTML נרשום את ההודעה ונעתיק אותה גם להודעת SMS, לאחר מכן נלחץ על 'שמור'. </p><p>להלן צילום מסך:</p><p><figure><img class="shot" loading="lazy" src="images/img169.webp" alt="צילום מסך" width="718" height="675"></figure></p><p>כדי לוודא שההודעה אכן נשלחה ניתן להיכנס לניהול&lt;רשימת הודעות&lt;סימון <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB0AAAAOCAIAAABcs4BtAAABY0lEQVR42mP88OEDA24wb/78tNRUTHEWFhZGRsa/f//++/dv1uzZSYmJ6AoYiAC79h9F5kpLil+5/eHW/depkZaSYoJYtRBlLgMDg6yMDITByMioKCfdN2/N2w9fnR68kRIXoshcCGBiYh ציינים סיבת היעדרות</p></div><figure><img class="shot" loading="lazy" src="images/img191.webp" alt="צילום מסך" width="520" height="211"></figure></p><p>מסמנים אישור על 'שליחת הודעה למאגר' בכדי שהסטודנטים יקבלו הודעה על הביטול</p><div class="li l0"><span class="mk">•</span><div class="tx">מומלץ לשלוח מייל למרצים שמלמדים את השיעורים הרלוונטיים ולעדכן אותם על ביטול השיעור </div></div></template><template id="t81"><p>כדי לשנות כיתה של כל הקורס כולו, עלינו להיכנס לקורס וללחוץ פעמיים על השורה תחת הלשונית 'מועדים'</p><p><figure><img class="shot" loading="lazy" src="images/img192.webp" alt="צילום מסך" width="810" height="527"></figure> </p><p>בתוך פרטי מועד השיעור נוכל להחליף את הכיתה:</p><p><figure><img class="shot" loading="lazy" src="images/img193.webp" alt="צילום מסך" width="554" height="507"></figure></p><p><strong>סוגי כיתות:</strong></p><div class="li l0"><span class="mk">•</span><div class="tx"><u>כיתת לימוד פרונטלי</u>- כיתה עם שולחנות</div></div><div class="li l0"><span class="mk">•</span><div class="tx"><u>כיתת לימוד סטודנטיאלי</u>- כיתה עם כיסאות סטודנט בלבד</div></div><div class="li l0"><span class="mk">•</span><div class="tx"><u>רחף כיתת לימוד פרונטלי</u>- כיתה עם שולחנות ארוכים מקובעים לרצפה.</div></div></template><template id="t82"><p>כדי לשנות כיתה במפגש ספציפי עלינו להיכנס לקורס וללחוץ על 'מפגשים' :</p><p><figure><img class="shot" loading="lazy" src="images/img194.webp" alt="צילום מסך" width="445" height="296"></figure></p><p>בתוך רשימת המפגשים נבחר את המועד הרצוי לפי תאריך ונלחץ פעמיים על השורה (לחיצה על הלשונית 'תאריך' תסדר לנו את המפגשים בסדר כרונולוגי ויקל עלינו את החיפוש) :</p><p><figure><img class="shot" loading="lazy" src="images/img195.webp" alt="צילום מסך" width="466" height="160"></figure></p><p>בתוך המפגש נוכל לשנות את מס' הכיתה למפגש הספציפי שבחרנו:</p><p><img class="ic" src="images/img196.webp" alt="" style="height:322px"></p></template><template id="t83"><p>כאשר אנו רוצים לשריין כיתה מסוימת עבור ישיבה, מפגש או כל דבר אחר, עלינו ליצור מפגש מיוחד. </p><p>כדי ליצור מפגש כזה, עלינו להיכנס בסרגל למעלה ל : ת"ל מוסדית &lt; שיעורים&lt; שם שיעור- 'מפגש מיוחד'. </p><p><figure><img class="shot" loading="lazy" src="images/img197.webp" alt="צילום מסך" width="798" height="538"></figure></p><p>נלחץ עליו פעמיים כדי להיכנס ואז ל'מפגשים', בתוך מפגשים נעמוד על עמודת התאריך ונלחץ בסרגל למעלה על האייקון 'חדש', נמלא את הפרטים: תאריך, שעה ,נושא (אפשר לציין עבור מה המפגש), וחדר. לאחר מילוי כל הפרטים נלחץ על 'שמור'. </p><p>במקרה של שריון כיתה במהלך חופשת סמסטר (תקופת בחינות) יש לבצע תיאום מול מדור בחינות. זאת על מנת להימנע מקיום מפגשים שעלולים להפריע להתנהלות בחינה בכיתה סמוכה.</p><p><img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQQAAAFNCAIAAABpPYb5AACEGklEQVR42u19d4AcV5F3vfc6TA6b8652VzlnyUqWLSecs40BE2yCuQMfHMcHB8eRj4M7jpwMGHDOOdtylCVLVs5ppdXmvJO7+71X3x+zYWbjrCzJWqmLRd6d6e7p6ffqVb2qX/2KICLYYostANR+BLbYYiuDLbakiTL4JSHEY489ioiKooyjbyKE6OoO52QHbcfPliGFEJJIGPFEIivglymTBKW84MKLfD4fSZ06hw4eOFZX/+CrbyycNacg4CeEjDMzR6mU0h51W0bQBwAYsFw2NDQcO7xvzpw5acpw15///uzWrbd+/qtdDWEh7fXVlrNCEKAsQJ78+y/TlOFnv/pTrLCkNDDBMkwg9lOy5azRB0JL9EjariBhGJSpBAhl9sbalrNILCHLK6vSlEFVlAQhlBJG++0CYQplbKxXl0Kg4ACEUgJjtzKIEhEBCKXHoZYoJQLYbp4tGU9XJLqqpseLCAgkhFBCeqYgo7St5mB7ff2YNtOImFdRESwptzhvbW61TAPGcjohJJid7XA4TcNob2tDHNueWFGUrJxcNnYFtuUs3lgDAFHSX6ICgRKChAAAVdSWfbvYjjdWTyyWY9lPE0K2vPtc9/IrokIU+7VAcd7AcCcZtIVJeUdIsevAkYIJk1qP1UytKlJVLfNoKSEkHInUHDtaVjXRjizZkqEwQghNzzMQAA5AKEnaAaaw7paW5RMKlk0pMRJG6mGWaQEhuqYKKU3TUhWFpGwzHG5XV1foYGcn1/XJk6cLpkPKbCaEWJaV5p6pat90RwSvS6upbbQsrlKYNHlyKGaNKcZbwvDA0TeBkHEXGrbl5MRSiRScEEIYAwQABAQgaQFWQggZYBkYUwQCpQQpAQBKCFMYt6xod8g0jOT6rVCyvqG7TguaiXiF1d0kKGYVyEjHmlzV79QkIiBIzoUQjFGkVAhhSCtFGcjmd95AM9bnxgjBqe6dt2xF8uYQQeeUEMIoIZSanBuWmfm0RgAFgFFKKUE7InYCZhOlyYePKAFp0n9GKRGBEEj+g8mVhwAASoF98wuT7yQPACCUAEopCaGpB/f/2bNRHDCbKaBEQglIBArJe0ApEQllpOduJPTcQto9EEKseDTUWmtEux2eLKooRrTbX1AR62wBwGDxpD7vnSIBkm4Zdm3dELi0mlKKlAIAZZQQIoVEzgUXgEgAJCWRWKJk1pSL1qy463d/XbR0YdXk6j//4vfctIRCJQIASs5RSEopoRQoAUL7lMGyOJqxr/zzp0KhkOScKqrP5/3ZL/7  אנשי סגל' :</p><p><figure><img class="shot" loading="lazy" src="images/img199.webp" alt="צילום מסך" width="424" height="93"></figure></p><p>ברשימת אנשי הסגל נבחר את המרצה הרצוי, פרטי המרצה המופיעים בכרטיס איש הסגל הם: </p><p><figure><img class="shot" loading="lazy" src="images/img200.webp" alt="צילום מסך" width="823" height="491"></figure></p></template><template id="t85"><p>כדי לשנות את לוגו גיליון הציונים והמאזן, יהיה עלינו ללחוץ על השם שלנו בסרגל הכלים אשר נמצא למטה:</p><p><figure><img class="shot" loading="lazy" src="images/img201.webp" alt="צילום מסך" width="508" height="53"></figure></p><p><div class="callout"><p>לחץ כאן</p></div>לאחר מכן נבחר בלוגו הרצוי עפ"י הפירוט המופיע מטה: <figure><img class="shot" loading="lazy" src="images/img202.webp" alt="צילום מסך" width="446" height="178"></figure></p><p><figure><img class="shot" loading="lazy" src="images/img203.webp" alt="צילום מסך" width="473" height="260"></figure></p><div class="li l0 n"><span class="mk">1.</span><div class="tx">לוגו בעברית</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">ללא לוגו</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx">לוגו באנגלית- משתמשים כשהסטודנט מבקש גיליון ציונים בשפה האנגלית.</div></div><p>לאחר שמשנים את הכותרת, בהפקת גיליון ציונים משנים את הבחירה ל'אנגלית חיצוני'</p><div class="li l0"><span class="mk">•</span><div class="tx"><figure><img class="shot" loading="lazy" src="images/img204.webp" alt="צילום מסך" width="413" height="48"></figure> כשנדפיס על גביי דף לוגו עם חתימה אלקטרונית נשתמש בפתיח וספיח הבאים:</div></div></template><template id="t86"><p>בחוגים בהם מתקיימים קורסים היברידיים/מקוונים, יש לפעול עפ"י <a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 37</a>.</p></template><template id="t87"><p>חיתום דיגיטלי נותן תוקף משפטי למסמכים. חיתום דיגיטלי מחליף את החתימה הידנית וחותמת הגומי של מזכירות החוג. כל תכתובת שאנו מפיקים ממכלול מופקת באופן אוטומטי עם חיתום דיגיטלי. לכן עלינו לשאוף להוציא כל מסמך דרך מכלול. בנוסף, קיימת אפשרות להפיק גיליון ציונים עם חיתום דיגיטלי ולשלוח לסטודנט באופן אוטומטי דרך מכלול.</p><p>כיצד נשלח לסטודנט גיליון ציונים עם חיתום דיגיטלי?&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;  נפיק גיליון ציונים עם לוגו ונשמור אותו בקובץ PDF בתיקיית J  HEB  IN  לאחר מכן הקובץ יופיע בתיקיית OUT חתום דיגיטלית ונוכל לצרף את הקובץ להודעה לסטודנט.</p><p>(חשוב: לאחר סיום ושליחת הקובץ יש למחוק אותו מתיקיית OUT).</p><div class="li l0"><span class="mk">•</span><div class="tx">דרך נוספת לחיתום גיליון ציונים דיגיטלית:</div></div><div class="li l0 n"><span class="mk">1.</span><div class="tx">נפיק גיליון ציונים לסטודנט</div></div><p><figure><img class="shot" loading="lazy" src="images/img205.webp" alt="צילום מסך" width="544" height="405"></figure></p><div class="li l0 n"><span class="mk">2.</span><div class="tx">נלחץ על לחצן 'מתקדם...'</div></div><p><figure><img class="shot" loading="lazy" src="images/img206.webp" alt="צילום מסך" width="572" height="240"></figure></p><div class="li l0 n"><span class="mk">3.</span><div class="tx"><figure><img class="shot" loading="lazy" src="images/img207.webp" alt="צילום מסך" width="571" height="669"></figure>בחלון הבא שיפתח לנו (פרמטרים לגלצ) נסמן ב 'שליחה בemail'. חשוב לזכור שה- לא נשמר, ובכל הפקה שבה נרצה לשלוח לסטודנט גל"צ חתום דיגיטלית, נצטרך לסמנו מחדש.</div></div></template><template id="t88"><p>השמטה של קורס <strong>במהלך התואר</strong> ניתן לבצע <strong>רק</strong> על הקורסים הבאים: קורס כלל מכללתי (קורס רוח או בינתחומי), בחירה חופשית, חובת בחירה (מתוך רשימה סגורה ובמקרה בו הסטודנט בחר יותר מהנדרש בקורס מקביל- בחירה של אחד מתוך שניים, במקרה בו הסטודנט בחר את שניהם) שהציון בהם "לא עמד בחובות הקורס ונכשל" (משמעות 0)  או ציון נכשל.</p><p>השמטה תיתכן בעת שיבוץ הסטודנט לקורס חלופי בלבד, משמע בימי שיבוצים ושינויים בלבד ולא לאורך השנה.</p><p>לא ניתן להשמיט שום קורס אחר שלא בהגדרה זו במהלך התואר, אלא רק במעמד סגירת תואר.</p><p>במקרה בו סטודנט ביצע מעבר בין חוגים וקיימים קורסים שאינם שייכים לתכנית הלימודים ניתן להשמיט אותם.</p><p>הוצאה מתכנית הלימודים נבצע במקרים הבאים: </p><div class="li l3 n"><span class="mk">1.</span><div class="tx">סגירת תואר- במידה והסטודנט צבר מעבר לנ"ז הנדרש לסגירת תואר, יש להשמיט/ להוציא קורסים מחוץ לתכנית הלימודים.</div></div><div class="li l3 n"><span class="mk">2.</span><div class="tx">קורס עודף- במידה והסטודנט למד קורסים עודפים, נוציא קורסים אלה מחוץ לתכנית הלימודים לפי <a href="https://telhaimng.sharepoint.com/sites/tip/DocLib11/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=620ad446%2Dfa86%2D4f40%2Db1c6%2D4d65186206c2&amp;id=%2Fsites%2Ftip%2FDocLib11&amp;siteid=%7B513A404B%2D396A%2D4171%2DA257%2D0CEE49922CD0%7D&amp;webid=%7BCB2DF87E%2D3517%2D459A%2DAF3C%2D97B42DAC8A22%7D&amp;uniqueid=%7BD9E914A9%2DAE4C%2D426C%2D9233%2D57F5C2B8D422%7D" target="_blank" rel="noopener">נוהל קורס נקודות זכות עודפות ואחסון קורסים</a>.</div></div><div class="li l3 n"><span class="mk">3.</span><div class="tx">מסלול מואץ לתואר מוסמך- במידה והסטודנט במסלול זה, בעת שיבוץ הקורסים הרלוונטיים לתואר השני במנוי התואר הראשון יש להוציא קורסים אלו מחוץ לתכנית הלימודים. (<a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 44</a>)</div></div><div class="li l3 n"><span class="mk">4.</span><div class="tx">תכנית השלמות- בעת שיבוץ קורסים במסגרת תכנית השלמות לתואר מוסמך, יש להוציא קורסים אלו מחוץ לתכנית הלימודים בכדי שלא ייחשבו בגיליון הציונים.</div></div><p><u>תהליך עבודה:</u></p><p>במידה ויש צורך בהסרת/ השמטת קורסים- נפעל באופן הבא:</p><div class="li l0"><span class="mk">•</span><div class="tx">נכנסים לתכנית הלימודים בשנה הרלוונטית בה הקורס שרוצים להסיר/ להשמיט נלמד  בחירת הקורס המבוקש  נתונים מיוחדים לתלמיד. </div></div><p><strong>השמטה</strong><strong> (הקורס לא יופיע כלל בגיליון הציונים</strong><strong>, לא יכנס לסך נ"ז שנצברו לתואר ואף לא יחשב לממוצע</strong><strong>)</strong><strong>:</strong> </p><p><img class="ic" src="images/img046.webp" alt="" style="height:175px"></p><p><strong> הוצאה מ</strong><strong>חוץ </strong><strong>ל</strong><strong>תכנית</strong><strong> הלימודים</strong><strong> (הקורס יופיע בסוף גיליון הציונים, לא יכנס לסך נ"ז שנצברו לתואר ואף לא יחשב לממוצע)</strong><strong>:</strong></p><p><img class="ic" src="images/img047.webp" alt="" style="height:182px"></p></template><template id="t89"><p>כאשר אנו מעוניינים לבצע הפקה בדוחות/ תהליכים עם מספרי זהויות בצורה מרוכזת כך שלא צריך לקשור את הדוח/תהליך באוכלוסייה מסוימת אלא רק במספרי הזהות.</p><p>בעמודה הראשונה יופיעו מספרי תעודות הזהות של הסטודנטים אליהם נרצה לשלוח את ההודעה, במידה ובקובץ יש סטודנטים משלוחות שונות, צריך לשלוח את ההודעה בנפרד מהמכלול מכל שלוחה.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">יש ליצור קובץ EXCEL המכיל את הזהויות. חשוב שסוג הקובץ יהיה Excel Workbook על מנת שהמכלול יצליח למצוא אותו , נגדיר קובץ,  מבנה הקובץ צריך להיות ללא כותרות, שם הגיליון "ZHT".</div></div><p><figure><img class="shot" loading="lazy" src="images/img208.webp" alt="צילום מסך" width="758" height="752"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx"><figure><img class="shot" loading="lazy" src="images/img209.webp" alt="צילום מסך" width="774" height="700"></figure>בדוח בחירת אוכלוסייה יש לבחור הגדרות חתך ואז לבחור קובץ עם רשימת הזהויות  (לחיצה על הקובייה הירוקה ליד- הגדרת חתך)</div></div><div class="li l0"><span class="mk">•</span><div class="tx">יש לבצע "אשר" והדוח יופק עבור התלמידים שמכילים את הזהויות שבחרנו.</div></div></template><template id="t90"><div class="li l3 n"><span class="mk">1.</span><div class="tx">סמינר/ קורס מתקדם- במידה וקיימים שיעורי סמינר/קורסים מתקדמים (בחוגים מסוימים) יש יסה לתלמידים דוחות אישורי סיום הכשרת מורים אישורים (ניתן ליצור קיצור דרך - כאשר מגיעים לפרט בתפריט, יש ללחוץ על הפרט ועל ctrl ). נמתג את השדות הבאים: *(נוסח- 270 במחר ו173 במדעים) בחוג למדעי התזונה נסמן את המתגים הבאים: לתכניות מוסמך במסלול מחקרי יש לסמן את המתגים הבאים: *(נוסח- 289 במחר ו 184 במדעים) נבחר את הסטודנט מהשנה האחרונה שלו בתכנית ולאשר: המערכת תפיק באופן אוטומטי לסטודנט אישור זכאות ותשתול אותו בתיק האלקטרוני תחת תדפיסים אישור זכאות לתעודה. שלוחה 100 נוסח 270 שלוחה 50 נוסח 173 לחוג לתזונה 175 (המשמעות שיותר לא נפיק שום נוסח אחר) המערכת תאתר את התאריך האחרון שבו הסטודנט קיבל ציון ותשתול אותו בשדה \"זכאות לתעודה\" ת.סיום חובות/ זכאות לתעודה\" (תאריך זה נשתל באופן אוטומטי באישור הזכאות) נכנס לכרטיס הסטודנט נשנה לסטטוס בוגר/ת (סטטוס 37) או בוגר/ת-מוסמך (סטטוס 189). משלב זה לא נשתמש יותר בסטטוס זכאי לתואר. (כך נוכל להפיק גל\"צ עם סטטוס בוגר). נוסיף תאריך סיום לימודים, התאריך הקובע הוא תאריך סיום הסמסטר האחרון בו למד הסטודנט ע\"פ לוח השנה האקדמי. בתוך לשונית \"זכאות לתעודה\" בשדה \"טקס סיום\" יש לבחור את שנת מועד הטקס הרלוונטי בו הסטודנט יקבל את התעודה . בסיום התהליך: נשלח לסטודנט זכאות וגל\"צ במייל, חתומים אלקטרונית. נפיק גיליון ציונים עם לוגו ונשמור אותו בקובץ pdf בתיקיית j heb in לאחר מכן הקובץ יופיע בתיקיית out חתום דיגיטלית ונוכל לצרף את הקובץ להודעה לסטודנט. נתייק את גיליון הציונים החתום דיגיטלית בתיק האלקטרוני של הסטודנט תחת סוג מסמך 120. נשלח מתוך התיק האלקטרוני את הנוסח לסטודנט במייל: תיק אלקטרוני> תדפיסים> אישור זכאות לתעודה> למייל זה נוסיף את גיליון הציונים החתום דיגיטלית. (חשוב: לאחר סיום ושליחת הקובץ יש למחוק אותו מתיקיית out) בגוף המייל נשתמש בתבנית מס' 697565 \"זכאות לתואר תבנית\": נפיק צ'ק ליסט (תכתובת 278 במח\"ר ו180 במדעים) ונעבור על כל הסעיפים, נתייק בתיק האלקטרוני של הסטודנט, נדפיס ונתייק בקלסר בוגרים חוגי לצורך בקרה מול דף פיזי לקראת הטקס. בסיום כל סגירת תואר, יש למלא טבלת מעקב חוגית באקסל הכוללת את שם הסטודנט, ת\"ז, חוג, וממוצע ציונים. לאחר הפקת דוח 507 יש להשוות את הממוצעים ולוודא שתקין. לאחר קבלת פרטי הסטודנטים המצטיינים ממדור בוגרים נעדכן אזכור על הצטיינות/ הצטיינות יתרה זכאות לתעודה רמת סיום . שימו לב- אין צורך לשנות סטטוס כמו בשנים קודמות דגשים: עלינו לעבוד בצמוד לצ'ק ליסט על מנת לוודא שהסטודנט עמד בכל חובותיו האקדמיים. חשוב מאוד להקפיד לסמן קוד טקס סיום לפי הקוד הרלוונטי לאותה השנה. בהפקת גיליון ציונים עלינו להקפיד להפיק את הגל\"צ דרך \"מתקדם\" ולא לסמן v ב\"מטרת לימודים\". חשוב להשוות את הממוצע בגיליון הציונים לממוצע באישור הזכאות. הוספת מנוי במכלול לסטודנטים שנסגר עבורם תואר בראשים ישן או בתוס במידה ויש צורך בהסרת/ השמטת קורסים- נפעל באופן הבא: נכנסים לתכנית הלימודים בשנה הרלוונטית בה הקורס שרוצים להשמיט/ להוציא מתכנית הלימודים נלמד בחירת הקורס המבוקש נתונים מיוחדים לתלמיד. השמטה (הקורס לא יופיע כלל בגיליון הציונים, לא יכנס לסך נ\"ז שנצברו לתואר ואף לא יחשב לממוצע): הוצאה מחוץ לתכנית הלימודים (הקורס יופיע בסוף גיליון הציונים, לא יכנס לסך נ\"ז שנצברו לתואר ואף לא יחשב לממוצע): בשלב זה יש להפיק דו\"ח 507 (זכאים לתואר) בתוך הדו\"ח יש למלא הערה על כל סטודנט לפי הפרמטרים הבאים: פורס לימודים (כמה שנים פרס לימודים), שייכות למרכז חממ\"ה, סטודנט חוזר, בעל הכרות ופטורים (בנ\"ז), פטור לא אקדמי באנגלית, הערת משמעת, באמצעות הערות אלה יקבע מי עונה על הקריטריונים להצטיינות (למידע נוסף ראה נוהל קביעת בוגרים מצטיינים ומצטיינים יתרה 300). את הדו\"ח המלא יש לשלוח לרכזות פקולטה לקראת טקס חלוקת התארים. הנחיות להפקת דו\"ח 507: הפקת הדוח פעמיים: הפקת דוח זכאים 507 א' - נמתג את השדות- \"חוגי לימוד מכיל\" עם שם החוג ושדה- \"טקס סיום מכיל\" עם הטקס הרלוונטי. על דו\"ח זה נעדכן את כל ההערות. בדו\"ח קיימת עמודה לגביי פטור לא אקדמי באנגלית, ועמודה שמחשבת נ\"ז מפטור בה ניתן לבדוק האם הסטודנט למד פחות מ60% נ\"ז במכללה. יש להוסיף לדו\"ח עמודה שמחשבת נ\"ז נצבר ללא פטור ונ\"ז נצבר מפטור ולבדוק שכל הבוגרים/ מוסמכים השלימו את הנ\"ז הנדרש לסגירת תואר, אין לסגור תואר עם עודף נ\"ז אלא עם אישורה של זהבה שמואל. כדי לקבל מידע לגביי סטודנטים השייכים למרכז תמיכה וסטודנטים עם הערת משמעת- נפיק את דו\"ח 507 ב', נמתג שוב את השדות- \"חוגי לימוד מכיל\" עם שם החוג ושדה- \"טקס סיום מכיל\" עם הטקס הרלוונטי. את המידע על הסטודנטים עם שייכות למרכז חממ\"ה וסטודנטים עם הערת משמעת נקבל בעמודה \"מאפיין\". (מסיבות טכניות לא ניתן לקבל את כלל הנתונים בהפקה אחת). לאחר שנקבל את הנתונים, נוסיף הערת \"מרכז חממ\"ה\" ו\"עבירות משמעת\" לבוגר/ מוסמך הרלוונטי בדו\"ח 507 א'. סגירת תארים לסטודנט/ית משלים לתזה סטודנט/ית משלים/ה לתזה יתקבלו לחוג ראשי שנקרא \"מוסמך לימודי גליל- השלמה לתזה/ מוסמך חינוך- השלמה לתזה\". סטאטוס קבלה 507 - תלמיד מן המניין – משלים לתזה בעת סיום חובות התיזה: נזין סטטוס מסיים 40 – סיים תכנית השלמה לתזה נוסח אישור השלמה תזה – (287 למח\"ר ו198 למדעים)- דיקן פקולטה יהיה חתום עליו כפי שמקובל במוסדות אחרים. בעת ההפקה יש להוסיף על גבי הנוסח את הפרטים הבאים (לא ניתן למשוך אותם ממכלול בשלב זה: נושא העבודה בהנחיית: (שם המנחה) ציון העבודה תאריך הקלדת הציון ימשך אוטומטית מהמכלול. יש להוסיף גל\"צ של הקורסים שנלמדו בשנת ההשלמה. תעודת סיום בטקס בוגרים- ננפיק כתעודה פנימית שתינתן בטקס הבוגרים את הנוסח שנשלח במועד סיום התזה, לשם מתן כבוד לסטודנטים המסיימים - יודפס על דף תעודה מעוצב (כמו של תעודה נלווית) ויכנס לפולדר. (ההדפסה תתבצע ע\"י רכזת פקולטה בעת הדפסת תעודות בוגרים) ביטול טופס טיולים סטודנט שמעוניין לבטל הפעלת טופס טיולים או שמזכירות החוג צריכה לבטל את הטופס מאחר והסטודנט לא צבר את הנ\"ז הנדרש לסגירת התואר ו/או לא עמד בכל החובות האקדמיים. במידה וסטודנט פתח טופס טיולים אך טרם צבר את הנ\"ז הנדרש לסגירת תואר- יש לבטל את טופס הטיולים ולעדכן את הסטודנט שעליו לפתוח טופס טיולים רק לאחר צבירת הנ\"ז הנדרש לסגירת התואר (משמע, אין להשאיר את טופס הטיולים פתוח ולהמתין לעדכון ציונים אחרונים). זאת מאחר ולא ניתן לערער על ציונים לאחר סגירת התואר. כאשר הסטודנט פותח מחדש טופס טיולים לאחר קבלת הציון האחרון לתואר, הוא בעצם מאשר את כל הציונים שלו ואת הממוצע הסופי לתואר. תהליך עבודה: בפורטל טופס טיולים נאתר את הסטודנט שיש לבטל לו את טופס הטיולים ונלחץ על \"ביטול טופס טיולים\" פתיחת כרטיס הסטודנט במכלול לשונית משימות מחיקת המשימות הקשורות לטופס הטיולים עומדים על השורה הרלוונטית ולוחצים על מחק . יש למחוק את משימות- תחנת ספריה, תחנת מדור שכ\"ל ותחנת רכזת חוג. החזרת הסטודנט לסטטוס בו היה לפני שהפעיל טופס טיולים. בד\"כ 69- תלמיד מן המניין. במ const FIN={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function norm(w){
  w=w.toLowerCase().replace(/[֑-ׇ]/g,'').replace(/["'׳״`]/g,'').replace(/[ךםןףץ]/g,c=>FIN[c]);
  if(!/[א-ת]/.test(w)) return w;
  w=w[0]+w.slice(1).replace(/[יו]/g,'');          // כתיב מלא/חסר: תוכנית = תכנית, עים = עם
  if(w.length>=3&&w.endsWith('מ')) w=w.slice(0,-1); // סיומת רבים ים
  if(w.length>3&&/[תה]$/.test(w)) w=w.slice(0,-1);  // סיומות ות/ה/ת
  if(w.length>3&&/^[והבלמשכ]/.test(w)) w=w.slice(1); // קידומות
  return w;
}
const words=s=>(String(s).match(/[֐-׿A-Za-z0-9]+/g)||[]);
const tokset=s=>[...new Set(words(s).map(norm).filter(Boolean))];
const SYN=[['מרצה','סגל','מורה'],['סטודנט','תלמיד'],['תכנית','תוכנית','תכנון','מסלול'],
  ['חדר','כיתה'],['פרישה','הפסקת','נשירה'],['גיליון','תדפיס'],['בחינה','מבחן'],['טופס','טפסים'],['שינוי','עדכון'],['ביטול','הסרה']].map(g=>g.map(norm));

function tmatch(d,x){ if(d===x) return true; if(d.length<3||x.length<3) return false; return d.startsWith(x)||x.startsWith(d); }
function alts(x){ const out=new Set([x]); SYN.forEach(g=>{ if(g.some(y=>tmatch(y,x))) g.forEach(y=>out.add(y)); }); return [...out]; }
const qalts=v=>words(v).map(norm).filter(Boolean).map(alts);

function markHTML(text,qa){
  let out='',last=0; const re=/[֐-׿A-Za-z0-9]+/g; let m;
  while((m=re.exec(text))){ const n=norm(m[0]); out+=esc(text.slice(last,m.index));
    out+= qa.some(al=>al.some(x=>tmatch(n,x)))?'<mark>'+esc(m[0])+'</mark>':esc(m[0]); last=m.index+m[0].length; }
  return out+esc(text.slice(last));
}
function snippet(t,qa){
  const re=/[֐-׿A-Za-z0-9]+/g; let m;
  while((m=re.exec(t.x))){ const n=norm(m[0]); if(qa.some(al=>al.some(x=>tmatch(n,x)))){
    return '…'+markHTML(t.x.slice(Math.max(0,m.index-50),m.index+90),qa)+'…'; } }
  return '';
}
