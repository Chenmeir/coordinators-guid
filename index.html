<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מדריך לרכזות מנהל לימודים</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--mut:#5d6779;--line:#dfe3ea;--acc:#1f5fbf;--acc2:#e8f0fd;--warn:#fff6dd;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ecf3;--mut:#9aa6ba;--line:#2c3441;--acc:#7fb0ff;--acc2:#1f2b42;--warn:#3a321a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hd{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center}
.tb{display:flex;gap:6px}.tbtn{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}.tbtn span{font-size:14px}.tbtn:hover{border-color:var(--acc)}
.evl{display:flex;flex-direction:column;gap:6px}
.evrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:inherit;text-decoration:none}
a.evrow:hover{border-color:var(--acc)}
.evn{flex:1;min-width:0}.chip.g{background:var(--bg);color:var(--mut);border:1px solid var(--line)}.seg{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}.seg.stk{position:sticky;top:var(--hh,76px);z-index:4;background:var(--bg);padding:8px 0;margin:0 0 6px;border-bottom:1px solid var(--line)}.seg button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}.bn{display:block;color:var(--mut);font-size:13px;margin:2px 0 6px}.evn small{display:block}
.evrow.lk{cursor:pointer}.evrow.lk:hover{border-color:var(--acc)}.srch{opacity:.6;font-size:14px}
.evrow.past{opacity:.55}.evc{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.evn small{display:block;color:var(--mut);font-size:13px}
.dt{font-size:14px;color:var(--mut);white-space:nowrap;min-width:84px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--acc);color:#fff}
.tlb{border:1px solid var(--line)}.evb{margin:4px 0}.evb.past{opacity:.55}
.adm{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px}
.adm summary{cursor:pointer;font-weight:600}.adm .row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn.up{display:inline-block}.btn[disabled]{opacity:.45;cursor:default}
a.chip{text-decoration:none}
.logo{font-weight:700;font-size:19px;cursor:pointer;white-space:nowrap}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
#q{flex:1;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
#q:focus{outline:2px solid var(--acc);border-color:transparent}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:6px 0 14px}
h2{font-size:20px;margin:26px 0 10px}
.crumbs{font-size:14px;color:var(--mut);margin-bottom:8px}
.crumbs a{color:var(--acc);text-decoration:none;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;display:block;color:inherit;text-decoration:none}
.card:hover{border-color:var(--acc);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card .ic{font-size:28px;line-height:1}
.card b{display:block;font-size:18px;margin:8px 0 2px}
.card span{color:var(--mut);font-size:14px}
.card em{font-style:normal;font-size:13px;color:var(--acc)}
.now{background:var(--acc2);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.now h2{margin:0 0 6px;font-size:18px}
.list a{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;color:inherit;text-decoration:none;cursor:pointer}
.list a:hover{border-color:var(--acc)}
.chip{font-size:12px;background:var(--acc2);color:var(--acc);border-radius:999px;padding:2px 10px;white-space:nowrap}
.months{display:flex;flex-wrap:wrap;gap:8px}
.months a{cursor:pointer;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:inherit;text-decoration:none;font-size:15px}
.months a.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.months a.off{opacity:.45}
.sn{color:var(--mut);font-size:14px;margin-top:3px}
mark{background:#ffe27a;color:#000;border-radius:3px;padding:0 2px}
article{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 22px 22px}
article p{margin:.7em 0}
.li{display:flex;gap:8px;margin:.45em 0}
.li .mk{flex:none;min-width:1.4em;color:var(--acc);font-weight:700;text-align:center}
.li .tx{flex:1;min-width:0}
.l1{margin-inline-start:26px}.l2{margin-inline-start:52px}.l3{margin-inline-start:78px}.l4{margin-inline-start:104px}
figure{margin:12px 0;text-align:center}
img.shot{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
img.ic{vertical-align:middle;margin:0 3px;max-width:none}
.callout{background:var(--warn);border-radius:10px;padding:6px 14px;margin:10px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
article a{color:var(--acc);word-break:break-word}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.empty{color:var(--mut);padding:20px 4px}
footer{max-width:980px;margin:0 auto;padding:0 16px 30px;color:var(--mut);font-size:13px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:12px}
#lb img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
@media print{header,.nav,.crumbs,footer{display:none}body{background:#fff}article{border:0;padding:0}}
@media (max-width:700px){.logo{display:none}}
@media (max-width:560px){.tbtn span{display:none}.tbtn{padding:8px 12px}.logo small{display:none}h1{font-size:22px}article{padding:4px 14px 16px}.l1{margin-inline-start:16px}.l2{margin-inline-start:32px}.l3{margin-inline-start:48px}.l4{margin-inline-start:64px}}
</style>
</head>

<footer>מבוסס על חוברת ההדרכה לרכזות מנהל לימודים, עודכנה לאחרונה ב-19/11/2026. אם נמצאה אי-התאמה בין הדף לחוברת, החוברת היא הקובעת.</footer>

<template id="t0"><p>לפני תחילת סמסטר הרכזות יקלידו את מועדי ושעות הקורסים הנלמדים במכלול, </p><p>כל רכזת תציין בתוך מאפייני הקורס את ההגדרות לשיבוץ חדרים:</p><p><figure><img class="shot" loading="lazy" src="images/img003.webp" alt="צילום מסך" width="557" height="362"></figure></p><p>בתוך הגדרות לשיבוץ חדרים נבחר את סוג החדר: פרונטלי (שולחנות וכסאות), סטודנטיאלי (כיסא המחובר אליו משטח כתיבה) כיתת מחשבים. </p><p>בנוסף, נציין את המתחם: קמפוס מזרחי/מערבי. </p><p>בנתונים נוספים נציין את מאפייני השיעור: </p><p> <figure><img class="shot" loading="lazy" src="images/img004.webp" alt="צילום מסך" width="520" height="142"></figure></p><p>לאחר מכן ראש מדור לוגיסטיקה תשבץ את הכיתות (רלוונטי לקורסים בהם הסטטוס הוא "פריסה אוטומטית").</p><p> בסוף השיבוץ כל רכזת תבדוק שאכן הכיתה ששובצה מתאימה למאפייני השיעור. </p></template><template id="t1"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib11/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=620ad446%2Dfa86%2D4f40%2Db1c6%2D4d65186206c2&amp;id=%2Fsites%2Ftip%2FDocLib11&amp;siteid=%7B513A404B%2D396A%2D4171%2DA257%2D0CEE49922CD0%7D&amp;webid=%7BCB2DF87E%2D3517%2D459A%2DAF3C%2D97B42DAC8A22%7D&amp;uniqueid=%7BD9E914A9%2DAE4C%2D426C%2D9233%2D57F5C2B8D422%7D" target="_blank" rel="noopener">נוהל הכרות ופטורים מלימודים קודמים 327-8</a> </p><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">הנחית עבודה מס' 16 - טיפול</a> בהכרות ופטורים</p><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 8- קרדיט לסטודנט בגין שירות מילואים, פעילות חברתית והשתתפות בפעילות ספורט</a></p><p>רלוונטי גם למתקבלים לסמסטר א'. רכזת החוג תפיק דוח 506- מתקבלים על סמך לימודים קודמים ותטפל בבקשות להכרות ופטורים במכלול.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">כיצד נפיק דוח 506?</div></div><p><figure><img class="shot" loading="lazy" src="images/img005.webp" alt="צילום מסך" width="900" height="469"></figure><br></p><div class="li l0"><span class="mk">•</span><div class="tx">נמלא ערכים לדוח</div></div><p><figure><img class="shot" loading="lazy" src="images/img006.webp" alt="צילום מסך" width="478" height="333"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">נאתר בדוח את הסטודנטים שהתקבלו על סמך לימודים קודמים וכן בוגרי מכינות תל חי. </div></div><div class="li l0"><span class="mk">•</span><div class="tx">בשדה "נקודות זיכוי" יופיעו פטורים שהוזנו לסטודנט (שורה עבור כל פטור, כך נדע שטיפלנו בסטודנט מאחר והדו"ח לא מתעדכן)</div></div><div class="li l0"><span class="mk">•</span><div class="tx">במידה וגיליון הציונים לא נמצא בתיק האלקטרוני, נפנה אל הסטודנטים וננחה אותם להגיש בקשה להכרות ופטורים באמצעות הפורטל.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">על הסטודנט לצרף לבקשה סילבוסים חתומים <strong>בחותמת</strong><strong> וחתימה מקורית</strong><strong> נאמן למקור</strong> של מוסד הלימודים.</div></div><p>במידה ומשתמשים במסמכים שמדור רישום קיבל במהלך ההרשמה ניתן לסמוך עליהם כנאמן למקור משום שהמסמכים עוברים בדיקה.</p><div class="li l0"><span class="mk">•</span><div class="tx">נרכז את כל המסמכים הנדרשים ונעביר להחלטת ראש החוג. במידה וראש החוג אישור פטור/הכרה, נזין זאת באופן הבא:</div></div><div class="li l0"><span class="mk">•</span><div class="tx">קליק כפול על השנה בה אנו רוצים להזין את הפטור  לימודים קודמים</div></div><div class="li l0 n"><span class="mk">א.</span><div class="tx">עבור קורס שלא נלמד במכללה האקדמית (מכינות, מוסד אקדמי אחר)- נלחץ  <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAoCAIAAAADnC86AAAEI0lEQVR42u1XX0hbZxQ/994Yo7eLTlt0kj+LMHywLdkedKipWzcfZnEPQaE6BqNFBYeS9aF7mC+CZVZYKYOxuY4+7J+yDlwpY1vTMjSNILKHzT9VOs1NtE7QpEkWY25zv3P2EEytpsbLMmRzl/vwfec75/zu+Z >•</span><div class="tx">לאחר ביצוע הכרות ופטורים יש לבצע בדיקה שאכן ההכרות מופיעות בגיליון  הציונים ובמאזן באופן תקין.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">בסיום התהליך יש לשלוח תכתובת לסטודנט (72) ולתייק בתיק אישי+ אלקטרוני.</div></div><p>ישנם סטודנטים הבוחרים להשתתף בנבחרות ספורט/ פעילות חברתית במסגרת מכללתית. סטודנטים אלה, במידה ומשלימים את פעילותם לאורך השנה או הסמסטר זכאים להכרה ב-2 נ"ז במקום קורס בחירה (<a href="http://intranet.telhai.ac.il/Departments/minhal/hugim/Lists/work/AllItems.aspx" target="_blank" rel="noopener">ראי/ה הנחיית עבודה מס' 8</a>). </p><p>החל משנה"ל תשע"ט סטודנט שקיבל הכרה בפעילות ספורט/פעילות חברתית/מילואים יידרש לשלם על הנ"ז בגין הכרה זו.</p></template><template id="t2"><p><span style="color:#385623">משימה באחריות רכזת בכירה</span></p><p>בכל שנה יישלח לכל רכזת וראש חוג לו"ז תכנון תקנים שעל פיו יהיה עליהם לפעול. במהלך החודשים נובמבר-דצמבר ראש החוג ורכזת החוג יבנו תכנון לשנה העוקבת על פי הלו"ז שנקבע ע"י משאבי אנוש, תוך כדי דיונים עם מועצת החוג. התכנון כולל צפי מספרי סטודנטים, שינויים בתכניות הלימודים, שינויים בהיקף משרות מרצים, קידומים צפויים למרצים, מספרי קורסי בחירה וסמינרים, מספרי סטודנטים בקורסי חובה וכו'. </p><p>בתחילת חודש ינואר מועתקים כל השיעורים לשנה העוקבת למכלול (על סמך הנתונים מהשנה הנוכחית). רכזת החוג תעדכן את הנתונים בשנה הרלוונטית במכלול על פי ההחלטות שהתקבלו יחד עם ראש החוג. לאחר מכן, רכזת החוג תייצא את הנתונים העדכניים לקובץ אקסל שנקרא "קובץ השוואת תקנים". הנתונים בקובץ הנ"ל יוצגו בישיבות התקנים שיתקיימו לקראת סוף פברואר בנוכחות הנהלת המכללה, ראש חוג, רכזת חוג ורמ"ד סגל אקדמי. לאחר דיונים אלו ההנהלה תגיע להחלטה אם לאשר/לא לאשר את התוכניות (בד"כ עד סוף מרץ). בנוסף, יהיה על ראש החוג להעביר הודעה כתובה לאגף משאבי אנוש לרמ"ד סגל אקדמי על חברי סגל שיש כוונה לשנות/לצמצם/להפסיק העסקתם לקראת השנה הבאה.</p><p><strong>תהליך העבודה המלא מופיע בטיפ תחת תיקיית הנחיית עבודה מס' 26- קובץ הסבר תהליך בניית תקציב ההוראה.</strong></p></template><template id="t3"><p>בחוגים מסוימים וביחידה לאנגלית קיימים קורסי קיץ אשר נועדו לסטודנטים הבאים: </p><div class="li l0"><span class="mk">•</span><div class="tx">סטודנטים אשר נכשלו במהלך שנת הלימודים.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">סטודנטים אשר נמצאים על תנאי לפני העלאת שנה. </div></div><div class="li l0"><span class="mk">•</span><div class="tx">סטודנטים במסלול אנשים עובדים (חלק מתוכנית הלימודים שלהם). </div></div><p><u>תהליך עבודה</u>:</p><p>כל רכזת מהחוג הרלוונטי, תבנה מערכת שעות לקיץ, תדאג לפתוח את הקורסים במכלול ולוודא שמאפייני הקורס מעודכנים. </p><div class="li l0"><span class="mk">•</span><div class="tx">כל חוג על פי נהליו וצרכיו. </div></div></template><template id="t4"><p><u>תהליך </u><u>עבודה:</u></p><div class="li l0 n"><span class="mk">1.</span><div class="tx">העברת רשימת קורסים עם מועד פתיחה וסיום הסקר לאורך השנה (לפי פורמט בקובץ אקסל</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">קבלת מס' שאלון מזהבה</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx">הקניית השאלון בקורסים הרלוונטיים במכלול: לשונית שונות&gt; שאלון משוב:</div></div><p><figure><img class="shot" loading="lazy" src="images/img011.webp" alt="צילום מסך" width="794" height="513"></figure></p><div class="li l0 n"><span class="mk">4.</span><div class="tx">יש לכתוב את מס' השאלון המעודכן לאותה השנה ולאותו סמסטר (נקבל בכל פעם מס' מזהבה/רכזות הפקולטה). נכתוב את תאריך חשיפת השאלון –כשבועיים לפני סוף הקורס, אם מדובר בקורס של מס' ימים- ביום או יומיים אחרונים בהתאמה לאורך הקורס. תאריך סיום חשיפה לשאלון- יום לפני בחינה.</div></div><p><figure><img class="shot" loading="lazy" src="images/img012.webp" alt="צילום מסך" width="519" height="241"></figure></p><div class="li l0 n"><span class="mk">5.</span><div class="tx">יש לוודא שהסטודנט רואה את הסקר בפורטל לאחר הקניית השאלון לפי התאריכים הרלוונטיים: להיכנס לפורטל של אחד הסטודנטים בקורס&gt;&gt;השיעורים שלי&gt;&gt;ולוודא שמופיע האייקון הבא:</div></div><p><figure><img class="shot" loading="lazy" src="images/img013.webp" alt="צילום מסך" width="900" height="56"></figure></p><div class="li l0 n"><span class="mk">6.</span><div class="tx">נכנס להודעות מתוך הקורס ונשלח <strong>הודעה עתידית</strong> לסטודנטים בהתאם למועד הסקר לפי הניסוח הבא: </div></div><p><strong><u>ניס</u></strong><strong><u>וח מייל לפתיחת סקר איכות ההוראה- </u></strong><strong><u><mark>יש להוסיף את שם הקורס:</mark></u></strong></p><p><span style="color:#1F497D">סקר</span> <span style="color:#1F497D">איכות</span> <span style="color:#1F497D">הוראה</span> <span style="color:#1F497D">בקורס</span> </p><p><span style="color:#1F497D">סטודנט</span><span style="color:#1F497D">/</span><span style="color:#1F497D">ית</span><span style="color:#1F497D"> יקר</span><span style="color:#1F497D">/ה</span><span style="color:#1F497D">,</span></p><p><span style="color:#1F497D">לקראת סיום לימודיך בקורס</span><span style="color:#1F497D"> נשמח לשיתוף פעולה במילוי סקר איכות ההוראה בעבור קורס זה.</span></p><p><span style="color:#1F497D">אנו </span><span style="color:#1F497D">מתייחסים ברצינות רבה </span><span style="color:#1F497D">למשובים</span><span style="color:#1F497D"> שלכם</span><span style="color:#1F497D">/ן</span><span style="color:#1F497D"> ו</span><span style="color:#1F497D">לוקחים לתשומת ליבנו הערות הדורשות התייחסות</span><span style="color:#1F497D">,</span> <span style="color:#1F497D">כמו כן </span><span style="color:#1F497D">מאפשרים למרצים לקבל תמיכה וסיוע מהיחידה למצוינות בהוראה</span> <span style="color:#1F497D">אשר פועלת במכללה</span><span style="color:#1F497D">.</span></p><p><span style="color:#1F497D">הסקר פתוח</span><span style="color:#1F497D"> למענה עד יום לפני מועד א' של המבחן באפליקציה</span> <span style="color:#1F497D">ו</span><span style="color:#1F497D">בפורטל</span><span style="color:#1F497D"> (תחת לשונית "השיעורים שלי" ).</span></p><p><span style="color:#1F497D">תודה על שיתוף הפעולה,</span></p><p><span style="color:#1F497D">מנהל הלימודים</span></p><p><strong><mark>יש לשלוח גם אל המרצים הודעה שידע</mark></strong><strong><mark>ו שהסקר נפת</mark></strong><strong><mark>ח ו</mark></strong><strong><mark>שיעודדו את הסטודנטים לענות עליו</mark></strong></p><p><strong>ניסוח </strong><strong>לשליחה ל</strong><strong>מרצה ספציפי או לכל המרצים יחד (לערוך בהתאם):</strong></p><p><span style="color:#1F4E79">שלום לכולם,</span></p><p><span style="color:#1F4E79">סקרי איכות ההוראה של </span><span style="color:#1F4E79">הקורסים המרוכזים</span><span style="color:#1F4E79"> נפתחים בהתאם למועדי הקורס- כל אחד בזמן שלו.</span></p><p><span style="color:#1F4E79">הסקרים פתוחים למענה של הסטודנטים דרך הפורטל והאפליקציה, עד ליום לפני המבחן.</span></p><p><span style="color:#1F4E79">מומלץ מאוד לבצע הפסקת לימודים במפגש האחרון לכמה דקות ולאפשר לסטודנטים למלא את הסקר באמצעות האפליקציה.</span></p><p><span style="color:#1F4E79">להלן רשימת התאריכים בהם הסקר פתוח לכל קורס:</span></p></template><template id="t5"><p><span style="color:#385623">משימה באחריות רכזת בכירה</span></p><p>לקראת המועד ישלח מסמך מטעם ההנהלה בנוגע להיערכות לפתיחת שנה"ל הבאה בהיבט של תכנון תקנים ואישור תכניות לימוד. </p><p>לוח הזמנים לטיפול בסיום העסקה צריך להיות בין ראשון לפברואר ועד ל 30 למאי, על פי הלו"ז שישלח ממשאבי אנוש.</p></template><template id="t6"><p><span style="color:#385623">משימה באחריות רכזת בכירה</span></p><p>הגשת התוכניות תעשה עד התאריך אשר נקבע ע"י משאבי אנוש, יקבעו מועדי דיונים לכל חוג.</p></template><template id="t7"><p><span style="color:#385623">משימה באחריות רכזת בכירה</span></p><p>מטעמים משפטיים על כל שינוי בתקן איש סגל או פיטורי ממ"ח יש להודיע למשאבי אנוש.</p></template><template id="t8"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">ראה הנחיית עבודה מס' 25- רישום סטודנטים במכלול במעבר בין תכניות</a> </p><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 39- טיפול בסטודנטים במעבר בין חוגים</a></p><p>במהלך חודש פברואר לפני פתיחת סמסטר ב'  ועד סוף ימי השינויים, יש לטפל בכל המעברים של סטודנטים בין החוגים. מעבר בין חוגים הינו באחריות מדור רישום ומעבר בין תכניות (בתוך החוג) הינו בטיפול רכזת חוג. </p><p>על הסטודנט להגיש בקשה למעבר בין חוגים באמצעות<a href="https://www.telhai.ac.il/sites/default/files/%D7%94%D7%A0%D7%97%D7%99%D7%95%D7%AA%20%D7%9C%D7%94%D7%92%D7%A9%D7%AA%20%D7%91%D7%A7%D7%A9%D7%94%20%D7%9C%D7%9E%D7%A2%D7%91%D7%A8%20%D7%97%D7%95%D7%92%20-%20%D7%9C%D7%90%D7%97%D7%A8%20%D7%A1%D7%92%D7%99%D7%A8%D7%AA%20%D7%9E%D7%A2%D7%91%D7%A8%20%D7%9C%D7%A2%D7%95%D7%A1_0.pdf" target="_blank" rel="noopener"> טופס בקשה למעבר בין חוגים</a>. ניתן להגיע אליו דרך אתר המכללה  רישום  בקשת מעבר בין חוגים.</p><p>בקשה למעבר בין תכניות בתוך החוג יש להגיש באמצעות פניה למזכירות החוג דרך פורטל הסטודנט. </p><p>ניתן להגיש את הבקשה עד תום תקופת השינויים.</p><div class="li l0"><span class="mk">•</span><div class="tx">ניתן להגיש בקשת מעבר בין חוגים פעמיים בלבד, גם בקשות שנדחו נספרות.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">דגשים שעל הרכזת להעביר לסטודנט:</div></div><div class="li l0"><span class="mk">•</span><div class="tx">תיתכן התנגשות בין קורסים עקב המעבר</div></div><div class="li l0"><span class="mk">•</span><div class="tx">ייתכן ויהיו קורסים שלא יוכרו בחוג אליו הסטודנט מבקש לעבור</div></div><div class="li l0"><span class="mk">•</span><div class="tx">תיתכן פריסת לימודים עקב המעבר, משמע הלימודים יתארכו מעבר לשלוש שנים</div></div><p>חריגים בלבד יטופלו לאחר תקופת השינויים, באישור ס. ראש מנהל לימודים.</p><div class="li l0"><span class="mk">•</span><div class="tx">סטודנט המבקש לעבור בין חוגים יתכן כי יפנה לאחד מהגורמים הבאים:</div></div><div class="li l0 n"><span class="mk">1.</span><div class="tx"><strong>רכזת החוג אליו רשום</strong> – במקרה זה תפנה הרכזת את הסטודנט לחוג אליו רוצה להתקבל לקבלת ייעוץ לגבי התכנית והכרות בהתאם, בסיום תפנה אותו האחרונה למרכז יעוץ והכוונה לקבלת תנאי הקבלה ומילוי טופס מעבר.</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx"><strong>רכזת החוג אליו רוצה להתקבל</strong> – הרכזת תיתן ייעוץ לגבי התכנית והכרות בהתאם , בסיום תפנה אותו למרכז יעוץ והכוונה לקבלת תנאי הקבלה והסבר על מילוי טופס מעבר.</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx"><strong>מרכז יעוץ והכוונה</strong>- נציג המרכז יעביר מידע לסטודנט באשר לתנאי הקבלה והסבר על מילוי טופס מעבר, יברר אם היה אצל רכזת התכנית אליה רוצה להירשם במידה ולא יפנה אותו לקבלת ייעוץ לגבי התכנית והכרות בהתאם. </div></div><p><strong><u>לאחר מילוי טופס המעבר:</u></strong></p><div class="li l0 n"><span class="mk">1.</span><div class="tx"><strong>מדור רישום</strong> יטפל בבקשה עד לקבלת החלטה על קבלה/דחיה.</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx"><strong>מדור קשרי נרשמים</strong> יצור במקרים הבאים:</div></div><div class="li l0 n"><span class="mk">1.</span><div class="tx">קשר רציף עם הסטודנט בדומה לטיפול במועמד חדש ללימודים ובהתאם לצורך: חוסר בטפסים, מענה לשאלות וכל בירור/טיפול הנדרש בתהליך.</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">קשר עם הסטודנט ויודיע על קבלה במקרה והתקבל לתכנית החדשה</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx">במקרה של דחיה יעדכן המדור את הרכזת של החוג בו הסטודנט למד לפני בקשת המעבר להציע לו להישאר בתכנית הקיימת או לחילופין להגיע למדור הכוונה לייעוץ לעבור לחוג אחר.</div></div><p><strong>רכזות החוגים:</strong> הפקת דוח 510 לטיפול בסטודנטים במעברים בין תכניות.</p><p><figure><img class="shot" loading="lazy" src="images/img014.webp" alt="צילום מסך" width="459" height="330"></figure></p><p>שנת לימודים למעלה- מתייחסת לשנת לימודים בחוג החדש אליו עברו</p><p>חוגים תכנית אחר- מתייחס לתכנית הקודמת-במידה ורוצים לחפש מישהו שעבר מתכנית ספציפית-. אם אין צורך במידע הזה יש להשאיר ריק ולהוריד V.</p><p>חוגים 1+2- החוג החדש אליו עברו</p><p>שנת לימודים למטה- השנה מתייחסת לחוג השני- ממנו עברו</p><p>נרשם לסמסטר- במעברים בין שנים- לסמן סמסטר א' </p><p>בין סמסטרים- לסמן את אותה השנה ברובריקת "שנת לימודים", ונרשם לסמסטר ב'.</p></template><template id="t9"><p><a href="http://intranet.telhai.ac.il/Departments/minhal/hugim/Lists/work/AllItems.aspx" target="_blank" rel="noopener">ראה הנחית עבודה מס' 30- בקרה ואכיפה בעבור תנאים למתקבלים במדור רישום וקבלה</a></p><p><a href="http://intranet.telhai.ac.il/Departments/minhal/hugim/Lists/work/AllItems.aspx" target="_blank" rel="noopener">ראה הנחית עבודה מס' 15- מעקב אחר סטודנטים המתקבלים עם דרישה נוספת</a></p><p><a href="http://intranet.telhai.ac.il/Departments/minhal/hugim/Lists/work/AllItems.aspx" target="_blank" rel="noopener">ראה הנחיית עבודה מס' 27- ועדת מעקב לרמות אנגלית</a></p><p><a href="http://intranet.telhai.ac.il/Departments/minhal/hugim/Lists/work/AllItems.aspx" target="_blank" rel="noopener">ראה הנחיית עבודה מס' 34- טיפול בסטודנטים שסיימו 5 שנות לימוד ולא סיימו חובותיהם לתואר</a></p><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib27/Forms/AllItems.aspx" target="_blank" rel="noopener">ראה הנחיית עבודה מס' 38- הפסקת לימודים על רקע אי התאמה לתכנית</a></p><p>טופס פרוטוקול לוועדת מעקב חוגית לסטודנט</p><p>ועדות מעקב נועדו בכדי לאתר סטודנטים שאינם עומדים בדרישות החוג או המכללה / התקבלו ללימודים על תנאי:</p><div class="li l0"><span class="mk">•</span><div class="tx">ממוצע שנתי נמוך מהנדרש בחוג לשם מעבר לשנה הבאה</div></div><div class="li l0"><span class="mk">•</span><div class="tx">ציונים נכשלים בקורסי חובה</div></div><div class="li l0"><span class="mk">•</span><div class="tx">מעבר קורס 'הבעה ורטוריקה' למי שאיננו ברמת פטור בעברית</div></div><div class="li l0"><span class="mk">•</span><div class="tx">בחוגים בהם מתקיימת התנסות מעשית/לימודים קליניים וכו' תיבחן התאמת הסטודנט לתכנית במידה ויופסקו לימודים בשל אי התאמה לתכנית, יש להשתמש בסיבת נשירה- 1843- לימודיו הופסקו אי התאמה לתכנית.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">לבדוק רשימת תלמידים של שנתיים קודמות- אם נמצאים בסטטוס 511- "השעית לימודים לבקשת הסטודנט" ולא חזרו ללימודים, יש ליצור קשר עם הסטודנט, ואם לא מעוניין לחזור לבצע פרישה.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">מעקב על סטודנטים בסטאטוס 'על תנאי' ובדיקת עמידתם בתנאי שהוצב להם </div></div><div class="li l0"><span class="mk">•</span><div class="tx">עמידה בתנאי קבלה למכללה (עבור סטודנטים בשנה א) - הפקת דו"ח 536 , במידה והסטודנט עמד בתנאי יש לסגור את המשימה ולהפיק עבורו נוסח 57. תנאי הקבלה ללימודים ימצאו תחת 'משימות' (בכרטיס התלמיד).</div></div><div class="li l0"><span class="mk">•</span><div class="tx">עמידה בתנאי אנגלית- לאחר קבלת הנחיה מהיחידה לאנגלית, באחריות רכזת החוג לפעול ע"פ הנחיית עבודה מס' 27. תנאי הקבלה ללימודים ימצאו תחת 'משימות' (בכרטיס התלמיד). </div></div><div class="li l0"><span class="mk">•</span><div class="tx">בדיקת חובת למידת קורסי תוכן בשפה האנגלית- ראו הסבר מפורט בפרק חובת למידת קורסי תוכן באנגלית.</div></div><p>במידה והסטודנט עמד בתנאי יש לסגור את המשימה ולהפיק עבורו נוסח 57.</p><p><figure><img class="shot" loading="lazy" src="images/img015.webp" alt="צילום מסך" width="591" height="27"></figure></p><p>לחיצה על- <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAbCAIAAACSpRrNAAADjUlEQVR42tVVXUwURxyfmZ3Z3dndW5ZbPq69Q+jBoUBraL3alxYSqdHolVMkJfEjmmh8sF/E1vpA2qTvfaCpCWlM+2ZC0hdSYx/aRDGSaPyotVYbcsUjvbScAUTukNtll50+bHPs3YHSEJr0l//D/mdnfr//zG9n//D67VEAwFs729LpNFgHILDO+P8L4PxTIBBYDwHomvxfHFFyLMETvJZIjiW81C4hzift7a9jzP2r6h6k733Y//7MlnEnsLD56rYvegeGr9x4oT7iJfxHYOOmJoy5TDa7evZ3vzqYqvwt0zntMEedLp94kDZNc+OmpgXL9hIumcwYYGxV1P5ysfFQTfA92bRz2OG4Wyq+VnW4+5iu648y6SJC7FnI2CoUQgG9pkdvOFlhLVoCIvZdqt6sOX2sLxaLzc4ZhXMZY6xoB88WePFoeMvpepMZAAAwTtAl5eThjzs7O5OpdJmqrvWinbs00Lg3KGIqQBFDMjH45J09H8Tj8WRqmf+YWzEqGVoxAtXq2ZEvqxp0gniMSOLMw31N+7u6uv74a2ol/wo8YOwZHvR8ujd+YgfADgBgPpOrntvQva97ejbnZSh2wLsDxphTiD8fj9Y8p+fTX9M/6z5dRCKB5O43yd2t8Wg06p1fWl+BgG07hmHno+2j5mzwYcUeiVlPDMO++MvQgSNvK5wqIIoAIZNSx5vbRscmvEts2/GyLy46lrW4JADhUrSdahw8861Oqi6c+z7a2yxwZt/Xp+oidRSLGOJsItda+erLra94l7jhheMw23a8JkMXsU+2Dp09H9JqNaJrvH948HK0tzkSiWhEF6AscPTGxdtbX3otNf  המעקב).</div></div><div class="li l0"><span class="mk">•</span><div class="tx">במידה ויש לנו סטודנט בחוג שהתקבל בסטטוס 'מעמד מיוחד'- נפעל על פי <a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 13- מעבר סטודנטים ממעמד מיוחד למן המניין.</a> במידה ועמד בתנאי נעלה אותו שנה ונשנה סטטוס ל"תלמיד מן המניין" במידה והסטודנט לא עמד בתנאי עלינו לבצע הפסקת לימודים. במידה ונרצה להמשיך את לימודיו למרות שלא עמד בתנאי, עלינו להגיש בקשה למדור רישום. <strong>הסמכות להמשיך לימודים לסטודנט במעמד מיוחד שלא עמד בתנאים שהחוג הציב במעמד הקבלה היא של מדור רישום מול </strong><strong>מנל"א</strong><strong> ולא של ועדת המעקב.</strong></div></div><div class="li l0"><span class="mk">•</span><div class="tx">סטודנט המתקבל על תנאי כלשהו ובנוסף תנאי השתייכות למרכז תמיכה. ברגע שהתנאי התקיים ונשאר רק התנאי של מרכז התמיכה, על הרכזת להעביר אותו לסטטוס 502 "תלמיד/ה מן המניין דרישה נוספת". סטטוס זה נשאר לכל אורך הלימודים וזאת בהתאם לדרישה להשתייך למרכז התמיכה לאורך כל שנות הלימודים בחוג. יש להוציא נוסח 57 עדכון סטטוס ולשנות ידנית בנוסח שהסטטוס עודכן ל"מן המניין עם דרישה נוספת". עדכון הסטטוס מתבצע במנוי הנוכחי במכלול.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">במידה ונכשל בקורס חובה (ונבחן בשני מועדים), נשבץ לקורס חובה לשנה/סמסטר הבא. סטודנט שלא עומד בדרישות החוג- נעלה לוועדת מעקב בראשות ראש החוג על גבי <a href="https://telhaimng.sharepoint.com/sites/tip/DocLib27/Forms/AllItems.aspx" target="_blank" rel="noopener">פרוטוקול ועדת מעקב לסטודנט</a>.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">סטודנט שסיים שנה א' ולא עמד ברוב הקורסים וועדת המעקב החליטה להמשיך את לימודיו, השנה הפדגוגית תהיה שוב שנה א' בסטטוס "תלמיד מן המניין- בהשעיה פדגוגית".</div></div><div class="li l0"><span class="mk">•</span><div class="tx">ישנם קורסי חובה שניתן ללמוד אותם עד פעמיים (לאחר כישלון להשתבץ פעם נוספת בלבד. נתון להחלטת ראש החוג). במידה והסטודנט נכשל בקורס הנ"ל בפעם השנייה יש לקבל אישור מראש החוג ללמוד את הקורס בפעם השלישית (<a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">ראה הנחיית עבודה מס' 29- רישום לקורס לאחר שני כישלונות)</a>. </div></div><p>במידה וסטודנט קיבל אישור למועד חריג  והוא משובץ לקורס בשנית  ועבר את הקורס ניתן להסירו גם לאחר תום תקופת השינויים ולעדכן במייל את שכ"ל בכדי שיזכו את הסטודנט על הקורס.</p><div class="li l0"><span class="mk">•</span><div class="tx">בוועדת מעקב תתקבל החלטה באשר לסטאטוס הסטודנט: מן המניין, על תנאי חוגי, בהשעיה פדגוגית או הפסקת לימודים.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">יש לשלוח לסטודנט מכתב המפרט את מצבו האקדמי והחלטת ועדת המעקב. יש לתייק בתיק האלקטרוני ולבצע שינויים בכרטיס התלמיד בהתאם להחלטה שהתקבלה.</div></div></template><template id="t10"><p>ראה/י ערך "ימי שינויים" בחודש אוקטובר.</p></template><template id="t11"><p>עם סיום תקופת השינויים בסמסטר ב' נפיק דוחות בקרה על פי <a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 10</a>. את הדוחות יש לשמור בתיקייה ייעודית ב-W. יש לבצע בדיקה על הרשומות בדוחות, להוסיף הערות ולפעול בהתאם לצורך תיקון הרשומות.</p><p>לאחר סיום טיפול בדוחות יש לעדכן את ס.ראש מנהל לימודים. הרצת שכר הלימוד תתבצע לאחר סיום טיפול בדוחות הבקרה.</p></template><template id="t12"><p>ניתן לאפשר לסטודנטים להירשם לקורסים מתקדמים למרות שאין להם ציון בקורסי דרישות הקדם.</p><p>בתקופת השינויים נבצע בקרה שסטודנטים שנרשמו כשלא היה להם ציון עובר בדרישת הקדם עמדו בתנאי.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">לפני התחלת התהליך, מומלץ להפעיל את דוח 549 בכדי לבדוק דרישות קדם לשיעורים.</div></div><p>יש לוודא שבכל דרישת קדם בשיעורי האב מוזן ציון המינימום למעבר הקורס בהצלחה.</p><p><figure><img class="shot" loading="lazy" src="images/img018.webp" alt="צילום מסך" width="831" height="311"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">יש לעדכן את דרישות הקדם בשוטף בהתאם לשינויים בתכנית הלימודים.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">במידה ומבצעים שינויים הם יתעדכנו לאחר ריצת לילה.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">הדו"ח רלוונטי רק לסטודנטים שהסטטוס שלהם בשיעור הוא- 50 על תנאי</div></div><p>ת"ל מוסדית  דוחות  תלמידים בשיעור  תלמידים על תנאי</p><p><figure><img class="shot" loading="lazy" src="images/img019.webp" alt="צילום מסך" width="882" height="605"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx"><img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKkAAAATCAIAAABk5rprAAAEF0lEQVR42u1Zz2saeRR/328Sf+Weha3jNEmtFNaUuQhiEQNtlrCnKkuGXjxIelgKihBKRFxaxFAKQaHksNk9zEUMpQkIpegWNkjExcuA3ctUszLVP2QPM6Pzwxkniewhzoe5zJv3fd/33uf73nfmO6jNcmBhLoGtFFjcW7C4tzA3WLRScDtQ//jejNrWTz/fEu5bed/5JrcfsqgHAEilUsYKxWLRqvtbi+qff2OMMUYYI4wxRki6xeHAD2b2e74S9wUo6YozQ0mYKPMAAAMmIQrF4jtoKoSiBACauUC+MSzTY2v5hnY+hYJ0HTT5SlyavZkLxJnWWC3XksaevRgPEd2DxoHKmnpSZYAmwmzlZXYmyw1squcVkiOOVUakkwqdnGtf3zBe83x3171C3lkh76zcu/v9Ay/x8MEaxtjkux5JM1ybFa+StxDNNwBIOp+B2vkQAIjVe53Lge7ia5x/2ImEAABaf5083Qy7n1Uka/V0d1diaAyZAteuZvyx4zbL7YdImqmn4dPFACD0uuQtJN/eLwkuxU5+L/MAEMyO/Wyz9Se1l5UBAIT3qxn/RuZ0FAKoJiXpvEKhzXKnP35ShylDMCs4f1QZ6MkNbCoTW830fmOGKuffQZLKtXRTMTXnI+4RACCEMMZ225LdvuSw2ex2G0boOu/5wXjG3+0rcxGOxE7OxXXH811q1SMv4qOz2OOguAgUjwBI+vnOl3/5a3QzYo16+u51UHJJSw8ASXp1Q5ikr1p/b7TUauyz/W/m5WZsSggl0htfeSNNo5zLudcSb7fbzNf9dAQ3d3q8QCHf79wnCQAA6BSilC9a2z7NhgEAmp/PYr/QhHKkZ91/nQn5ixpMjFbZbyRPrgPdpXMDmLepu4Cm5FzT87XE2xYXFxYWZvd971kXKmlYPurtJYRyBKHjMXG3sOm++JqOh2+YO5qp0IRRtLKtdBekxmCijWhbKM93NTrqYdSqx1A+1aa+/3qlPCXnKjoRmki8y2mbHfdE5AlcXpTpaG371TNS/XTAJKjd3t4bmphR/Qz6vY11fWONA2qr//xKH3vhSOwkKduMh+WXh15VlwpHvIVfRy8KzVyyu/2IMJRPt6m , קרי להסיר את הקורסים המתקדמים.</p><p>במידה ומפעילים את הדו"ח לפני שהתקבלו ציוני סמסטר א', ניתן לסנן קורסים שמתקיימים בסמסטר ב'.</p></template><template id="t13"><p>מתקיים הן בסמסטר א' והן בסמסטר ב'. יש להתעדכן במועד שנקבע ויפורסם ע"י ס. ראש מנהל לימודים. ביום ההיכרות תתקיים הרצאה חוגית. יש לוודא שהכיתה ששוריינה לטובת ההרצאה מתאימה. יש להכין מצגת חוגית שתוצג בהרצאת ההיכרות החוגית, לוודא שהינה מעודכנת לפי השנה הנוכחית מבחינת תכניות לימוד, מסלולים, בעלי תפקידים וכו'.</p></template><template id="t14"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מספר 26- טיפול בקורסים בעלי מיעוט משתתפים</a></p><p>באחריות רכזת החוג להפיק דוח דלי משתתפים (דוח 513) ולאתר את הקורסים בעלי מיעוטי המשתתפים. את הדוח יש להפיק במספר מועדים, כמפורט בהנחית העבודה.</p><p>על כל קורס יש לציין הערות- מדוע הינו דל משתתפים, כאשר כמות המינימום לכל קורס נקבעת באופן הבא:</p><p><figure><img class="shot" loading="lazy" src="images/img025.webp" alt="צילום מסך" width="636" height="204"></figure></p><p>הערות הרכזת עוברות לדיון וקבלת החלטות בהנהלה בנוגע לקורס.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">נפיק את הדוח באופן הבא:</div></div><p><figure><img class="shot" loading="lazy" src="images/img026.webp" alt="צילום מסך" width="900" height="758"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">נגדיר ערכים לדוח</div></div><p><figure><img class="shot" loading="lazy" src="images/img027.webp" alt="צילום מסך" width="357" height="251"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">על כל קורס שאיננו עומד בקריטריון של מינימום סטודנטים על פי ההנחיה, נוסיף הערה והסבר במשבצת 'הערות' בקורס עצמו: </div></div><p><figure><img class="shot" loading="lazy" src="images/img028.webp" alt="צילום מסך" width="813" height="521"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">בתוך חלונית הערות נלחץ <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAoCAIAAAAQS2/OAAADZUlEQVR42u2WX0hTURzHz7n3bk6vTXOKJuuOGW2C/dEehCgVQckmQgxENMQezVAkepMeLATzwbfK10EPSS+FKJGBsKUgFv2Zms6tuZUW7A+7a7vzunPP6WFUK//NK6OH/HEfzjn3nvO53+/vdw4HipsSSGcwEibpBSAJp1mBlHYFJN0K8L9Pcov5UiwWS7RpmgYAEEIwxq2trd3d3X4e7QYIhjb2BPT29paXl6vVakn6XdMURZnNZoRQT0+P60tsp7nQ7gjsCchWhIuKilQqVfIgQoimab/f39/fv7i4ODk5+fETv42CVHwkZBsbIYTr6+sqlaqrq2t+fn5jY3snGBl5s1qtQ0NDGGNRFJuamsxmM8dxkUgEAMXWj6kUFSSLiEQi0SNCZ38nd57jeZ5hGIRQPB7fdm5KAEmSkgEIIZqhjusKstjMlZUVm83m8/kghPItwhgnnBEEgaKopaUlhOJhMRARw+FweGFhAUKIMTaeqZUJQAgRQgYHB3mWZ5QMwTj/ZE4M8OwxxSc2aHPZAAQzMzNjY43Oz4LMKkrEhauVp4x6QIhSBTdgqKa+4txFYxxvRlF4/OYbr9cLYL4cQMJfURRfPJuaVr+iIa3WKk7VFrrfh77ZIwhjiUggppibmztbeVl+mZpMpuXlZf4rH41GA2v+jKo8/mOQ+cDmZmcLgpCjzZGfZJqmKYpqa2ubnZ11u92rq6shXyhXmZ/BrKk1bElJSSAQ0Gq1WVlZ8gEIoczMTJ1Ox7KsKIpUAB5VFSjpDAihRqMpLi4uLCzU6/UyAS6Xa3p6OnmjEQ94eO0xISQvL8/n8+l0upqaGv93pczDLv/IZvJRIwiC0+m02+3BYJBlWaPRWFZWVlpaurVGUwUcJCiQ5jgE7BPgGWlvGfFuaXstDe0Wt9fScNqg+etpt7iBZ6T9j8GbtpT2gcfxzmDiEk3n3Ml6PVf93N7x6/XLO4aJWsdwFQDAA0DFwPhoJ/fzbxpbRn51d7TINmlprq9LrDU12lFbnaonXMet5rdPrZ5dc+C1NHQ5Bq4lFrVOPGkxVe3D9hMlFbtY9Lav0dAHQMcDR0Kj+9F9S/ONYfk3u78HktwEAHgt1+8ZRu3V6SlT221N48SV8bt1B7qb7mARAACU972239UfcB8cHnb/AeAH5AWfynOmMoAAAAAASUVORK5CYII=" alt="" style="height:29px"></div></div><p><figure><img class="shot" loading="lazy" src="images/img030.webp" alt="צילום מסך" width="781" height="317"></figure></p></template><template id="t15"><p>ניתן ל הסתייע בדוחות הבאים לטיפול בדלי משתתפים.</p><p>לדוגמא: אם יש 10 סטודנטים משנה א' שלא השתבצו ויש קורסים משנה א' שהם דלי משתתפים תוכלו לכתוב שצפויים להירשם עוד 10.... וכ'ו.</p><div class="li l0"><span class="mk">•</span><div class="tx">557 – סטודנטים שלא השתבצו לקורסים- בדו"ח קיימת עמודה "האם שילם מקדמה או לא" <strong><u>ספרה = 1 – שילם</u></strong> , <strong><u>ערך ריק = לא שילם</u></strong></div></div><div class="li l0"><span class="mk">•</span><div class="tx">558 – סטודנטים שהשתבצו לקורסים</div></div><div class="li l0"><span class="mk">•</span><div class="tx">559 – סטודנטים שאין להם מערכת כלל</div></div><p>       סיכום הסטודנטים בשלוש הדוחות צריך לתת את מספר הסטודנטים בחוג</p><p>       את הדוח יש להפיק החל מתאריך 01.06 בכל שנה עד ליום הפקת הדוח</p></template><template id="t16"><p>מתקיים כפעמיים-שלוש במהלך השנה (המועדים מפורסמים בלוח השנה האקדמי). לאחר קבלת הנחיות ועדכונים ממחלקת שיווק, רכזת החוג תעדכן את אנשי הסגל הרלוונטיים בנוגע למועד היום הפתוח ותוודא כי אכן יכולים להגיע ולהיות נוכחים (ראש חוג, ראשי תכניות/מקבצים/מוקדים). יש להכין תיקים לאנשי הסגל עם מסמכים חשובים (תנאי קבלה לחוג, תכניות לימוד וכו'), תגי שם. במידה ומתקיימת הרצאה חוגית, בדומה ליום היכרות, יש לוודא את עדכניות המצגת וכן לוודא שהכיתה שנקבעה לטובת הרצאה חוגית אכן מתאימה.</p><p>ביום הפתוח רכזת החוג תהיה נוכחת בעמדות הייעוץ ותסייע במידת הצורך לאנשי הסגל בנושאים מנהליים.</p></template><template id="t17"><p>בכל שנה לקראת טקס הבוגרים, יקבע מועד אחרון לסטודנטים להפעלת טופס טיולים. החל מחודש מרץ נפעל על מנת לאתר את כלל הסטודנטים בחוג שצברו את מכסת הנ"ז הנדרשת, ובאפשרותם להפעיל טופס טיולים. סטודנט שלא יפעיל טופס טיולים עד למועד שיקבע ויפורסם בכל שנה, לא יקבל את התואר בטקס הבוגרים של אותה השנה.</p><p><u>תהליך עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">נפיק דוח 505- 'סטודנטים שלא סגרו תואר' באופן הבא:</div></div><p><figure><img class="shot" loading="lazy" src="images/img031.webp" alt="צילום מסך" width="531" height="458"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">נעדכן ערכים לדוח ונלחץ 'אישור'.</div></div><p><figure><img class="shot" loading="lazy" src="images/img032.webp" alt="צילום מסך" width="474" height="330"></figure></p><div class="li l0"><span class="mk">•</span><div class="tx">נפנה אל הסטודנטים שעלו בדוח וניידע אותם שעל מנת לסגור את התואר, עליהם להפעיל טופס טיולים. ניתן לצרף להודעתנו את ההנחיות לסטודנט להפעלת טופס טיולים מקוון (<a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">בתוך הנחיית עבודה מס' 20</a>).<br></div></div><p><div class="callout"><p><strong><span style="color:#008000">שלום רב,</span></strong></p><p><span style="color:#1F497D">ברצוננו לעדכנך כי ניתן לסגור תואר עם 120 נ"ז ואתה צברת </span><span style="color:#FF0000">123</span><span style="color:#1F497D"> נ"ז.</span></p><p><span style="color:#1F497D">כלומר, יש להסיר קורס בהיקף 2-3 נ"ז או להוציא מחוץ </span><span style="color:#1F497D">לתכנית</span><span style="color:#1F497D"> התואר (הקורסים יופיעו בגיליון הציונים בחלק נפרד ולא ייחשבו כחלק מהממוצע הסופי לתואר).</span></p><p><span style="color:#1F497D">הקורס שבאפשרותך להסיר הוא קורס </span><span style="color:#FF0000">מהבחירה הכלל חוגית. </span></p><p><span style="color:#1F497D">מבדיקה שערכנו הקורס אותו אנו ממליצים לך להסיר/ להוציא הוא: </span></p><p><span style="color:#1F497D">"</span><span style="color:#FF0000">מדיניות חברתית</span><span style="color:#1F497D">" – ציון </span><span style="color:#FF0000">75 </span></p><p><span style="color:#1F497D">קורס זה הוא הקורס בעל הציון הכי נמוך מבין אלו שניתן להוציא.</span></p><p><span style="color:#1F497D">הגשת הבקשה להסרת קורס מגיליון הציונים הינה דרך פורטל הסטודנט:</span></p><p><span style="color:#1F497D">אפשרויות נוספות&gt; בקשות וערעורים&gt; בקשה להסרת קורסים מגיליון ציונים לפני סגירת התואר</span><span style="color:#1F497D">&gt; </span><span style="color:#1F497D">יפתח לך חלון בו עלייך לפרט האם אתה מעוניין להשמיט או להוציא את הקורס אל מחוץ לתוכנית הלימודים. </span></p><p><span style="color:#1F497D">לאחר סיום הטיפול בבקשה, באפשרותך ל</span><span style="color:#1F497D">הפעיל</span><span style="color:#1F497D"> את טופס הטיולים</span><span style="color:#1F497D"> לפי ההנחיות </span><span style="color:#1F497D">המצ"ב</span><span style="color:#1F497D"> בכדי שנוכל לסגור עבורך את התואר.</span></p><p><strong><span style="color:#008000">בברכת יום ט</span></strong><strong><span style="color:#008000">וב,</span></strong></p><p><strong><span style="color:#008000">מזכירות החוג </span></strong></p></div>נוסח לדוגמא (יש לבצע התאמות לפי הצורך) (תבנית הודעה 1285986):</p></template><template id="t18"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=LinkFilename&amp;isAscending=true&amp;viewid=641b2fdd-2b45-410d-82f8-51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 20- סגירת תארים לסטודנטים זכאים</a></p><p>בחודש אפריל נשלחת אגרת לסטודנטים ע"י ס. ראש מנהל לימודים בנוגע להפעלת טופס טיולים לצורך סגירת התואר. באגרת מופיעות הנחיות לסטודנט להפעלת טופס טיולים מקוון. את קובץ ההנחיות להפעלת טופס טיולים מקוון ניתן למצוא בטיפ בתיקיית הנחיית עבודה מס' 20:</p><p><figure><img class="shot" loading="lazy" src="images/img033.webp" alt="צילום מסך" width="714" height="190"></figure></p><p><u>תהליך עבודה:</u></p><div class="li l0 n"><span class="mk">1.</span><div class="tx">נאתר את הסטודנט בסטטוס טופס טיולים. </div></div><p><img class="ic" src="images/img034.webp" alt="" style="height:258px"></p><div class="li l0 n"><span class="mk">2.</span><div class="tx">ראשית נבדוק את הסטודנטים<strong>, </strong>נפיק גל"צ ומאזן ונוודא שאכן עמדו בכל חובות התואר</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx">נסמן וי באישור (וכך הסטטוס של הסטודנט ישתנה ל "סיים לימודיו בתהליך סגירת תואר"). </div></div><div class="li l0 n"><span class="mk">4.</span><div class="tx">בהערה / חתימה נכתוב: אישור הזכאות נשלח במייל. בהצלחה בהמשך. </div></div><p><figure><img class="shot" loading="lazy" src="images/img035.webp" alt="צילום מסך" width="900" height="346"></figure></p><p>(סטודנטים שמתקבלים להשלמת תיזה בלבד- אינם נכללים בתהליך זה).</p><div class="li l0 n"><span class="mk">5.</span><div class="tx">נבדוק את מאזן חובות הלימודים –<strong>חשוב:</strong> <strong>המאזן חייב להיות תואם למודל בדיוק, אחרת התהליך לא יעבוד.</strong></div></div><div class="li l0 n"><span class="mk">6.</span><div class="tx">נבחר במכלול: כניסה לתלמידים  דוחות   אישורי סיום  הכשרת מורים  אישורים</div></div><p>(ניתן ליצור קיצור דרך - כאשר מגיעים לפרט בתפריט, יש ללחוץ על הפרט ועל CTRL ).</p><p><figure><img class="shot" loading="lazy" src="images/img036.webp" alt="צילום מסך" width="900" height="146"></figure></p><p>נמתג את השדות הבאים: </p><p>*(נוסח- 270 במחר ו173 במדעים)&emsp;&emsp;&emsp;&emsp;   בחוג למדעי התזונה נסמן את המתגים הבאים:</p><p><figure><img class="shot" loading="lazy" src="images/img037.webp" alt="צילום מסך" width="586" height="518"></figure><figure><img class="shot" loading="lazy" src="images/img038.webp" alt="צילום מסך" width="585" height="520"></figure></p><p>לתכניות מוסמך במסלול מחקרי יש לסמן את המתגים הבאים:</p><p>*(נוסח- 289 במחר ו 184 במדעים)</p><p><figure><img class="shot" loading="lazy" src="images/img039.webp" alt="צילום מסך" width="590" height="513"></figure></p><p>נבחר את הסטודנט מהשנה האחרונה שלו בתכנית ולאשר:</p><p><figure><img class="shot" loading="lazy" src="images/img040.webp" alt="צילום מסך" width="685" height="587"></figure></p><div class="li l0 n"><span class="mk">7.</span><div class="tx">המערכת תפיק באופן אוטומטי לסטודנט אישור זכאות ותשתול אותו בתיק האלקטרוני תחת תדפיסים  אישור זכאות לתעודה.</div></div><p>שלוחה 100 נוסח 270</p><p>שלוחה 50 נוסח 173 לחוג לתזונה 175 (<strong>המשמעות שיותר לא נפיק שום נוסח אחר)</strong></p><div class="li l0 n"><span class="mk">8.</span><div class="tx">המערכת תאתר את התאריך האחרון שבו הסטודנט קיבל ציון ותשתול אותו בשדה "זכאות לתעודה"  ת.סיום חובות/ זכאות לתעודה"</div></div><p>(תאריך זה נשתל באופן אוטומטי באישור הזכאות)</p><p><figure><img class="shot" loading="lazy" src="images/img041.webp" alt="צילום מסך" width="900" height="352"></figure></p><div class="li l0 n"><span class="mk">9.</span><div class="tx">נכנס לכרטיס הסטודנט  נשנה לסטטוס בוגר/ת (סטטוס 37) או בוגר/ת-מוסמך (סטטוס 189). משלב זה לא נשתמש יותר בסטטוס זכאי לתואר. (כך נוכל להפיק גל"צ עם סטטוס בוגר).</div></div><div class="li l0 n"><span class="mk">10.</span><div class="tx">נוסיף תאריך סיום לימודים, התאריך הקובע הוא תאריך סיום הסמסטר האחרון בו למד הסטודנט ע"פ לוח השנה         האקדמי.</div></div><p><figure><img class="shot" loading="lazy" src="images/img042.webp" alt="צילום מסך" width="335" height="77"></figure></p><div class="li l0 n"><span class="mk">11.</span><div class="tx">בתוך לשונית "זכאות לתעודה" בשדה "טקס סיום" יש לבחור את שנת מועד הטקס הרלוונטי בו הסטודנט יקבל את התעודה .</div></div><p><strong><u>בסיום התהליך:</u></strong></p><p>נשלח לסטודנט זכאות וגל"צ במייל, חתומים אלקטרונית. </p><div class="li l0 n"><span class="mk">1.</span><div class="tx">נפיק גיליון ציונים עם לוגו ונשמור אותו בקובץ PDF בתיקיית J  HEB  IN  לאחר מכן הקובץ יופיע בתיקיית OUT חתום דיגיטלית ונוכל לצרף את הקובץ להודעה לסטודנט.</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">נתייק את גיליון הציונים החתום דיגיטלית בתיק האלקטרוני של הסטודנט תחת סוג מסמך 120.</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx">נשלח מתוך התיק האלקטרוני את הנוסח לסטודנט במייל:</div></div><p><img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAM4AAABUCAIAAABFgJ+2AAAGUElEQVR42u2dP2zTWBzHv24reJlwxD8bAZJFS5WoOlRGd8vW3IJAYmiHG5CSgeOo1LvpOiLdSdehGTq0UiUYujAgplR3QzdyYwhCFJEgDwxuI6EEFSlGDfgGJ43zx4kbEi4l34+synp57/nl549/z35NU6lYLIKQ/jPCEBCqRqgaIVSNUDVC1QihaoSqEULVyKAi2bbNKBBmNULVfJDJZBhfwqxGqBqhaoRQNULVCKFq5Fvy4cOHMUaB9JW9vb2RkZFyucysRvrIu3fvTp8+bRjG+/fvmdVILzFNM5/P27Z98uTJCxcunD17FsClS5dOnDhB1TzZ3d1dXl5Op9OHJUKI9k0sy3J2NE1bXFwMhULDFrTXr18DCAQC586dO3XqVLlcLpfLqqoCoGqeOJ7J03PXI7eEsGD5aybE9r8pM7WxtLS0ubnZ0c7vjC9fvpw5c+by5culUunjx48HBwcASqUSVWtHOp2ORqOqppVUXA8pvlQTMAzrZigIJbqxsWEYhqZpw2bbwcFBIBDI5/P7+/vucqrWjunp6evh8PYrc2MbmiYLtPNNADumFbKMW7piGABgGIaqqkOY2IQQV65caSinap3ylCzf1AVS5mYaQpEDAaDUVCmAElA0rYgw7uhBISuGsQugWCwe3r0Nm23NhVTNl243dVgp88EOoMqiObkVUSxYcwHjbiQoZGU49epoHlXza9ucDsC8m4Yly3IAgeorBaBo4nfNWIoEhawwVM04n/TmEi58rl9AyHO6uhwyRLEYEJAFZAEIWAUsqju/6vSsnWq2bTOrHc22O7oKGKtmSNWEAIxdKxo0liJCVjhvdrhdo2p+Vspcj5CyMq8DqZ3togqIqDB/1oWsaO5qdM5JY1Tt <div class="li l0 n"><span class="mk">6.</span><div class="tx">בסיום כל סגירת תואר, יש למלא טבלת מעקב חוגית באקסל הכוללת את שם הסטודנט, ת"ז, חוג, וממוצע ציונים. לאחר הפקת  דוח 507 יש להשוות את הממוצעים ולוודא שתקין.</div></div><div class="li l0 n"><span class="mk">7.</span><div class="tx">לאחר קבלת פרטי הסטודנטים המצטיינים ממדור בוגרים נעדכן אזכור על הצטיינות/ הצטיינות יתרה </div></div><p>זכאות לתעודה  רמת סיום . <u>שימו לב- אין צור</u><u>ך</u><u> לשנות סטטוס כמו בשנים קודמות</u></p><p><figure><img class="shot" loading="lazy" src="images/img045.webp" alt="צילום מסך" width="515" height="257"></figure></p><p>דגשים:</p><div class="li l0"><span class="mk">•</span><div class="tx">עלינו לעבוד בצמוד לצ'ק ליסט על מנת לוודא שהסטודנט עמד בכל חובותיו האקדמיים.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">חשוב מאוד להקפיד לסמן קוד טקס סיום לפי הקוד הרלוונטי לאותה השנה.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">בהפקת גיליון ציונים עלינו להקפיד להפיק את הגל"צ דרך "מתקדם" ולא לסמן V ב"מטרת לימודים".</div></div><div class="li l0"><span class="mk">•</span><div class="tx">חשוב להשוות את הממוצע בגיליון הציונים לממוצע באישור הזכאות.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">הוספת מנוי במכלול לסטודנטים שנסגר עבורם תואר בראשים ישן או בתוס</div></div><div class="li l0"><span class="mk">•</span><div class="tx">במידה ויש צורך בהסרת/ השמטת קורסים- נפעל באופן הבא:</div></div><p>נכנסים לתכנית הלימודים בשנה הרלוונטית בה הקורס שרוצים להשמיט/ להוציא מתכנית הלימודים נלמד  בחירת הקורס המבוקש  נתונים מיוחדים לתלמיד. </p><p><strong>השמטה</strong><strong> (הקורס לא יופיע כלל בגיליון הציונים, לא יכנס לסך נ"ז שנצברו לתואר ואף לא יחשב לממוצע)</strong><strong>:</strong> </p><p><img class="ic" src="images/img046.webp" alt="" style="height:175px"></p><p><strong> הוצאה מ</strong><strong>חוץ </strong><strong>ל</strong><strong>תכנית</strong><strong> הלימודים</strong><strong> (הקורס יופיע בסוף גיליון הציונים, לא יכנס לסך נ"ז שנצברו לתואר ואף לא יחשב לממוצע)</strong><strong>:</strong></p><p><img class="ic" src="images/img047.webp" alt="" style="height:182px"></p><p>בשלב זה יש להפיק דו"ח 507 (זכאים לתואר) בתוך הדו"ח יש למלא הערה על כל סטודנט לפי הפרמטרים הבאים:</p><p>פורס לימודים (כמה שנים פרס לימודים), שייכות למרכז חממ"ה, סטודנט חוזר, בעל הכרות ופטורים (בנ"ז), פטור לא אקדמי באנגלית,  הערת משמעת, באמצעות הערות אלה יקבע מי עונה על הקריטריונים להצטיינות <a href="https://telhaimng.sharepoint.com/sites/tip/DocLib11/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05e0%5F%5Fx05d5%5F%5Fx05d4%5F%5Fx05dc%5F&amp;isAscending=true&amp;viewid=620ad446%2Dfa86%2D4f40%2Db1c6%2D4d65186206c2" target="_blank" rel="noopener">(למידע נוסף ראה נוהל קביעת בוגרים מצטיינים ומצטיינים יתרה 300).</a> את הדו"ח המלא יש לשלוח לרכזות פקולטה לקראת טקס חלוקת התארים.</p><p>הנחיות להפקת דו"ח 507:</p><p>הפקת הדוח פעמיים:</p><div class="li l0 n"><span class="mk">1.</span><div class="tx">הפקת דוח זכאים 507 א' - נמתג את השדות- "חוגי לימוד מכיל" עם שם החוג ושדה-  "טקס סיום מכיל" עם הטקס הרלוונטי. על דו"ח זה נעדכן את כל ההערות. בדו"ח קיימת עמודה לגביי פטור לא אקדמי באנגלית, ועמודה שמחשבת נ"ז מפטור בה ניתן לבדוק האם הסטודנט למד פחות מ60% נ"ז במכללה. </div></div><p>יש להוסיף לדו"ח עמודה שמחשבת נ"ז נצבר ללא פטור ונ"ז נצבר מפטור ולבדוק שכל הבוגרים/ מוסמכים השלימו את הנ"ז הנדרש לסגירת תואר, אין לסגור תואר עם עודף נ"ז אלא עם אישורה של זהבה שמואל.</p><div class="li l0 n"><span class="mk">2.</span><div class="tx">כדי לקבל מידע לגביי סטודנטים השייכים למרכז תמיכה וסטודנטים עם הערת משמעת- נפיק את דו"ח 507 ב', נמתג שוב את השדות- "חוגי לימוד מכיל" עם שם החוג ושדה-  "טקס סיום מכיל" עם הטקס הרלוונטי. את המידע על הסטודנטים עם שייכות למרכז חממ"ה וסטודנטים עם הערת משמעת  נקבל  בעמודה "מאפיין".</div></div><p>(מסיבות טכניות לא ניתן לקבל את כלל הנתונים בהפקה אחת).</p><p><img class="ic" src="images/img048.webp" alt="" style="height:166px">לאחר שנקבל את הנתונים, נוסיף הערת "מרכז חממ"ה" ו"עבירות משמעת" לבוגר/ מוסמך הרלוונטי בדו"ח 507 א'.</p><p><strong><u>סגירת תארים לסטודנט/</u></strong><strong><u>ית</u></strong><strong><u> משלים לתזה</u></strong></p><div class="li l0 n"><span class="mk">1.</span><div class="tx">סטודנט/ית משלים/ה לתזה יתקבלו לחוג ראשי שנקרא "מוסמך לימודי גליל- השלמה לתזה/ מוסמך חינוך- השלמה לתזה". סטאטוס קבלה 507  - תלמיד מן המניין – משלים לתזה </div></div><p><figure><img class="shot" loading="lazy" src="images/img049.webp" alt="צילום מסך" width="398" height="64"></figure></p><p>בעת סיום חובות התיזה:</p><div class="li l0 n"><span class="mk">1.</span><div class="tx">נזין סטטוס מסיים 40 – סיים תכנית השלמה לתזה</div></div><div class="li l0 n"><span class="mk">2.</span><div class="tx">נוסח אישור השלמה תזה – (287 למח"ר  ו198 למדעים)- דיקן פקולטה יהיה חתום עליו כפי שמקובל במוסדות אחרים.</div></div><div class="li l0 n"><span class="mk">3.</span><div class="tx">בעת ההפקה יש להוסיף על גבי הנוסח את הפרטים הבאים (לא ניתן למשוך אותם ממכלול בשלב זה:</div></div><p>נושא העבודה</p><p>בהנחיית: (שם המנחה)</p><p>ציון העבודה</p><div class="li l0 n"><span class="mk">4.</span><div class="tx">תאריך הקלדת הציון ימשך אוטומטית מהמכלול.</div></div><div class="li l0 n"><span class="mk">5.</span><div class="tx">יש להוסיף גל"צ של הקורסים שנלמדו בשנת ההשלמה.</div></div><div class="li l0 n"><span class="mk">6.</span><div class="tx">תעודת סיום בטקס בוגרים-  ננפיק כתעודה פנימית שתינתן בטקס הבוגרים את הנוסח שנשלח במועד סיום התזה, לשם מתן כבוד לסטודנטים המסיימים - יודפס על דף תעודה מעוצב (כמו של תעודה נלווית)  ויכנס לפולדר. (ההדפסה תתבצע ע"י רכזת פקולטה בעת הדפסת תעודות בוגרים)</div></div><p><strong><u>ביטול טופס טיולים</u></strong></p><p>סטודנט שמעוניין לבטל הפעלת טופס טיולים או שמזכירות החוג צריכה לבטל את הטופס מאחר והסטודנט לא צבר את הנ"ז הנדרש לסגירת התואר ו/או לא עמד בכל החובות האקדמיים.</p><p>במידה וסטודנט פתח טופס טיולים אך טרם צבר את הנ"ז הנדרש לסגירת תואר- יש לבטל את טופס הטיולים ולעדכן את הסטודנט שעליו לפתוח טופס טיולים רק לאחר צבירת הנ"ז הנדרש לסגירת התואר (משמע, אין להשאיר את טופס הטיולים פתוח ולהמתין לעדכון ציונים אחרונים). זאת מאחר ולא ניתן לערער על ציונים לאחר סגירת התואר. כאשר הסטודנט פותח מחדש טופס טיולים לאחר קבלת הציון האחרון לתואר, הוא בעצם מאשר את כל הציונים שלו ואת הממוצע הסופי לתואר.</p><p><u>תהליך עבודה:</u></p><div class="li l3 n"><span class="mk">1.</span><div class="tx">בפורטל טופס טיולים נאתר את הסטודנט שיש לבטל לו את טופס הטיולים ונלחץ על "ביטול טופס טיולים"</div></div><p><figure><img class="shot" loading="lazy" src="images/img050.webp" alt="צילום מסך" width="519" height="126"></figure></p><div class="li l3 n"><span class="mk">2.</span><div class="tx">פתיחת כרטיס הסטודנט במכלול  לשונית משימות  מחיקת המשימות הקשורות לטופס הטיולים  עומדים על השורה הרלוונטית ולוחצים על מחק <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAC8AAAAwCAIAAAAOxbS1AAAENElEQVR42u1YbUxbZRQ+7W5bCqMrY4BIb79wmWwumc4PFJgEJKs/9sNtgWSj+DGk05io0w3jssT4sShbiCbTWcJcmEgYazbNTGQWtwADNydMcGTEweXeUglfxUrHBNp7Xn/QAhsTuZcuq6Yn75/7vOec++S85z3n5JU4nS4IGZFCKEmYTZiNGJF4rk+GDhsKEUOIDc+TcGz+f2wIotIzAsP9Q4roaI3u9kqIUvaat/2XXtqoX/+IUDYC8masl4n++ftx9x/U8nv7Xevi1667VePGdVnrBfevLfWe8dVrHhTkHAAkzt9HFq7ddLwiffC3FcnJPp7HkeFLigTjlnxKJvdvt7XEtNT94OifzNyUmpklpt44eoX18GttlycunsuI4qXuIezqbF+mT3yrhCIorTosr//6pCH1idffVqtjRFY/lh0SaoOIbbWn77FXr3K0j424+h42RfgmPT/WXXlur2nnq4uqxQwzKM5y1DXcXfEZ/c1h3yQ/AcDuOfTkM7l37YYvjVmuX5UyrlBGKZeo+An3ALf4YiGSjYQgOXFEcfwTSWxCc9Z27ZWmjDNHGun71mzctKiTunrVKcJsyemvxir2R8qU9pwd2S+85B4Zlh14UznA/vlRTUxcvPiJApEIXb767yZsh5bK5PaVGZnPWhCJSh07+sr7f8mU7qOlIhxOLykKFHdnh/zkp5R3vEMe/8DLxYSQKTwuIbHvxXdSfqrtar+MYoVCIT1cQjCp6Vsv8fESWd/TZkPMitnmurXrLz5VEHnqGKYcFH1SAsTrclGeQUqucAOlfyh1roI+b4f3xuRALyc2NoL6FABPyWLVqo5Rolqmnmsrk0dMmDbjQH9souaO33ClSn0p7n66r78nKzc1Muq2tisfTUPkxRUOihfYZmPTTa0R0asf2zCvoVSoW39eNjd3hme/f5zSw3NxUCbRux0bzlpY+Dk3C9AV2MrNyXPwnH32kg0A0LAn51hyeUF34Xt2AABILii3mXULJNMtOVPbKoS9/QOTVWe15YO1aD/stVqmfsRVbi1qzCmzWnTAVFq2fskZzVZbvg6gsXhjpbEsoBbkzoCYnZ7BsCwiIRDol4hIbyvK4OwNLCLq09KNuu0fbqMRETEtO4AvSP5tomDLLDvL2Bmkm+OMWpogAgEgM7hBq/V/chxD04a5+EIWhfPfcJ4AAPKB5HLUNUJ2cRKi42YckAAAj8gznMOoTULkb8GDksWEAAH0K/VUl9Sl7a7S4NRJTeMAQAghQBCR4Rz6NM30xjQeFDZICEx5O3tgyz54o2l3EiLOxmfFABE5xkEb8ubiGJR64/dGzpd+QZeez6WJ328An4kNACDhLpyFx99NQsKdML9W0wMAAIY8JAtkI6mpbphv33l018ew6+DzmpCoxQg3x+AOv/tVVZ4L96nwS9t/nA3DdoUOm78Btc1wrRrr1rYAAAAASUVORK5CYII=" alt="" style="height:37px">. יש למחוק את משימות- תחנת ספריה, תחנת מדור שכ"ל ותחנת רכזת חוג.</div></div><p><figure><img class="shot" loading="lazy" src="images/img052.webp" alt="צילום מסך" width="555" height="326"></figure></p><div class="li l0 n"><span class="mk">3.</span><div class="tx">החזרת הסטודנט לסטטוס בו היה לפני שהפעיל טופס  טיולים. בד"כ 69- תלמיד מן המניין.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">במידה ולא נבצע את הפעולות הנ"ל, הסטודנט לא יוכל להפעיל את טופס הטיולים שנית.</div></div><p><strong><u>הכשרה מעשית</u></strong></p><p>במקרה שסטודנט לא עובר עבודה מעשית ונכשל, נוסיף משפט לגיליון הציונים-</p><p>הסטודנט לא השלים חובותיו בקורס לימודי שדה בשנה ג' (עבודה מעשית) . קיבל בקורס ציון "נכשל" את הנ"ז החסרות השלים בקורסי בחירה אחרים מהחוג ל......</p><p><figure><img class="shot" loading="lazy" src="images/img053.webp" alt="צילום מסך" width="900" height="262"></figure></p></template><template id="t19"><p>ראה/י ערך קודם בחודש מרץ.</p></template><template id="t20"><p><span style="color:#385623">משימה באחריות רכזת בכירה</span></p><p>באחריות משאבי אנוש להעביר את החלטת ההנהלה על היקף התקנים לחוג. </p></template><template id="t21"><p>לקראת תהליך בניית מערכת השעות לשנה"ל הבאה, יש לאסוף מכל מרצה את הזמינות שלו לימי הוראה בשנה הבאה. מאחר ושליחת זמינות נעשית ע"י פורטל מרצה, מרצה שאינו מעודכן במכלול לא יוכל למלא בקשת זמינות.</p><p>את בקשות הזמינות יעבירו המרצים באמצעות פורטל המרצה באופן הבא (ניתן לשלוח את ההנחיות הבאות למרצים יחד עם ההודעה על העברת הזמינויות):</p><p><strong><u>עדכון זמינות להוראה- פורטל המרצה</u></strong></p><p>כניסה לפורטל מרצה  אפשרויות נוספות ניהול זמינות</p><p>יש להתייצב על לשונית "זמינות"</p><p>לבחור את השנה הרלוונטית</p><p><figure><img class="shot" loading="lazy" s וב ומחיקה של כל השורה ע"י ה-X האדום.</p><p><div class="callout"><p><span style="color:#002060">מרצים יקרים שלום רב,</span></p><p><span style="color:#002060">כמידי</span><span style="color:#002060"> שנה בתקופה זו אנו נערכים לבניית מערכת שעות לשנה הבאה. החל משנה זו מילוי בקשתכם לזמינות תעשה בפורטל המרצה. לנוחיותכם, מצורף דף הנחיות.</span></p><p><span style="color:#002060">בשלב זה עדיין לא התקבלו אישורי הנהלה על היקפי ההעסקה ופנייתנו זו אליכם, נעשית רק למטרת זמינות. </span></p><p><span style="color:#002060">בכדי ליצור יציבות במערכת השעות, הנטייה היא להשאיר את ימי ההוראה כפי שהינם כיום ולערוך מינימום שינויים, אך עקב אילוצים שונים, לא נוכל להתחייב לכך. </span></p><p><span style="color:#002060">נבקשכם לציין את הזמינות המרבית להוראה. מרצים שיכולים לעבור מימי ג' וד' לימים א' וה' ,בכדי להקל על העומס, נשמח אם תציינו זאת בהערות.</span></p><p><span style="color:#002060">כיון שבקשת זמינותכם נגישה לכלל הרכזות, גם מרצים משותפים, יכולים למלא את הטופס </span><u><span style="color:#002060">פעם אחת בלבד</span></u><span style="color:#002060"> בפורטל המרצה. </span></p><p><span style="color:#002060">יש למלא את בקשת הזמינות עד לתאריך</span><span style="color:#002060"> .........</span><span style="color:#002060">. במועד זה, ייאספו כל הנתונים. מידע שיתקבל לאחר מועד זה, לצערנו, לא יוכל להילקח בחשבון. </span></p></div><strong><u>הצעה לנוסח למשלוח למרצים (יש לעדכן בכל שנה בהתאם)</u></strong></p><p><u>לאחר מילוי </u><u>הזמינויות</u><u> ע"י המרצים, ניתן לצפות בבקשותיהם באופן הבא:</u></p><div class="li l0 n"><span class="mk">4.</span><div class="tx">מערכת שעות &gt; סגל &gt; תצוגת מערכת שנתית &gt; בחירת השנה והמרצה</div></div><div class="li l0 n"><span class="mk">5.</span><div class="tx">הפקת דו"ח 539</div></div><p><figure><img class="shot" loading="lazy" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASMAAACsCAIAAAC/013DAAAbhElEQVR42u2de1xU1drHnzXMBIomNzVArs6oEaaieYFMM6HALnoKiuxVMgPJjgwd73GCPJzI1Fc4HQXMCvSYCXHUt4AUS60gtRPqCTFhQFARNZWbGDAze71/7D0ze88FuQyXhuf7mY/uWXuttddee/14nrX23s8QpxEjrMdPOfb IKHXY3A2IJ/RaERzvrq6qtfrZcgnaCpIkjSZTJlMRpb8EA6Hp6amcM3Av4RhmPHxcZnzoMvl4jiuonArmt1uL8oYOp2O4zir1UpRVMnFU2+9RlHUwsJCIBDARw8GgxzHFXlyHLe7uwvXN27BYBBPozRNI5Hg2bBV6kGe5/1+P8rreH/57NSi+2U10Er9rXAr3P8Pbp7nrecN7R2wjTdgBcKyLPSEdQFywEsUvM0wDPSUOd4ajSbyr5EkiUpquDnjDVgGkiQZiUQCgQAsypEDPiZeh6TTabVaXcv9ic/nwx/dbneZ/ZJl2Wo2C4IgYKVZ0nNlZWV4eBi2U6mU1+utJd44aBloFP46xcqyrCAIsK5kWbaaH5FdWJ+43W6fz1cRGtW3BEGgIFWMFnTgeT6bzUKto1IkGo3ihWEt92xVQtdj+NETrkitVlt8lLy0e/vajKZpQRCklZZs3Ghyqwe66DdV+FAkSVYUmFJXKdwKt8KtcCvcCrfCrXAr3AAAAP4BtkwP/+fVkNYAAAAASUVORK5CYII=" alt="" style="height:80px"><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib14/Forms/AllItems.aspx?id=%2Fsites%2Ftip%2FDocLib14%2F%D7%9E%D7%A1%D7%9E%D7%9A%20%D7%94%D7%A0%D7%97%D7%99%D7%95%D7%AA%20%D7%9C%D7%A2%D7%95%D7%A8%D7%9B%D7%99%20%D7%AA%D7%95%D7%9B%D7%9F%20%D7%91%D7%9E%D7%9B%D7%9C%D7%9C%D7%94%2Epdf&amp;parent=%2Fsites%2Ftip%2FDocLib14" target="_blank" rel="noopener">מסמך הנחיות לעורכי תוכן במכללה</a></p><p>כחלק מהיערכות לשנה"ל העוקבת, יש צורך לערוך את השנתון החוגי. </p><div class="li l3 n"><span class="mk">1.</span><div class="tx">יש לשמור את השנתון הקיים בקובץ חדש. </div></div><div class="li l3 n"><span class="mk">2.</span><div class="tx">טרם ביצוע שינויים יש להפעיל את הפונקציה 'עקוב אחר שינויים' (סקירה—עקוב אחר שינויים) ולאחריה לערוך תיקונים בשנתון לפי תכניות הלימוד השונות, עדכון חברי הסגל- יש לבדוק את דרגות המרצים השונות ע"י הפקת דו"ח או לבדוק עם המזכיר האקדמי, בדיקת תקצירי הקורסים- לבדוק שאכן כל התקצירים קיימים, במידה ויש קורסים חדשים יש לבקש תקצירים מהמרצים, במידה ויש קורסים שלא מתקיימים יש להסיר אותם, הוספת קורסים חדשים- יש לבקש מהמרצים שם הקורס בעברית ובאנגלית (לטובת עדכון קורס האב) ותקציר. </div></div><div class="li l3 n"><span class="mk">3.</span><div class="tx">הנגשת (נגישות) השנתון לפי ההנחיות. קובץ  בדוק אם יש בעיות  בדיקת נגישות.</div></div><div class="li l0 n"><span class="mk">4.</span><div class="tx">שליחת השנתון לראש החוג להגהה ובדיקה. גם הוא צריך לעבוד עם פונקציית מעקב אחר שינויים. </div></div><p>לאחר אישור ראש החוג נפרסם את השנתון במודל החוגי ובאתר המכללה.</p></template><template id="t23"><p><span style="color:#385623">משימה באחריות רכזת בכירה</span></p><p>מאזן החובות לסטודנט נגזר כולו מהמודל: אילו קורסי חובה נלמדים בשנה א', ב' ו-ג', כמה נ"ז בחירה כלל חוגית, כמה נ"ז בחירה בכל מוקד/מקבץ.</p><p>רכזת בכירה תעדכן את המודלים של כל תכניות הלימוד בחוג לשנה"ל הרלוונטית בהתאם לשינויים בתכנית הלימודים (במידה והיו שינויים).</p><p>במידה ונפתחה תכנית לימודים /מסלול חדש, יש לבנות מודל בהתאם.</p></template><template id="t24"><p><span style="color:#385623">משימה באחריות רכזת בכירה</span></p><p>סיומי העסקה מתוכננים – סגל זוטר וממחים. ראש החוג יעביר הודעה כתובה  לאגף משאבי אנוש לרמ"ד סגל אקדמי על  חברי הסגל שיש כוונה לשנות/לצמצם/להפסיק העסקתם.</p></template><template id="t25"><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 11- הנחיות לרישום סיורים לחיוב במכלול</a></p><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib27/Forms/AllItems.aspx" target="_blank" rel="noopener">וואצ'ר להזמנת סיור</a></p><p><a href="https://telhaimng.sharepoint.com/sites/tip/DocLib26/Forms/AllItems.aspx?sortField=%5Fx05de%5F%5Fx05e1%5F%5Fx05e4%5F%5Fx05e8%5F%5Fx05d4%5F%5Fx05e0%5F%5Fx05d7%5F%5Fx05d9%5F%5Fx05d4%5F&amp;isAscending=true&amp;viewid=641b2fdd%2D2b45%2D410d%2D82f8%2D51dddb8cb085" target="_blank" rel="noopener">הנחיית עבודה מס' 28- השלמת מעבדה או סיור</a> </p><p>הנחיה זו נוצרה לקבוע הגדרות קבועות לרישום סיורים במכלול לטובת חיוב הסטודנטים בסעיף תשלום סיורים.</p><p>מתוך <a href="https://www.telhai.ac.il/%D7%AA%D7%A7%D7%A0%D7%95%D7%9F-%D7%9C%D7%99%D7%9E%D7%95%D7%93%D7%99%D7%9D" target="_blank" rel="noopener">תקנון שכר לימוד</a> (עמוד 5):</p><p>חיוב לסיורים יקבע על פי מפתח של כמות סיורים לסטודנט (חיוב על סיור יתבצע ע"פ הרשמה לקורס עם סיור ולא ע"פ השתתפות בסיור בפועל).</p><p><u>הנחיות עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx"><div class="callout"><p>משנים סוג פעילות לסיור</p></div><figure><img class="shot" loading="lazy" src="images/img061.webp" alt="צילום מסך" width="418" height="538"></figure>כרטיס הקורס  מפגשים  חדש או החלפת מפגש קיים</div></div><p><div class="callout"><p>מזינים תאריך ושעות הסיור</p></div></p><p><div class="callout"><p>מזינים את מיקום הסיור</p></div></p><p><div class="callout"><p>ללא חדר  אם קיים חדר מאפסים          בלחיצה על ctri+0</p></div></p><div class="li l0"><span class="mk">•</span><div class="tx"><u>מעקב אחר תקציב סיורים:</u></div></div><div class="li l0"><span class="mk">•</span><div class="tx">בתחילת שנה כל חוג מקבל מהנהלת חשבונות את התקציב החוגי שאושר ע"י ההנהלה (סיורים, מרצים אורחים, הוצאות תפעול חוגי, צרכי משרד וכו'). כל רכזת נדרשת לבצע מעקב אחר הסיורים על פי התקציב שאושר ובהתאם לבקשות המרצים לקיום סיורים.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">לצורך כך יש לעדכן את הסיור בקובץ התקציב בסעיף 'סיורים' על פרטיו השונים. בנוסף, יש למלא <a href="https://telhaimng.sharepoint.com/sites/tip/SitePages/%D7%98%D7%A4%D7%A1%D7%99%D7%9D(1).aspx" target="_blank" rel="noopener">טופס סיור מקוון בטיפ</a> בכדי להזמין הסעה. </div></div><div class="li l0"><span class="mk">•</span><div class="tx">לאחר שהתקבל אישור על הטופס המקוון מעדכנים את עלות ההסעה (נמצא בתחתית הטופס המקוון) בקובץ התקציב ומוודאים כי אין צפי לחריגה מהתקציב שאושר.</div></div><div class="li l0"><span class="mk">•</span><div class="tx">במידה ויש צורך בוואוצ'ר לכניסה לאתרים, יש לשלוח למדור לוגיסטיקה וואוצ'ר עם פרטי הסיור, כשמקבלים את הוואוצ'ר חזרה חתום ממירים אותו לקובץ PDF ושולחים למרצה.</div></div><p>את התכתובות מול המרצים, וואצ'רים וכל מה שנוגע לסיור שומרים בw החוגי בתיקייה הרלוונטית לסיורים<strong>.</strong></p></template><template id="t26"><p>כשהשנתון מוכן לפי הנחיית עבודה מס' 23 לעריכת השנתון , הופכים אותו לקובץ PDF ומפרסמים אותו במודל החוגי ובאתר המכללה (שליחתו למי שאחראי לעדכון אתר המכללה- קרן אליהו מהשיווק).</p><p>עדכון השנתון (לדוגמא) במודל החוגי- לכל חוג יש אתר מודל חוגי שם נמצא מידע לסטודנטים, שנתוני החוג, מערכת שעות, סרטוני הדרכה שונים המאגדים את הידע הנדרש להגיע למידע כמו- פורטל הסטודנטים, כיצד להשתבץ לקורסים, </p><p>וכן מידע נוסף במיוחד עבור הסטודנטים בשנה א',  <strong>לאתר החוג במודל לחץ כאן</strong></p><p><u>הנחיות עבודה:</u></p><div class="li l0"><span class="mk">•</span><div class="tx">בכדי לבצע שינויים במודל החוגי ( למשל: העלאת/ שינוי קובץ שנתון ) יש להפעיל את העריכה ע"י לחיצה על מתג <img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIIAAAAxCAIAAACZP+ZxAAAGIUlEQVR42u2afUwTZxzHn75d6dmupS0tlopUVCjVIr5MEFFLps6xgCwhTKcuY8oSWTKysD9c3LIXE/5xCTHRODS+MeeQbQ4MUxMD24oB5zKhs7xtWCjv0JYD2it9obc/znUN0OMOWPxjz/ev3uX7PL/nfp/e77l7nmPlf/IygHreYsMUQAxQEAPEAAUxQAxQEAPEAAUxQAxQEAPEAAUxQAxQEAPEALVIcelbVyuTosWqWLlGKozisRH6DX0Br8M5arVZhsb7/xpug0lfIAYeB8lPLViuUC2Xx6AoiqIogjDA4PV6cRzHcXzQNjAw0lfZeMkf8MHUM8MQF7UmZ+MBbaLWKrBdnLhrwQe6sH4AQDwSswpR5Yh26PmrqXtAEARBEIlEolKp4rH4KKHy+9+uW+1dMPtBcdbtokpieqLh1c156zcmX3Df/nT0YqvXMui3ewivh/AO+u2tnu7qyV+mCO9mgZZNb5qJiBCo1SsUgpgA4e+1dUMA82PgcZD9mw6J1imODZb+jD8m5vIQADRPdf7k+j05Yo2cI6YZNVoZTbi4j54+IIgAZDBPUTqYfkybqL3svNvjG6LupdNrveNsTJDG0g+ckJBwwHn0q4bzFJ6TR0rXaTaEnql7fK+8pgwAkKHPLMgqEiAoeb5v1Fpy7h3yd57h8Cup+39s+mHI3h/qcXvxS7VnjaY6AEBhdnGaLiN4CAA4ffxLAECwE1KF2cWZKXuDh6FRZvjJ8TSajeU1ZSePlKrk6oetDbs3Z3E5PACAY9J29tZps6WFMYY1yiRppMzCH7kyUEsnrVew2n3CtASELolISaRCqohXJHaNtIfznLp2IvQwz3A4Jz1PIVGeunbCaKoLZlCnSS7KLTn3fsWMSw31kFALsorI823dpjRdhjZOH2qYrfKaMpJ6MPXBKNUNlQVZRYXZxaEGUh29rYmxuq1J20uvf2S2tJDDK8otoSARtqArxSqFRHnbaSQAQSetBCBuTtxndCfKIxXRYhV9f1V9RbvVrJKrdZrk0PNmS8uN+5cFfDR9vYGi+S3jN24PvnPDbpKEfdy2Vq1lNODqhkoeh5cUpyd7aDQb03QZGfrM2U63B79x/zKZdDrDC4tBLVsZKZF2eKz0R2nxDjK6KqlEtkKuoTAUZheT935QI9iwgI9KRbIZTjppNVta8ClcIpQ+K6R9bTKxfM4khpNj0u6b9kX+E728psw+bsvZng8AiJbF+P2+tm5TuIZuD66QKBljkAuVKIpafAMMMDAxAwBQFJULlRQGinHPFuZ0MIpOpkwbp1/M1FrdUCkTyz8r+MKQsqdn2BKuxJH/gAVN0SwAAEBYPADc/+EjAm ליצור קורסים עם 0 נ"ז מהסיבה שסטודנט שלומד קורס, אנו מחויבים לזכות אותו בנ"ז בהתאם לש"ש.</p></template><template id="t29"><p><span style="color:#385623">משימה באחריות רכזת בכירה</span></p><p>בקשות להעסקה בעבור מרצים חדשים יועברו למשאבי אנוש עפ"י <a href="https://telhaimng.sharepoint.com/sites/tip/DocLib8/Forms/AllItems.aspx" target="_blank" rel="noopener">נוהל קליטת מרצה חדש 409.</a> </p><p>יש למלא <a href="https://telhaimng.sharepoint.com/sites/tip/SitePages/%D7%98%D7%A4%D7%A1%D7%99%D7%9D(1).aspx" target="_blank" rel="noopener">טופס מקוון בטיפ</a> להעסקת איש סגל חדש ולצרף את המסמכים הבאים: </p><p>1. קורות חיים מעודכנים.</p><p>2. בקשה להעסקה.</p><p>3. תעודות השכלה.</p><p>4. צילום תעודת זהות.</p></template><template id="t30"><p>טרם העברת בקשה למרצה חדש, יש להפיץ קול קורא בקרב מרצי המכללה שאינם סגל בכיר (סגל זוטר, ממ"ח, סגל עמית, מתרגלים). השליחה תתבצע לסגל מכל הפקולטות.</p><p>קיימות שתי אפשרויות לשליחת קול קורא לסגל- דרך המכלול (מומלץ) או דרך האאוטלוק.</p><p><strong>הסבר </strong><strong>שליחת ה</strong><strong>ה</strong><strong>ודעה דרך המכלול:</strong></p><p>יש לפתוח הודעה חדשה ולייעד אותה ל"סגל"</p><p>ההודעה תישלח לפי מס' שלוחה: (100- מח"ר, 50- מדעים, 200- תואר ראשון קצרין, 201- תואר שני קצרין)</p><p><figure><img class="shot" loading="lazy" src="images/img065.webp" alt="צילום מסך" width="491" height="263"></figure></p><p>לבחור מרשימת הסינונים השמורים את הסינון שנוצר ע"י עדי סופר- בשם "קול קורא- רשימת מרצים לשליחה" (הסינון יפתח רק לאחר סימון שההודעה מיועדת לסגל):</p><p><figure><img class="shot" loading="lazy" src="images/img066.webp" alt="צילום מסך" width="900" height="468"></figure></p><p>יש לשכפל ולשלוח את ההודעה כמספר השלוחות אליהן רוצים לשלוח-  כל פעם לשלוחה אחת, על מנת לשלוח למרצים בכל השלוחות הרלוונטיות. </p><p>(לוודא בכל פעם להוריד את ה V מ"הודעה שנשלחה" אחרי השכפול)</p><p><figure><img class="shot" loading="lazy" src="images/img067.webp" alt="צילום מסך" width="595" height="127"></figure></p><p><strong><u>נוסח להודעה</u></strong><strong><u>- קיימת תבנית בהודעות מס' 1185955</u></strong></p><p><strong>נושא</strong>- קול קורא להוראת קורס בחוג________ </p><p><strong><u>מלל ההודעה:</u></strong></p><p>שלום רב,</p><p>מצ"ב קול קורא בחוג_____ להוראה בקורס ____  בשנה"ל  _______</p><p>מועמדים העונים לכישורים הנדרשים ומעוניינים ללמד תחום זה, מוזמנים להגיש מועמדות ולשלוח קו"ח לדוא"ל _____________ עד לתאריך ____</p><p>בברכה,</p><p>מזכירות החוג____</p><p>*יש לצרף את קובץ פורמט קול קורא עם כל הפרטים בנוגע לקורס- (הפורמט מופיע בטיפ בעזרים כלליים)</p><p><strong><u>נוסח המשך- לאחר קבלת פניות ממועמדים</u></strong></p><p>להלן נוסח כללי שניתן לשלוח אל מי שלא התקבל, על מנת לסיים מולו את התהליך באופן מכובד ולא להתעלם משליחת הבקשה שלו (מנוסח בלשון זכר, יש להתאים לפי מין השולח):</p><p>שלום רב,</p><p>מודים לך על פנייתך ושליחת קורות החיים על הקול קורא שהוצאנו.</p><p>לתחום הנוכחי נמצא מועמד מתאים אחר.</p><p>תוכל להגיש מועמדות לקולות קוראים בעתיד.</p><p>בברכת הצלחה בהמשך.</p><p>ראש החוג ל_________________</p><p><strong><u>לאחר בחירת מועמד:</u></strong></p><p>עם המועמד הנבחר- ממשיכים את תהליך הקליטה כרגיל.</p><p>במידה והמועמד שנבחר כבר קיים במכלול אבל מלמד בחוג אחר, יש לעדכן את משאבי אנוש על מנת שתעדכן בתיקיות הציבוריות באאוטלוק שהוא שייך גם לחוג שלכן מעכשיו.</p><p><strong><u>הסבר </u></strong><strong><u>שליחת הודעה דרך המייל</u></strong></p><p>לחיצה על שלושת הנקודות&gt;&gt; תיקיות:</p><p><img class="ic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARUAAACdCAIAAAAVGHu0AAAUuElEQVR42u2de1QT177Hf3DtrVyvR/JAsGrQ0ABqW6/UazEsHz0+Sg8JIPTYtax3BbCI7a21VrDgI2q6Ciigtda2ghRyiq6lB1BiUrXgoywD0So966x6JKREUbQoeWDtUXqulPvHxukweZCEEAL8Pv8w2XuzZ2Znf+f327+Z+cWnu7sbCDeKE96H3ZWrplAb5zLD1hzrqYUZG09XrpoCnuTq1avBwcGAIN6Kz+/68T5QP4NOfn6+QCCIi4vDobCKLw4BgrjMKByCYUxpaWlVVRWjMCMjo6SkBACKioqqqqo0Go1YLM7Ly6MMTkhISGpqqsFgOHbsGOmktLSU1MbFxSUlJdF7Iy3JNpfLLSoqIp2o1WqqDemnubk5NzeXNKBvk87p3VrtMzU1lRyzrZNqb2+3ei7ovyHuITU1NTk5WSgUAkBWVpZYLBYKhWSykqlWVVWlVCrJfKUaMHrIzMy0NSnz8/ONRmNOTg5Dw2q1uqioiK6ZqqoqnU6Xnp5OdhQZGWnLRaT3aeuQqJOydS7ovyEDRVRUVFRUFJFEXFycwWBobm621ZjL5d69e9dWbXp6emNjI6O גיש טופס עם הפרטים המלאים עד חודש לפני תחילת שנת הלימודים.</p><p>באחריות רכזת החוג להעביר את הפרטים המלאים של בודקי העבודות למשאבי אנוש לצורך עדכון פרטיהם במכלול. על הבודק להחזיר למשאבי אנוש טפסי קליטה מלאים וחתומים טרם תחילת עבודתו. לאחר בדיקת העבודות בפועל על הבודק/ת למלא טופס בקשה לתשלום בגין בדיקת תרגילים. את הטופס החתום יש לשלוח לרכזת החוג והיא תאשר את הטופס תוך ביצוע מעקב אחר ניצול התקציב ותעביר לטיפול משאבי אנוש.  </p></template><template id="t32"><div class="li l0"><span class="mk">•</span><div class="tx"><strong>אתר האינטרנט החוגי</strong></div></div><p>פתיחת קורס לאתרי החוגים במודל:</p><p>קיים קורס אב בשתי הפקולטות בשם "אתר חוג במודל" 9999100 </p><p>סוג שיעור לקורס זה הוא 139 – אתר חוג למודל.</p><p>כל רכזת תפתח שיעור עם מספר קורס האב של החוג הרלוונטי בשנה"ל הרלוונטית. </p><p>חוג שיש לו מספר תכניות ישתמש באותו קוד קורס עם קבוצות שונות (שימו לב לתקשוב בהמשך).</p><p><strong>רק סטודנטים הרשומים לקורס יהיו חשופים לאתר החוגי.</strong></p><p>בשם השיעור נוסיף את שם החוג + השנה הפדגוגית הרלוונטית</p><p>המרצים שנוסיף בשיעור: רכזת/רכזות החוג הרלוונטי, ראש החוג/תכנית, זהבה שמואל , רכזת פקולטה</p><p><figure><img class="shot" loading="lazy" src="images/img072.webp" alt="צילום מסך" width="886" height="526"></figure></p><p>באמצעות באצ' נשבץ את כל הסטודנטים בחוג לשיעור. יש לזכור סטודנטים דו-חוגיים ישובצו לשני החוגים.</p><p>תקשוב הקורס- בכל שנה רכזת הפקולטה תיפתח פניה למוקד להעלות את אתר המודל שנה ולתקשב את הקורסים הרלוונטים. לידיעה- כך מסומן התקשוב:</p><p>בלשונית שונות&gt; מתבצע התקשוב</p><p><figure><img class="shot" loading="lazy" src="images/img073.webp" alt="צילום מסך" width="557" height="364"></figure></p><p>במידה ויש בחוג מספר תכניות ופתחנו קבוצה לכל תכנית, יש לתקשב ולסמן קבוצות נפרדות:</p><p><figure><img class="shot" loading="lazy" src="images/img074.webp" alt="צילום מסך" width="518" height="210"></figure></p><p><strong><u>י</u></strong><strong><u>בוא החומרים בין השנים:</u></strong></p><p>נעביר את כל החומרים שנמצאים באתר המודל הישן לאתר החדש באמצעות יבוא:</p><p><a hr
